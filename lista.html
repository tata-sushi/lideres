<style>
*, *::before, *::after { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
:root {
  --carbon:#35383F; --citric:#CFFF00;
  --bg:#F4F4F4; --white:#FFFFFF; --border:#E2E2E2;
  --t1:#111111; --t2:#555555; --t3:#999999;
  --r:6px;
}
html { -webkit-font-smoothing:antialiased; }
body { font-family:"DM Sans",sans-serif; background:var(--bg); color:var(--t1); min-height:100vh; }

.header { position:sticky; top:0; z-index:200; background:var(--white); border-bottom:1px solid var(--border); padding:0 16px; height:52px; display:flex; align-items:center; gap:10px; }
.header-badge { width:28px; height:28px; background:var(--carbon); border-radius:4px; display:flex; align-items:center; justify-content:center; flex-shrink:0; }
.header-badge span { color:var(--citric); font-family:"DM Mono",monospace; font-size:11px; font-weight:600; }
.header-title { font-size:14px; font-weight:600; }
.header-sub { font-family:"DM Mono",monospace; font-size:10px; color:var(--t3); text-transform:uppercase; letter-spacing:.08em; }

.wrap { max-width:820px; margin:0 auto; padding:24px 20px 80px; }

.intro { margin-bottom:18px; }
.intro h1 { font-size:20px; font-weight:700; margin-bottom:6px; }
.intro p { font-size:13px; color:var(--t2); line-height:1.5; }

#search { width:100%; height:38px; border:1px solid var(--border); border-radius:var(--r); padding:0 12px; font-size:13px; font-family:inherit; background:var(--white); margin-bottom:16px; }
#search:focus { outline:none; border-color:var(--carbon); }

table { width:100%; border-collapse:collapse; background:var(--white); border:1px solid var(--border); border-radius:var(--r); overflow:hidden; }
thead th { text-align:left; font-family:"DM Mono",monospace; font-size:9px; text-transform:uppercase; letter-spacing:.08em; color:var(--t3); padding:8px 10px; border-bottom:1px solid var(--border); background:#FAFAFA; }
tbody td { padding:9px 10px; border-bottom:1px solid var(--border); font-size:13px; vertical-align:middle; }
tbody tr:last-child td { border-bottom:none; }
tbody tr:hover { background:#FAFAFA; }
tbody tr.hidden { display:none; }

.col-num { font-family:"DM Mono",monospace; color:var(--t3); width:44px; text-align:right; }
.col-nome { font-weight:600; }
.col-endereco a { font-family:"DM Mono",monospace; font-size:12px; color:var(--t1); text-decoration:none; word-break:break-all; }
.col-endereco a:hover { text-decoration:underline; color:var(--carbon); }

.empty-msg { text-align:center; padding:40px; color:var(--t3); font-size:13px; display:none; }

@media (max-width:600px) {
  .col-endereco a { font-size:11px; }
}
</style>
</head>
<body>

<div class="header">
  <div class="header-badge"><span>TS</span></div>
  <div>
    <div class="header-title">Lista de Páginas</div>
    <div class="header-sub">lideres.tatasushi.tech</div>
  </div>
</div>

<div class="wrap">
  <div class="intro">
    <h1>Todas as páginas HTML numeradas</h1>
    <p>84 páginas do repositório, numeradas para facilitar a classificação. Clique no endereço para abrir a página.</p>
  </div>

  <input type="text" id="search" placeholder="Buscar por nome ou endereço...">

  <table>
    <thead>
      <tr>
        <th class="col-num">#</th>
        <th>Página</th>
        <th>Endereço</th>
      </tr>
    </thead>
    <tbody id="tbody"></tbody>
  </table>
  <div class="empty-msg" id="emptyMsg">Nenhuma página encontrada com esse filtro.</div>
</div>

function escapeHtml(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

const tbody = document.getElementById('tbody');
ITEMS.forEach((it, i) => {
  const tr = document.createElement('tr');
  tr.dataset.search = (it.title + ' ' + it.path).toLowerCase();
  tr.innerHTML = `
    <td class="col-num">${i + 1}</td>
    <td class="col-nome">${escapeHtml(it.title)}</td>
    <td class="col-endereco"><a href="/${it.path}">/${escapeHtml(it.path)}</a></td>
  `;
  tbody.appendChild(tr);
});

document.getElementById('search').addEventListener('input', (e) => {
  const q = e.target.value.toLowerCase();
  let anyVisible = false;
  tbody.querySelectorAll('tr').forEach(tr => {
    const visible = !q || tr.dataset.search.includes(q);
    tr.classList.toggle('hidden', !visible);
    if (visible) anyVisible = true;
  });
  document.getElementById('emptyMsg').style.display = anyVisible ? 'none' : 'block';
});
