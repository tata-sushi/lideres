<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TATÁ · Cardápio &amp; Compras</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --bg: #F4F4F4; --surface: #FFFFFF; --carbon: #35383F; --citric: #CFFF00;
  --text: #111111; --mid: #555555; --muted: #999999; --border: #E2E2E2;
  --radius: 8px; --shadow: 0 1px 4px rgba(0,0,0,0.07);
}
body { font-family: 'DM Sans', sans-serif; background: var(--bg); color: var(--text); font-size: 14px; min-height: 100vh; }

/* ── HEADER ── */
.header { background: var(--surface); border-bottom: 1px solid var(--border); padding: 14px 20px; display: flex; align-items: center; gap: 12px; position: sticky; top: 0; z-index: 100; }
.header-info { flex: 1; min-width: 0; }
.header-title { font-size: 18px; font-weight: 700; color: var(--carbon); letter-spacing: -0.3px; line-height: 1.2; }
.header-user { font-family: 'DM Mono', monospace; font-size: 10px; color: var(--muted); letter-spacing: 0.5px; text-transform: uppercase; margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.header-plus { width: 32px; height: 32px; background: var(--carbon); border: none; border-radius: var(--radius); display: flex; align-items: center; justify-content: center; cursor: pointer; flex-shrink: 0; transition: opacity 0.15s; }
.header-plus:hover { opacity: 0.85; }
.header-plus svg { width: 16px; height: 16px; stroke: var(--citric); fill: none; stroke-width: 2.5; stroke-linecap: round; }

/* ── TABS ── */
.tabs { display: flex; overflow-x: auto; background: var(--surface); border-bottom: 2px solid var(--border); scrollbar-width: none; -ms-overflow-style: none; }
.tabs::-webkit-scrollbar { display: none; }
.tab-btn { flex: 1 0 auto; min-width: max-content; white-space: nowrap; padding: 16px 24px; border: none; background: transparent; font-family: 'DM Mono', monospace; font-size: 11px; font-weight: 500; letter-spacing: 1.5px; text-transform: uppercase; color: var(--muted); cursor: pointer; transition: all 0.18s; border-bottom: 2px solid transparent; margin-bottom: -2px; }
.tab-btn:hover:not(.active) { color: var(--carbon); background: var(--bg); }
.tab-btn.active { background: var(--carbon); color: var(--citric); border-bottom-color: var(--carbon); }

/* ── CONTENT ── */
.content { padding: 16px 20px 100px; }
.page { display: none; flex-direction: column; gap: 12px; }
.page.active { display: flex; }

/* ── SECTION LABEL ── */
.sec-label { font-family: 'DM Mono', monospace; font-size: 9px; font-weight: 500; letter-spacing: 1.4px; text-transform: uppercase; color: var(--muted); display: flex; align-items: center; gap: 8px; }
.sec-label::after { content: ''; flex: 1; height: 1px; background: var(--border); }

/* ── CARD ── */
.card { background: var(--surface); border-radius: var(--radius); border: 1px solid var(--border); overflow: hidden; box-shadow: var(--shadow); transition: box-shadow 0.15s; }
.card:hover { box-shadow: 0 3px 12px rgba(0,0,0,0.1); }
.card-header { padding: 14px 16px 10px; border-bottom: 1px solid var(--border); display: flex; align-items: flex-start; justify-content: space-between; gap: 10px; }
.order-id { font-family: 'DM Mono', monospace; font-size: 11px; color: var(--muted); margin-bottom: 3px; }
.order-title { font-size: 14px; font-weight: 700; color: var(--carbon); line-height: 1.3; }
.card-body { padding: 12px 16px; display: grid; grid-template-columns: 1fr 1fr; gap: 8px 16px; }
.card-field { display: flex; flex-direction: column; gap: 1px; }
.field-label { font-family: 'DM Mono', monospace; font-size: 9px; letter-spacing: 0.8px; text-transform: uppercase; color: var(--muted); }
.field-value { font-size: 13px; color: var(--carbon); font-weight: 500; }
.card-footer { border-top: 1px solid var(--border); padding: 10px 16px; display: flex; align-items: center; justify-content: space-between; gap: 10px; background: #FAFAFA; }
.meta-pill { font-family: 'DM Mono', monospace; font-size: 11px; color: var(--mid); }

/* ── BADGES ── */
.badge { display: inline-flex; align-items: center; padding: 3px 9px; border-radius: 100px; font-family: 'DM Mono', monospace; font-size: 10px; font-weight: 500; letter-spacing: 0.3px; white-space: nowrap; flex-shrink: 0; }
.b-rascunho  { background: #F0F0F0; color: #888888; }
.b-enviado   { background: #E8F0FA; color: #1A3A5C; }
.b-proc      { background: #FFF4DC; color: #7A4A00; }
.b-aguardando{ background: #EAF4ED; color: #1A5C2A; }
.b-concluido { background: var(--carbon); color: var(--citric); }
.b-parcial   { background: #FFF0E6; color: #8B3A00; }

/* ── KPI GRID ── */
.kpi-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.kpi-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 14px; display: flex; flex-direction: column; align-items: center; text-align: center; gap: 4px; box-shadow: var(--shadow); }
.kpi-label { font-family: 'DM Mono', monospace; font-size: 9px; font-weight: 500; letter-spacing: 0.8px; text-transform: uppercase; color: var(--mid); }
.kpi-number { font-size: 28px; font-weight: 700; color: var(--carbon); line-height: 1; }
.kpi-sub { font-family: 'DM Mono', monospace; font-size: 10px; color: var(--muted); }

/* ── EMPTY STATE ── */
.empty { text-align: center; padding: 60px 20px; }
.empty-icon { font-size: 40px; margin-bottom: 12px; opacity: 0.4; }
.empty p { font-family: 'DM Mono', monospace; font-size: 11px; color: var(--muted); letter-spacing: 0.5px; text-transform: uppercase; line-height: 1.8; }

/* ── FOOTER ── */
.footer { background: var(--carbon); padding: 12px 20px; display: flex; flex-direction: column; align-items: center; gap: 3px; position: fixed; bottom: 0; left: 0; right: 0; }
.footer-text { font-family: 'DM Mono', monospace; font-size: 10px; color: var(--citric); letter-spacing: 1px; text-transform: uppercase; }
.footer-date { font-family: 'DM Mono', monospace; font-size: 10px; color: rgba(255,255,255,0.4); }

/* ── DRAWER ── */
.drawer-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.35); z-index: 300; opacity: 0; transition: opacity 0.25s; }
.drawer-overlay.open { display: block; opacity: 1; }
.drawer { position: fixed; top: 0; right: 0; bottom: 0; width: 88%; max-width: 340px; background: var(--surface); z-index: 301; transform: translateX(100%); transition: transform 0.28s cubic-bezier(0.4,0,0.2,1); display: flex; flex-direction: column; overflow: hidden; }
.drawer.open { transform: translateX(0); }
.drawer-header { display: flex; align-items: center; justify-content: space-between; padding: 0 16px; height: 52px; border-bottom: 1px solid var(--border); flex-shrink: 0; }
.drawer-title { font-family: 'DM Mono', monospace; font-size: 10px; font-weight: 500; letter-spacing: 0.14em; text-transform: uppercase; color: var(--text); }
.drawer-close { width: 28px; height: 28px; background: var(--bg); border: 1px solid var(--border); border-radius: var(--radius); display: flex; align-items: center; justify-content: center; cursor: pointer; transition: border-color 0.15s; }
.drawer-close:hover { border-color: var(--carbon); }
.drawer-close svg { width: 13px; height: 13px; stroke: var(--mid); fill: none; stroke-width: 2; stroke-linecap: round; }
.drawer-body { flex: 1; overflow-y: auto; padding: 20px 16px; display: flex; flex-direction: column; gap: 24px; }
.drawer-section { display: flex; flex-direction: column; gap: 10px; }
.drawer-section-label { font-family: 'DM Mono', monospace; font-size: 9px; font-weight: 500; letter-spacing: 0.16em; text-transform: uppercase; color: var(--muted); display: flex; align-items: center; gap: 8px; }
.drawer-section-label::after { content: ''; flex: 1; height: 1px; background: var(--border); }
.drawer-kpi-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
.drawer-kpi { background: var(--bg); border: 1px solid var(--border); border-radius: var(--radius); padding: 10px 12px; }
.drawer-kpi-label { font-family: 'DM Mono', monospace; font-size: 8.5px; font-weight: 500; letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); margin-bottom: 4px; }
.drawer-kpi-value { font-size: 22px; font-weight: 700; color: var(--text); line-height: 1; }
.drawer-footer { padding: 12px 16px 16px; flex-shrink: 0; border-top: 1px solid var(--border); }
.drawer-footer-label { font-family: 'DM Mono', monospace; font-size: 9px; font-weight: 500; letter-spacing: 0.16em; text-transform: uppercase; color: var(--muted); margin-bottom: 10px; display: flex; align-items: center; gap: 8px; }
.drawer-footer-label::after { content: ''; flex: 1; height: 1px; background: var(--border); }
.drawer-footer-person { display: flex; align-items: center; gap: 10px; }
.drawer-avatar { width: 32px; height: 32px; border-radius: 50%; background: var(--carbon); display: flex; align-items: center; justify-content: center; font-family: 'DM Mono', monospace; font-size: 11px; font-weight: 600; color: var(--citric); flex-shrink: 0; }
.drawer-name { font-size: 13px; font-weight: 600; color: var(--text); }
.drawer-role { font-family: 'DM Mono', monospace; font-size: 9px; color: var(--muted); margin-top: 1px; }

/* ── CTA BUTTON ── */
.btn-cta { width: 100%; padding: 14px 20px; background: var(--carbon); color: var(--citric); border: none; border-radius: var(--radius); font-family: 'DM Mono', monospace; font-size: 12px; font-weight: 500; letter-spacing: 0.08em; text-transform: uppercase; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; transition: opacity 0.15s; }
.btn-cta:hover { opacity: 0.85; }
.btn-cta svg { width: 16px; height: 16px; stroke: var(--citric); fill: none; stroke-width: 2.5; stroke-linecap: round; }

/* ── MODAL ── */
.modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.55); z-index: 400; display: flex; align-items: flex-end; justify-content: center; opacity: 0; visibility: hidden; transition: opacity 0.2s, visibility 0.2s; }
.modal-overlay.active { opacity: 1; visibility: visible; }
.modal { background: var(--surface); border-radius: 16px 16px 0 0; width: 100%; max-width: 580px; max-height: 90vh; overflow-y: auto; -webkit-overflow-scrolling: touch; box-shadow: 0 -4px 30px rgba(0,0,0,0.15); transform: translateY(40px); transition: transform 0.25s cubic-bezier(0.4,0,0.2,1); }
.modal-overlay.active .modal { transform: translateY(0); }
.modal-handle { width: 36px; height: 4px; background: var(--border); border-radius: 2px; margin: 10px auto 0; }
.modal-header { padding: 14px 20px; border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; position: sticky; top: 0; background: var(--surface); z-index: 1; }
.modal-title { font-size: 15px; font-weight: 700; color: var(--carbon); }
.modal-close { background: var(--bg); border: 1px solid var(--border); cursor: pointer; width: 28px; height: 28px; border-radius: 50%; display: flex; align-items: center; justify-content: center; }
.modal-close svg { width: 14px; height: 14px; stroke: var(--mid); fill: none; stroke-width: 2; stroke-linecap: round; }
.modal-body { padding: 16px 20px; display: flex; flex-direction: column; gap: 14px; }
.modal-footer { padding: 14px 20px; border-top: 1px solid var(--border); position: sticky; bottom: 0; background: var(--surface); display: flex; gap: 10px; }
.modal-btn { flex: 1; padding: 12px; border-radius: var(--radius); font-family: 'DM Mono', monospace; font-size: 11px; font-weight: 500; letter-spacing: 0.5px; text-transform: uppercase; cursor: pointer; border: none; transition: opacity 0.15s; }
.modal-btn-cancel { background: var(--bg); color: var(--mid); border: 1px solid var(--border); }
.modal-btn-cancel:hover { background: #eee; }
.modal-btn-save { background: var(--carbon); color: var(--citric); }
.modal-btn-save:hover { opacity: 0.85; }

/* ── FORM ── */
.fg { display: flex; flex-direction: column; gap: 5px; }
.flbl { font-family: 'DM Mono', monospace; font-size: 10px; font-weight: 500; letter-spacing: 0.8px; text-transform: uppercase; color: var(--mid); }
.fctrl { font-family: 'DM Sans', sans-serif; font-size: 14px; width: 100%; padding: 10px 12px; border: 1px solid var(--border); border-radius: var(--radius); outline: none; background: var(--surface); color: var(--text); transition: border-color 0.15s; appearance: none; }
.fctrl:focus { border-color: var(--carbon); }
textarea.fctrl { resize: vertical; min-height: 70px; font-family: 'DM Sans', sans-serif; }

/* ── CAT SELECTOR ROW ── */
.cat-add-row { display: flex; gap: 8px; }
.cat-select { flex: 1; appearance: none; background: var(--bg) url("data:image/svg+xml,%3Csvg width='12' height='8' viewBox='0 0 12 8' fill='none' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M1 1L6 7L11 1' stroke='%23555' stroke-width='1.5' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E") no-repeat right 12px center; border: 1px solid var(--border); border-radius: var(--radius); padding: 10px 36px 10px 12px; font-family: 'DM Sans', sans-serif; font-size: 13px; color: var(--text); cursor: pointer; transition: border-color 0.15s; }
.cat-select:focus { outline: none; border-color: var(--carbon); }
.btn-add-cat { padding: 10px 16px; background: var(--carbon); color: var(--citric); border: none; border-radius: var(--radius); font-family: 'DM Mono', monospace; font-size: 11px; font-weight: 500; letter-spacing: 0.05em; cursor: pointer; white-space: nowrap; transition: opacity 0.15s; }
.btn-add-cat:hover { opacity: 0.85; }

/* ── CAT SECTION ── */
.cat-section { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; }
.cat-header { display: flex; align-items: center; justify-content: space-between; padding: 10px 14px; background: var(--bg); border-bottom: 1px solid var(--border); }
.cat-name { font-family: 'DM Mono', monospace; font-size: 10px; font-weight: 500; text-transform: uppercase; letter-spacing: 0.1em; color: var(--carbon); }
.cat-remove { background: none; border: none; cursor: pointer; color: var(--muted); font-size: 18px; line-height: 1; padding: 0 2px; transition: color 0.15s; }
.cat-remove:hover { color: #E53E3E; }
.cat-table { width: 100%; border-collapse: collapse; }
.cat-table th { font-family: 'DM Mono', monospace; font-size: 8.5px; font-weight: 500; text-transform: uppercase; letter-spacing: 0.8px; color: var(--muted); padding: 8px 14px; background: var(--surface); border-bottom: 1px solid var(--border); text-align: left; }
.cat-table th:last-child { text-align: right; width: 90px; }
.cat-table td { padding: 9px 14px; border-bottom: 1px solid var(--border); font-size: 13px; background: var(--surface); vertical-align: middle; }
.cat-table tr:last-child td { border-bottom: none; }
.cat-table td.unit { font-family: 'DM Mono', monospace; font-size: 11px; color: var(--muted); width: 48px; }
.qty-input { width: 80px; text-align: right; border: 1px solid var(--border); border-radius: 6px; padding: 5px 8px; font-family: 'DM Mono', monospace; font-size: 13px; color: var(--text); background: var(--bg); display: block; margin-left: auto; transition: all 0.15s; }
.qty-input:focus { outline: none; border-color: var(--carbon); background: #fff; }
.qty-input.has-value { border-color: var(--carbon); background: var(--carbon); color: var(--citric); }

/* ── TOASTS ── */
.toasts { position: fixed; bottom: 80px; left: 12px; right: 12px; z-index: 999; display: flex; flex-direction: column; gap: 8px; pointer-events: none; }
.toast { background: var(--carbon); color: var(--surface); padding: 12px 16px; border-radius: var(--radius); font-size: 13px; font-weight: 500; font-family: 'DM Mono', monospace; border-left: 3px solid var(--citric); box-shadow: 0 4px 20px rgba(0,0,0,0.2); animation: toastIn 0.2s ease; }
@keyframes toastIn { from { transform: translateY(8px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }

@media (min-width: 640px) {
  .content { max-width: 700px; margin: 0 auto; padding: 24px 32px 100px; }
  .kpi-grid { grid-template-columns: repeat(4, 1fr); }
}
</style>
</head>
<body>

<header class="header">
  <div class="header-info">
    <div class="header-title">Cardápio &amp; Compras</div>
    <div class="header-user" id="header-user">Carregando…</div>
  </div>
  <button class="header-plus" onclick="openDrawer()" title="Menu">
    <svg viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
  </button>
</header>

<div class="tabs">
  <button class="tab-btn active" id="tab-pedidos"  onclick="setTab('pedidos')">Pedidos</button>
  <button class="tab-btn"        id="tab-entregas" onclick="setTab('entregas')">Entregas</button>
  <button class="tab-btn"        id="tab-kpis"     onclick="setTab('kpis')">KPIs</button>
</div>

<main class="content">

  <!-- PEDIDOS -->
  <div class="page active" id="page-pedidos"></div>

  <!-- ENTREGAS -->
  <div class="page" id="page-entregas">
    <div class="kpi-grid">
      <div class="kpi-card"><span class="kpi-label">Aguardando</span><span class="kpi-number" id="kpi-ent-ag">0</span></div>
      <div class="kpi-card"><span class="kpi-label">Entregues Hoje</span><span class="kpi-number">1</span></div>
    </div>
    <div class="empty">
      <div class="empty-icon">🚚</div>
      <p>Nenhuma entrega pendente</p>
    </div>
  </div>

  <!-- KPIs -->
  <div class="page" id="page-kpis">
    <div class="kpi-grid">
      <div class="kpi-card"><span class="kpi-label">Pedidos Mês</span><span class="kpi-number" id="kpi-mes">0</span></div>
      <div class="kpi-card"><span class="kpi-label">Em Aberto</span><span class="kpi-number" id="kpi-aberto">0</span></div>
      <div class="kpi-card"><span class="kpi-label">Concluídos</span><span class="kpi-number" id="kpi-conc">0</span></div>
      <div class="kpi-card"><span class="kpi-label">Categorias</span><span class="kpi-number">7</span></div>
    </div>
  </div>

</main>

<footer class="footer">
  <span class="footer-text">TATÁ SUSHI &nbsp;|&nbsp; COMPRAS &nbsp;|&nbsp; 2024–2026</span>
  <span class="footer-date" id="footer-date"></span>
</footer>

<!-- ══ DRAWER ══════════════════════════════════════════════════════════════ -->
<div class="drawer-overlay" id="drawer-overlay" onclick="closeDrawer()"></div>
<div class="drawer" id="drawer">
  <div class="drawer-header">
    <span class="drawer-title">Menu</span>
    <button class="drawer-close" onclick="closeDrawer()">
      <svg viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
    </button>
  </div>
  <div class="drawer-body">
    <div class="drawer-section">
      <button class="btn-cta" onclick="abrirModalPedido()">
        <svg viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
        Novo Pedido
      </button>
    </div>
    <div class="drawer-section">
      <div class="drawer-section-label">Resumo</div>
      <div class="drawer-kpi-grid">
        <div class="drawer-kpi"><div class="drawer-kpi-label">Pedidos mês</div><div class="drawer-kpi-value" id="dk-mes">0</div></div>
        <div class="drawer-kpi"><div class="drawer-kpi-label">Em aberto</div><div class="drawer-kpi-value" id="dk-aberto">0</div></div>
        <div class="drawer-kpi"><div class="drawer-kpi-label">Categorias</div><div class="drawer-kpi-value">7</div></div>
        <div class="drawer-kpi"><div class="drawer-kpi-label">Fornecedores</div><div class="drawer-kpi-value">12</div></div>
      </div>
    </div>
  </div>
  <div class="drawer-footer">
    <div class="drawer-footer-label">Responsável</div>
    <div class="drawer-footer-person">
      <div class="drawer-avatar" id="drawer-avatar">--</div>
      <div>
        <div class="drawer-name" id="drawer-name">Líder</div>
        <div class="drawer-role">Compras &amp; Abastecimento</div>
      </div>
    </div>
  </div>
</div>

<!-- ══ MODAL NOVO PEDIDO ══════════════════════════════════════════════════ -->
<div class="modal-overlay" id="modal-pedido" onclick="if(event.target===this)fecharModalPedido()">
  <div class="modal">
    <div class="modal-handle"></div>
    <div class="modal-header">
      <div class="modal-title">Novo Pedido</div>
      <button class="modal-close" onclick="fecharModalPedido()">
        <svg viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </button>
    </div>
    <div class="modal-body">
      <div class="fg">
        <label class="flbl">Data de entrega desejada</label>
        <input type="date" class="fctrl" id="modal-data-entrega">
      </div>
      <div class="fg">
        <label class="flbl">Adicionar categoria</label>
        <div class="cat-add-row">
          <select class="cat-select" id="sel-cat">
            <option value="">Selecione uma categoria…</option>
            <option value="peixes">Peixes e frutos do mar</option>
            <option value="frios">Frios e congelados</option>
            <option value="secos">Secos e grãos</option>
            <option value="bebidas">Bebidas</option>
            <option value="descartaveis">Descartáveis</option>
            <option value="limpeza">Limpeza e higiene</option>
            <option value="hortifruti">Hortifruti</option>
          </select>
          <button class="btn-add-cat" onclick="addCategoria()">+ Add</button>
        </div>
      </div>
      <div id="cat-sections"></div>
      <div class="fg">
        <label class="flbl">Observações</label>
        <textarea class="fctrl" id="modal-obs" placeholder="Informações adicionais para o pedido…"></textarea>
      </div>
    </div>
    <div class="modal-footer">
      <button class="modal-btn modal-btn-cancel" onclick="fecharModalPedido()">Cancelar</button>
      <button class="modal-btn modal-btn-save"   onclick="enviarPedido()">Enviar Pedido</button>
    </div>
  </div>
</div>

<!-- TOASTS -->
<div class="toasts" id="toasts"></div>

<script>
// ── CATÁLOGO ──────────────────────────────────────────────────────────────────
var CATALOGO = {
  peixes:       { label: 'Peixes e frutos do mar', produtos: [
    {nome:'Salmão fresco',un:'kg'},{nome:'Atum bluefin',un:'kg'},{nome:'Polvo fresco',un:'kg'},
    {nome:'Lula limpa',un:'kg'},{nome:'Camarão VG',un:'kg'},{nome:'Vieira',un:'kg'},
    {nome:'Tilápia filé',un:'kg'},{nome:'Ovas de salmão (ikura)',un:'pote'},{nome:'Ovas de capelin (tobiko)',un:'pote'}
  ]},
  frios:        { label: 'Frios e congelados', produtos: [
    {nome:'Cream cheese',un:'kg'},{nome:'Manteiga sem sal',un:'kg'},{nome:'Queijo parmesão',un:'kg'},
    {nome:'Maionese',un:'kg'},{nome:'Creme de leite',un:'cx'},{nome:'Leite condensado',un:'cx'},{nome:'Edamame congelado',un:'kg'}
  ]},
  secos:        { label: 'Secos e grãos', produtos: [
    {nome:'Arroz japonês',un:'kg'},{nome:'Alga nori',un:'cx'},{nome:'Shoyu premium',un:'un'},
    {nome:'Vinagre de arroz',un:'un'},{nome:'Gergelim branco',un:'kg'},{nome:'Gergelim preto',un:'kg'},
    {nome:'Farinha de rosca panko',un:'kg'},{nome:'Azeite de sésamo',un:'un'},{nome:'Wasabi pasta',un:'un'},{nome:'Gengibre em conserva',un:'pote'}
  ]},
  bebidas:      { label: 'Bebidas', produtos: [
    {nome:'Água mineral 500ml',un:'cx'},{nome:'Refrigerante lata 350ml',un:'cx'},{nome:'Suco integral longa vida',un:'cx'},
    {nome:'Cerveja artesanal long neck',un:'cx'},{nome:'Sake',un:'un'},{nome:'Vinho branco',un:'un'},{nome:'Energético lata',un:'cx'}
  ]},
  descartaveis: { label: 'Descartáveis', produtos: [
    {nome:'Caixa delivery P',un:'cx'},{nome:'Caixa delivery M',un:'cx'},{nome:'Caixa delivery G',un:'cx'},
    {nome:'Saquinho kraft',un:'cx'},{nome:'Hashi descartável',un:'cx'},{nome:'Guardanapo',un:'pct'},
    {nome:'Copo descartável 300ml',un:'cx'},{nome:'Luva nitrílica M',un:'cx'},{nome:'Luva nitrílica G',un:'cx'}
  ]},
  limpeza:      { label: 'Limpeza e higiene', produtos: [
    {nome:'Detergente líquido',un:'un'},{nome:'Desengordurante',un:'un'},{nome:'Álcool 70% spray',un:'un'},
    {nome:'Papel toalha',un:'pct'},{nome:'Saco de lixo 100L',un:'rolo'},{nome:'Esponja dupla face',un:'pct'},
    {nome:'Pano multiuso',un:'pct'},{nome:'Sabonete líquido',un:'un'}
  ]},
  hortifruti:   { label: 'Hortifruti', produtos: [
    {nome:'Pepino japonês',un:'kg'},{nome:'Abacate',un:'kg'},{nome:'Limão siciliano',un:'kg'},
    {nome:'Cebolinha',un:'mç'},{nome:'Coentro',un:'mç'},{nome:'Alho',un:'kg'},
    {nome:'Cebola',un:'kg'},{nome:'Manga',un:'kg'},{nome:'Morango',un:'kg'}
  ]}
};

// ── MOCK DATA ─────────────────────────────────────────────────────────────────
var ORDERS = [
  { id:'P-024', status:'b-aguardando', label:'Aguardando entrega', cats:['Peixes','Frios'],              itens:8,  data:'30/04/2026', entrega:'02/05/2026' },
  { id:'P-023', status:'b-proc',       label:'Em processamento',   cats:['Secos','Bebidas'],             itens:12, data:'28/04/2026', entrega:'01/05/2026' },
  { id:'P-022', status:'b-enviado',    label:'Enviado',            cats:['Hortifruti'],                  itens:5,  data:'27/04/2026', entrega:'30/04/2026' },
  { id:'P-021', status:'b-concluido',  label:'Concluído',          cats:['Descartáveis','Limpeza'],      itens:14, data:'24/04/2026', entrega:'26/04/2026' },
  { id:'P-020', status:'b-parcial',    label:'Entrega parcial',    cats:['Peixes','Secos','Frios'],      itens:18, data:'20/04/2026', entrega:'22/04/2026' },
];

// ── STATE ─────────────────────────────────────────────────────────────────────
var activeCats = [];

// ── INIT ──────────────────────────────────────────────────────────────────────
document.addEventListener('DOMContentLoaded', function() {
  // Identidade do líder via sessão
  var session;
  try { session = JSON.parse(localStorage.getItem('lideres_session')); } catch(e) {}
  var userName = (session && session.displayName) || 'Líder';
  var initials = userName.split(' ').map(function(p) { return p[0]; }).join('').slice(0, 2).toUpperCase();
  document.getElementById('header-user').textContent = userName;
  document.getElementById('drawer-name').textContent = userName;
  document.getElementById('drawer-avatar').textContent = initials;

  // Footer date
  document.getElementById('footer-date').textContent =
    new Date().toLocaleDateString('pt-BR', { weekday:'long', day:'2-digit', month:'long', year:'numeric' });

  // Default date
  document.getElementById('modal-data-entrega').value = new Date().toISOString().split('T')[0];

  renderOrders();
  updateKPIs();
});

// ── TABS ──────────────────────────────────────────────────────────────────────
function setTab(t) {
  document.querySelectorAll('.tab-btn').forEach(function(b) { b.classList.remove('active'); });
  document.getElementById('tab-' + t).classList.add('active');
  document.querySelectorAll('.page').forEach(function(p) { p.classList.remove('active'); });
  document.getElementById('page-' + t).classList.add('active');
}

// ── DRAWER ────────────────────────────────────────────────────────────────────
function openDrawer() {
  document.getElementById('drawer-overlay').classList.add('open');
  document.getElementById('drawer').classList.add('open');
  document.body.style.overflow = 'hidden';
}
function closeDrawer() {
  document.getElementById('drawer-overlay').classList.remove('open');
  document.getElementById('drawer').classList.remove('open');
  document.body.style.overflow = '';
}

// ── MODAL ─────────────────────────────────────────────────────────────────────
function abrirModalPedido() {
  closeDrawer();
  setTimeout(function() {
    document.getElementById('modal-pedido').classList.add('active');
    document.body.style.overflow = 'hidden';
  }, 220);
}
function fecharModalPedido() {
  document.getElementById('modal-pedido').classList.remove('active');
  document.body.style.overflow = '';
}

// ── CATEGORIAS ────────────────────────────────────────────────────────────────
function addCategoria() {
  var sel = document.getElementById('sel-cat');
  var key = sel.value;
  if (!key) { toast('Selecione uma categoria.'); return; }
  if (activeCats.indexOf(key) !== -1) { toast('Categoria já adicionada.'); return; }
  activeCats.push(key);
  renderCatSection(key);
  sel.value = '';
}

function renderCatSection(key) {
  var cat = CATALOGO[key];
  var container = document.getElementById('cat-sections');

  var div = document.createElement('div');
  div.className = 'cat-section';
  div.id = 'cat-sec-' + key;

  var hdr = document.createElement('div');
  hdr.className = 'cat-header';
  var span = document.createElement('span');
  span.className = 'cat-name';
  span.textContent = cat.label;
  var btnRem = document.createElement('button');
  btnRem.className = 'cat-remove';
  btnRem.textContent = '×';
  btnRem.onclick = function() { removeCategoria(key); };
  hdr.appendChild(span);
  hdr.appendChild(btnRem);

  var table = document.createElement('table');
  table.className = 'cat-table';
  var thead = document.createElement('thead');
  var headRow = document.createElement('tr');
  ['Produto', 'Un.', 'Qtd'].forEach(function(h) {
    var th = document.createElement('th');
    th.textContent = h;
    headRow.appendChild(th);
  });
  thead.appendChild(headRow);

  var tbody = document.createElement('tbody');
  cat.produtos.forEach(function(p, i) {
    var tr = document.createElement('tr');
    var td1 = document.createElement('td'); td1.textContent = p.nome;
    var td2 = document.createElement('td'); td2.className = 'unit'; td2.textContent = p.un;
    var td3 = document.createElement('td');
    var inp = document.createElement('input');
    inp.type = 'number';
    inp.className = 'qty-input';
    inp.min = '0';
    inp.placeholder = '—';
    inp.id = 'qty-' + key + '-' + i;
    inp.oninput = function() { inp.classList.toggle('has-value', parseFloat(inp.value) > 0); };
    td3.appendChild(inp);
    tr.appendChild(td1); tr.appendChild(td2); tr.appendChild(td3);
    tbody.appendChild(tr);
  });

  table.appendChild(thead);
  table.appendChild(tbody);
  div.appendChild(hdr);
  div.appendChild(table);
  container.appendChild(div);
}

function removeCategoria(key) {
  activeCats = activeCats.filter(function(k) { return k !== key; });
  var el = document.getElementById('cat-sec-' + key);
  if (el) el.remove();
}

// ── ENVIAR PEDIDO ─────────────────────────────────────────────────────────────
function enviarPedido() {
  if (activeCats.length === 0) { toast('Adicione ao menos uma categoria.'); return; }
  var total = 0;
  activeCats.forEach(function(key) {
    CATALOGO[key].produtos.forEach(function(p, i) {
      var inp = document.getElementById('qty-' + key + '-' + i);
      if (inp && parseFloat(inp.value) > 0) total++;
    });
  });
  if (total === 0) { toast('Informe ao menos uma quantidade.'); return; }

  var now = new Date();
  var dataStr = now.toLocaleDateString('pt-BR');
  var entregaVal = document.getElementById('modal-data-entrega').value;
  var entregaStr = entregaVal
    ? new Date(entregaVal + 'T12:00:00').toLocaleDateString('pt-BR')
    : '—';
  var newId = 'P-' + String(Date.now()).slice(-3);
  var cats = activeCats.map(function(k) { return CATALOGO[k].label.split(' ')[0]; });

  ORDERS.unshift({ id: newId, status: 'b-enviado', label: 'Enviado', cats: cats, itens: total, data: dataStr, entrega: entregaStr });

  toast('Pedido ' + newId + ' enviado! ' + total + ' itens.');
  fecharModalPedido();

  // Reset form
  activeCats = [];
  document.getElementById('cat-sections').innerHTML = '';
  document.getElementById('modal-obs').value = '';
  document.getElementById('modal-data-entrega').value = new Date().toISOString().split('T')[0];

  renderOrders();
  updateKPIs();
  setTab('pedidos');
}

// ── RENDER ORDERS ─────────────────────────────────────────────────────────────
function renderOrders() {
  var container = document.getElementById('page-pedidos');

  if (ORDERS.length === 0) {
    container.innerHTML =
      '<div class="empty"><div class="empty-icon">📋</div>' +
      '<p>Nenhum pedido ainda<br>Use o + para criar um</p></div>';
    return;
  }

  var ativos = ORDERS.filter(function(o) { return o.status !== 'b-concluido'; });
  var conc   = ORDERS.filter(function(o) { return o.status === 'b-concluido'; });

  var html = '';
  if (ativos.length > 0) {
    html += '<div class="sec-label">Em andamento</div>';
    ativos.forEach(function(o) { html += orderCardHTML(o); });
  }
  if (conc.length > 0) {
    html += '<div class="sec-label" style="margin-top:4px;">Concluídos</div>';
    conc.forEach(function(o) { html += orderCardHTML(o); });
  }

  container.innerHTML = html;
}

function orderCardHTML(o) {
  return '<div class="card">' +
    '<div class="card-header">' +
      '<div>' +
        '<div class="order-id">' + o.id + '</div>' +
        '<div class="order-title">' + o.cats.join(', ') + '</div>' +
      '</div>' +
      '<span class="badge ' + o.status + '">' + o.label + '</span>' +
    '</div>' +
    '<div class="card-body">' +
      '<div class="card-field"><span class="field-label">Pedido em</span><span class="field-value">' + o.data + '</span></div>' +
      '<div class="card-field"><span class="field-label">Entrega prevista</span><span class="field-value">' + o.entrega + '</span></div>' +
      '<div class="card-field"><span class="field-label">Itens</span><span class="field-value">' + o.itens + ' produtos</span></div>' +
      '<div class="card-field"><span class="field-label">Categorias</span><span class="field-value">' + o.cats.length + '</span></div>' +
    '</div>' +
    '<div class="card-footer"><span class="meta-pill">' + o.id + '</span></div>' +
  '</div>';
}

// ── KPIs ──────────────────────────────────────────────────────────────────────
function updateKPIs() {
  var aberto = ORDERS.filter(function(o) { return o.status !== 'b-concluido'; }).length;
  var conc   = ORDERS.filter(function(o) { return o.status === 'b-concluido'; }).length;
  document.getElementById('kpi-mes').textContent    = ORDERS.length;
  document.getElementById('kpi-aberto').textContent = aberto;
  document.getElementById('kpi-conc').textContent   = conc;
  document.getElementById('kpi-ent-ag').textContent = aberto;
  document.getElementById('dk-mes').textContent     = ORDERS.length;
  document.getElementById('dk-aberto').textContent  = aberto;
}

// ── TOAST ─────────────────────────────────────────────────────────────────────
function toast(msg) {
  var c = document.getElementById('toasts');
  var el = document.createElement('div');
  el.className = 'toast';
  el.textContent = msg;
  c.appendChild(el);
  setTimeout(function() { if (el.parentNode) el.remove(); }, 3200);
}
</script>
</body>
</html>
