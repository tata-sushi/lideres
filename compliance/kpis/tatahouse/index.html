<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Refeitório — TATÁ Sushi</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --bg: #F4F4F4; --surface: #FFFFFF; --carbon: #35383F; --citric: #CFFF00;
  --text: #111111; --mid: #555555; --muted: #999999; --border: #E2E2E2;
  --green: #1A5C2A; --green-bg: #EAF4ED; --amber: #7A4A00; --amber-bg: #FFF4DC;
  --red: #7A1A1A; --red-bg: #FDEAEA;
  --radius: 8px; --shadow: 0 1px 4px rgba(0,0,0,0.07);
}
body { font-family: 'DM Sans', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; font-size: 14px; padding-bottom: 80px; }

/* HEADER */
.header { background: var(--surface); border-bottom: 1px solid var(--border); padding: 10px 16px; display: flex; align-items: center; gap: 10px; position: sticky; top: 0; z-index: 100; }
.header-title { font-size: 20px; font-weight: 700; color: var(--carbon); letter-spacing: -0.3px; }
.header-sub { font-family: 'DM Mono', monospace; font-size: 10px; color: var(--muted); letter-spacing: 0.5px; text-transform: uppercase; margin-top: 1px; }

/* FILTERS */
.filters-outer { background: var(--surface); border-bottom: 1px solid var(--border); }
.filters-wrap { padding: 14px 20px; display: flex; flex-direction: column; gap: 10px; max-width: 800px; margin: 0 auto; }
.filters-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.filter-group { display: flex; flex-direction: column; gap: 4px; }
.filter-label { font-family: 'DM Mono', monospace; font-size: 10px; font-weight: 500; letter-spacing: 0.8px; text-transform: uppercase; color: var(--mid); }
.filter-select { appearance: none; background: var(--bg) url("data:image/svg+xml,%3Csvg width='12' height='8' viewBox='0 0 12 8' fill='none' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M1 1L6 7L11 1' stroke='%23555' stroke-width='1.5' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E") no-repeat right 12px center; border: 1px solid var(--border); border-radius: var(--radius); padding: 9px 36px 9px 12px; font-family: 'DM Sans', sans-serif; font-size: 13px; color: var(--text); cursor: pointer; transition: border-color 0.15s; width: 100%; }
.filter-select:focus { outline: none; border-color: var(--carbon); }
.filters-actions { display: flex; align-items: center; justify-content: space-between; }
.btn-clear { font-family: 'DM Mono', monospace; font-size: 10px; letter-spacing: 0.5px; color: var(--muted); background: none; border: none; cursor: pointer; padding: 4px 0; text-transform: uppercase; text-decoration: underline; text-underline-offset: 2px; }
.btn-clear:hover { color: var(--carbon); }
.results-count { font-family: 'DM Mono', monospace; font-size: 11px; color: var(--muted); }
.results-count span { color: var(--carbon); font-weight: 500; }

/* CONTENT */
.content { padding: 16px 20px; display: flex; flex-direction: column; gap: 16px; max-width: 800px; margin: 0 auto; }

/* KPI STRIP */
.kpi-strip { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.kpi-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 14px 10px; display: flex; flex-direction: column; align-items: center; text-align: center; gap: 4px; box-shadow: var(--shadow); }
.kpi-card.hero { background: var(--carbon); border-color: var(--carbon); }
.kpi-label { font-family: 'DM Mono', monospace; font-size: 9px; font-weight: 500; letter-spacing: 0.8px; text-transform: uppercase; color: var(--mid); }
.kpi-card.hero .kpi-label { color: rgba(255,255,255,0.5); }
.kpi-number { font-size: 32px; font-weight: 700; color: var(--carbon); line-height: 1; letter-spacing: -1.5px; font-variant-numeric: tabular-nums; }
.kpi-card.hero .kpi-number { color: var(--citric); }
.kpi-sub { font-family: 'DM Mono', monospace; font-size: 10px; color: var(--muted); text-align: center; }
.kpi-card.hero .kpi-sub { color: rgba(255,255,255,0.4); }

/* CHART CARD */
.chart-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 14px 16px; box-shadow: var(--shadow); }
.chart-title { font-family: 'DM Mono', monospace; font-size: 10px; font-weight: 700; letter-spacing: 1px; text-transform: uppercase; color: var(--carbon); margin-bottom: 14px; }
.chart-wrap { position: relative; height: 200px; }
.chart-wrap.tall { height: 290px; }

/* NPS-LIKE */
.nps-bar { display: flex; height: 10px; border-radius: 5px; overflow: hidden; gap: 2px; margin: 10px 0 8px; }
.nps-seg { height: 100%; border-radius: 2px; }
.nps-legend { display: flex; gap: 10px; flex-wrap: wrap; }
.nps-legend-item { display: flex; align-items: center; gap: 5px; font-family: 'DM Mono', monospace; font-size: 10px; color: var(--mid); }
.nps-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }

/* SUGESTOES */
.section-title { font-family: 'DM Mono', monospace; font-size: 10px; font-weight: 700; letter-spacing: 1.5px; text-transform: uppercase; color: var(--carbon); padding-bottom: 8px; border-bottom: 1px solid var(--border); }
.sugestao-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 12px 14px; display: flex; flex-direction: column; gap: 6px; box-shadow: var(--shadow); }
.sugestao-text { font-size: 13px; color: var(--carbon); line-height: 1.6; font-style: italic; }
.sugestao-meta { font-family: 'DM Mono', monospace; font-size: 10px; color: var(--muted); }

/* LOADING */
.loading-overlay { display: none; position: fixed; inset: 0; background: rgba(255,255,255,.75); z-index: 500; align-items: center; justify-content: center; flex-direction: column; gap: 10px; }
.loading-overlay.show { display: flex; }
.spinner { width: 28px; height: 28px; border: 3px solid var(--border); border-top-color: var(--carbon); border-radius: 50%; animation: spin .7s linear infinite; }
.loading-overlay span { font-family: 'DM Mono', monospace; font-size: 11px; color: var(--mid); }
@keyframes spin { to { transform: rotate(360deg); } }

/* EMPTY / ERROR */
.empty-state { text-align: center; padding: 60px 20px; color: var(--muted); font-family: 'DM Mono', monospace; font-size: 12px; text-transform: uppercase; letter-spacing: 0.5px; }
.error-state { text-align: center; padding: 40px 20px; }
.error-state p { font-family: 'DM Mono', monospace; font-size: 11px; color: var(--red); margin-bottom: 8px; }
.error-state small { font-family: 'DM Mono', monospace; font-size: 10px; color: var(--muted); }
.btn-retry { margin-top: 16px; padding: 8px 18px; background: var(--carbon); color: var(--citric); border: none; border-radius: 6px; font-size: 11px; cursor: pointer; font-family: 'DM Mono', monospace; letter-spacing: .5px; text-transform: uppercase; }

/* FOOTER */
.footer { background: var(--carbon); padding: 12px 20px; display: flex; flex-direction: column; align-items: center; gap: 3px; position: fixed; bottom: 0; left: 0; right: 0; }
.footer-module { font-family: 'DM Mono', monospace; font-size: 10px; color: var(--citric); letter-spacing: 1px; text-transform: uppercase; }
.footer-date { font-family: 'DM Mono', monospace; font-size: 10px; color: rgba(255,255,255,0.4); }

@media (min-width: 600px) {
  .filters-wrap { padding: 14px 32px; }
  .content { padding: 24px 32px 80px; }
  .filters-row { grid-template-columns: 1fr 1fr; }
}
</style>
</head>
<body>

<header class="header">
  <svg width="40" height="40" viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg" style="flex-shrink:0">
    <rect width="40" height="40" rx="6" fill="#35383F"/>
    <text x="20" y="26" text-anchor="middle" font-family="DM Sans,sans-serif" font-weight="700" font-size="13" fill="#CFFF00">TATÁ</text>
  </svg>
  <div>
    <div class="header-title">Refeitório</div>
    <div class="header-sub">Pesquisa de Satisfação</div>
  </div>
</header>

<div class="filters-outer">
  <div class="filters-wrap">
    <div class="filters-row">
      <div class="filter-group">
        <label class="filter-label">Ano</label>
        <select class="filter-select" id="filter-ano" onchange="applyFilters()">
          <option value="Todos">Todos</option>
        </select>
      </div>
      <div class="filter-group">
        <label class="filter-label">Avaliação Geral</label>
        <select class="filter-select" id="filter-nivel" onchange="applyFilters()">
          <option value="Todos">Todos</option>
          <option value="Excelente">Excelente</option>
          <option value="Bom">Bom</option>
          <option value="Regular">Regular</option>
          <option value="Precisa melhorar">Precisa Melhorar</option>
        </select>
      </div>
    </div>
    <div class="filters-actions">
      <button class="btn-clear" onclick="clearFilters()">Limpar filtros</button>
      <span class="results-count"><span id="result-count">—</span> resposta(s)</span>
    </div>
  </div>
</div>

<main class="content" id="content">
  <div class="empty-state">Carregando dados...</div>
</main>

<div class="loading-overlay" id="loading-overlay">
  <div class="spinner"></div>
  <span>Carregando dados...</span>
</div>

<footer class="footer">
  <span class="footer-module">TATÁ SUSHI &nbsp;|&nbsp; TATÁ POKE &nbsp;|&nbsp; 2016 – 2026</span>
  <span class="footer-date" id="footer-date"></span>
</footer>

<script>
// ─── CONFIG ───────────────────────────────────────────────────────────────────
var SHEET_ID   = '1v4uIPuaT15WXfBoB6l7Rz2yM-KXIwP_vP4MQkHYlWUk';
var SHEET_NAME = 'Respostas ao formulário 1';
var API_KEY    = 'AIzaSyCYDJdw0a5t_Ievs0Jh-msg4x4fpGbQDto';

// Mapeamento de colunas (0-based):
// 0=Carimbo  1=Email  2=variedade  3=atende  4=sabor  5=novidades
// 6=apresentacao  7=temperatura  8=atendimento  9=simpatico
// 10=ambiente  11=conforto  12=infra  13=sugestao  14=texto
var COL = {
  data:0, variedade:2, atende:3, sabor:4, novidades:5,
  apresentacao:6, temperatura:7, atendimento:8, simpatico:9,
  ambiente:10, conforto:11, infra:12, sugestao:13, texto:14
};

// ─── ESCORES ──────────────────────────────────────────────────────────────────
var SCORE_MAP = {
  'Excelente':5,'Muito Boa':5,'Muito Frequente':5,'Sempre':5,
  'Bom':4,'Frequente':4,'Na Maioria das Vezes':4,
  'Regular':3,'Ocasionalmente':3,
  'Precisa melhorar':2,'Precisa Melhorar':2,'Às Vezes':2,'Raramente':2,
  'Ruim':1,'Nunca':1
};
function score(val){ return SCORE_MAP[val] !== undefined ? SCORE_MAP[val] : 3; }

var CAMPOS_SCORE = ['variedade','sabor','apresentacao','temperatura','atendimento','simpatico','ambiente','conforto','infra'];
var CAMPOS_LABEL = {
  variedade:    'Variedade do cardápio',
  sabor:        'Sabor dos pratos',
  apresentacao: 'Apresentação dos pratos',
  temperatura:  'Temperatura dos alimentos',
  atendimento:  'Atendimento dos funcionários',
  simpatico:    'Simpatia dos funcionários',
  ambiente:     'Ambiente (limpeza/iluminação)',
  conforto:     'Conforto e decoração',
  infra:        'Infraestrutura (mesas/cadeiras)'
};

// ─── ESTADO ───────────────────────────────────────────────────────────────────
var DADOS_RAW = [];
var filtered  = [];
var _charts   = {};

// ─── FETCH SHEETS ─────────────────────────────────────────────────────────────
function loadData(){
  showLoading();
  var url = 'https://sheets.googleapis.com/v4/spreadsheets/' + SHEET_ID
          + '/values/' + encodeURIComponent(SHEET_NAME + '!A:O')
          + '?key=' + API_KEY;

  fetch(url)
    .then(function(r){ return r.json(); })
    .then(function(json){
      hideLoading();
      if(json.error){ showError(json.error.message); return; }
      var rows = json.values || [];
      if(rows.length < 2){ DADOS_RAW = []; filtered = []; render(); return; }

      // Linha 0 = cabeçalho, ignora
      DADOS_RAW = [];
      for(var i = 1; i < rows.length; i++){
        var r = rows[i];
        // pula linhas completamente vazias
        if(!r || !r[COL.data] || !r[COL.variedade]) continue;
        // extrai data: "31/10/2024 01:22:26" → "31/10/2024"
        var dataRaw = (r[COL.data] || '').trim();
        var data    = dataRaw.indexOf(' ') !== -1 ? dataRaw.split(' ')[0] : dataRaw;
        DADOS_RAW.push({
          data:         data,
          variedade:    (r[COL.variedade]    || '').trim(),
          atende:       (r[COL.atende]       || '').trim(),
          sabor:        (r[COL.sabor]        || '').trim(),
          novidades:    (r[COL.novidades]    || '').trim(),
          apresentacao: (r[COL.apresentacao] || '').trim(),
          temperatura:  (r[COL.temperatura]  || '').trim(),
          atendimento:  (r[COL.atendimento]  || '').trim(),
          simpatico:    (r[COL.simpatico]    || '').trim(),
          ambiente:     (r[COL.ambiente]     || '').trim(),
          conforto:     (r[COL.conforto]     || '').trim(),
          infra:        (r[COL.infra]        || '').trim(),
          sugestao:     (r[COL.sugestao]     || '').trim(),
          texto:        (r[COL.texto]        || '').trim()
        });
      }

      filtered = DADOS_RAW.slice();
      buildAnoOptions();
      document.getElementById('result-count').textContent = filtered.length;
      render();
    })
    .catch(function(err){
      hideLoading();
      showError(err.message || 'Erro de rede');
    });
}

function showLoading(){ document.getElementById('loading-overlay').classList.add('show'); }
function hideLoading(){ document.getElementById('loading-overlay').classList.remove('show'); }

function showError(msg){
  document.getElementById('content').innerHTML =
    '<div class="error-state">' +
    '<p>Erro ao carregar dados</p>' +
    '<small>' + escH(msg) + '</small><br>' +
    '<button class="btn-retry" onclick="loadData()">↻ Tentar novamente</button>' +
    '</div>';
}

// ─── FILTROS ──────────────────────────────────────────────────────────────────
function getAno(d){
  // data no formato DD/MM/YYYY
  return d.data ? d.data.slice(6) : '';
}

function buildAnoOptions(){
  var anos = {};
  DADOS_RAW.forEach(function(d){ var a = getAno(d); if(a) anos[a] = true; });
  var sel = document.getElementById('filter-ano');
  // remove opções antigas (exceto "Todos")
  while(sel.options.length > 1) sel.remove(1);
  Object.keys(anos).sort().forEach(function(a){
    var opt = document.createElement('option');
    opt.value = a; opt.textContent = a; sel.appendChild(opt);
  });
}

function applyFilters(){
  var ano   = document.getElementById('filter-ano').value;
  var nivel = document.getElementById('filter-nivel').value.toLowerCase();
  filtered = DADOS_RAW.filter(function(d){
    if(ano !== 'Todos' && getAno(d) !== ano) return false;
    if(nivel !== 'todos' && d.variedade.toLowerCase() !== nivel) return false;
    return true;
  });
  document.getElementById('result-count').textContent = filtered.length;
  render();
}

function clearFilters(){
  document.getElementById('filter-ano').value   = 'Todos';
  document.getElementById('filter-nivel').value = 'Todos';
  filtered = DADOS_RAW.slice();
  document.getElementById('result-count').textContent = filtered.length;
  render();
}

// ─── HELPERS ──────────────────────────────────────────────────────────────────
function escH(s){ return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function pad(n){ return String(n).padStart(2,'0'); }
function avgField(f,src){ if(!src.length)return 0; return src.reduce(function(a,d){return a+score(d[f]);},0)/src.length; }
function avgFields(fields,src){ var t=0,c=0; fields.forEach(function(f){src.forEach(function(d){t+=score(d[f]);c++;});}); return c?t/c:0; }
function pct(n,total){ return total?Math.round((n/total)*100):0; }
function scoreLabel(s){ if(s>=4.5)return'Excelente'; if(s>=3.8)return'Bom'; if(s>=3)return'Regular'; return'Precisa Melhorar'; }
function barColorFor(s){ if(s>=4.2)return'#1A5C2A'; if(s>=3)return'#35383F'; return'#D0021B'; }
function countByVal(f,src){ var c={}; src.forEach(function(d){var v=d[f]||'N/A';c[v]=(c[v]||0)+1;}); return c; }

// ─── PLUGIN VALORES NAS BARRAS ────────────────────────────────────────────────
var bvlPlugin = {
  id:'bvl',
  afterDatasetsDraw:function(chart){
    var ctx=chart.ctx, horiz=chart.options&&chart.options.indexAxis==='y';
    chart.data.datasets.forEach(function(ds,di){
      chart.getDatasetMeta(di).data.forEach(function(bar,i){
        var val=ds.data[i]; if(val==null)return;
        ctx.save(); ctx.fillStyle='#35383F'; ctx.font='600 10px DM Mono,monospace';
        if(horiz){ctx.textAlign='left';ctx.textBaseline='middle';ctx.fillText(String(val),bar.x+5,bar.y);}
        else{ctx.textAlign='center';ctx.textBaseline='bottom';ctx.fillText(String(val),bar.x,bar.y-3);}
        ctx.restore();
      });
    });
  }
};

// ─── RENDER ───────────────────────────────────────────────────────────────────
function render(){
  Object.values(_charts).forEach(function(c){if(c)c.destroy();}); _charts={};
  var src = filtered;
  var el  = document.getElementById('content');

  if(!src.length){
    el.innerHTML='<div class="empty-state">Nenhuma resposta encontrada</div>';
    return;
  }

  var globalAvg = avgFields(CAMPOS_SCORE, src);
  var textos    = src.filter(function(d){ return d.sugestao==='Sim' && d.texto && d.texto.trim(); });

  var distV = countByVal('variedade', src);
  var exN=(distV['Excelente']||0), boN=(distV['Bom']||0);
  var reN=(distV['Regular']||0),   pmN=(distV['Precisa melhorar']||0)+(distV['Precisa Melhorar']||0);
  var exP=pct(exN,src.length), boP=pct(boN,src.length), reP=pct(reN,src.length), pmP=pct(pmN,src.length);

  var html = '';

  // ── 3 KPIs ────────────────────────────────────────────────────────────────
  html += '<div class="kpi-strip">';
  html += kpi(globalAvg.toFixed(1), 'Score Geral',  true,  scoreLabel(globalAvg) + ' · escala 1–5');
  html += kpi(src.length,           'Respostas',     false, 'avaliações coletadas');
  html += kpi(textos.length,        'Sugestões',     false, 'comentários registrados');
  html += '</div>';

  // ── Distribuição de Satisfação ────────────────────────────────────────────
  html += '<div class="chart-card">' +
    '<div class="chart-title">Distribuição de Satisfação</div>' +
    '<div class="nps-bar">' +
      nseg('#1A5C2A',exP) + nseg('#35383F',boP) + nseg('#F5A623',reP) + nseg('#D0021B',pmP) +
    '</div>' +
    '<div class="nps-legend">' +
      nleg('#1A5C2A','Excelente', exP+'% ('+exN+')') +
      nleg('#35383F','Bom',       boP+'% ('+boN+')') +
      nleg('#F5A623','Regular',   reP+'% ('+reN+')') +
      nleg('#D0021B','Precisa Melhorar', pmP+'% ('+pmN+')') +
    '</div>' +
  '</div>';

  // ── Score por critério ────────────────────────────────────────────────────
  html += '<div class="chart-card"><div class="chart-title">Score por Critério (1–5)</div><div class="chart-wrap tall"><canvas id="cCrit"></canvas></div></div>';

  // ── Temperatura ───────────────────────────────────────────────────────────
  html += '<div class="chart-card"><div class="chart-title">Temperatura dos Alimentos</div><div class="chart-wrap"><canvas id="cTemp"></canvas></div></div>';

  // ── Atendimento ───────────────────────────────────────────────────────────
  html += '<div class="chart-card"><div class="chart-title">Avaliação do Atendimento</div><div class="chart-wrap"><canvas id="cAtend"></canvas></div></div>';

  // ── Sugestões ─────────────────────────────────────────────────────────────
  if(textos.length){
    html += '<div class="section-title">Sugestões e Comentários</div>';
    textos.forEach(function(d){
      html += '<div class="sugestao-card">' +
        '<div class="sugestao-text">"' + escH(d.texto) + '"</div>' +
        '<div class="sugestao-meta">' + escH(d.data) + '</div>' +
      '</div>';
    });
  }

  el.innerHTML = html;

  // Gráficos
  var critLabels = Object.keys(CAMPOS_LABEL).map(function(k){ return CAMPOS_LABEL[k]; });
  var critData   = Object.keys(CAMPOS_LABEL).map(function(k){ return +avgField(k,src).toFixed(2); });
  makeHoriz('cCrit', critLabels, critData, critData.map(barColorFor));

  makeBar('cTemp', countByVal('temperatura',src),
    ['Sempre','Na Maioria das Vezes','Às Vezes','Raramente'],
    {'Sempre':'#1A5C2A','Na Maioria das Vezes':'#35383F','Às Vezes':'#F5A623','Raramente':'#D0021B'}
  );
  makeBar('cAtend', countByVal('atendimento',src),
    ['Excelente','Bom','Regular','Precisa Melhorar','Precisa melhorar'],
    {'Excelente':'#1A5C2A','Bom':'#35383F','Regular':'#F5A623','Precisa Melhorar':'#D0021B','Precisa melhorar':'#D0021B'}
  );

  var fd = document.getElementById('footer-date');
  if(fd){ var n=new Date(); fd.textContent='Atualizado: '+pad(n.getDate())+'/'+pad(n.getMonth()+1)+'/'+n.getFullYear()+', '+pad(n.getHours())+':'+pad(n.getMinutes()); }
}

// ─── HELPERS HTML ─────────────────────────────────────────────────────────────
function kpi(val, label, hero, sub){
  return '<div class="kpi-card'+(hero?' hero':'')+'">'+
    '<span class="kpi-label">'+escH(label)+'</span>'+
    '<span class="kpi-number">'+escH(String(val))+'</span>'+
    (sub?'<span class="kpi-sub">'+escH(sub)+'</span>':'')+
  '</div>';
}
function nseg(col,p){ return p>0?'<div class="nps-seg" style="width:'+p+'%;background:'+col+'"></div>':''; }
function nleg(col,label,val){ return '<div class="nps-legend-item"><div class="nps-dot" style="background:'+col+'"></div>'+escH(label)+' · <strong>'+val+'</strong></div>'; }

// ─── CHART BUILDERS ───────────────────────────────────────────────────────────
function makeHoriz(id, labels, data, bgs){
  var c=document.getElementById(id); if(!c||typeof Chart==='undefined')return;
  _charts[id]=new Chart(c,{
    type:'bar',
    data:{ labels:labels, datasets:[{ data:data, backgroundColor:bgs, borderWidth:0, borderRadius:4, barPercentage:0.65 }] },
    plugins:[bvlPlugin],
    options:{
      indexAxis:'y', responsive:true, maintainAspectRatio:false, animation:false,
      layout:{ padding:{ right:36 } },
      plugins:{ legend:{display:false}, tooltip:{enabled:false} },
      scales:{
        x:{ min:0, max:5, grid:{display:false}, border:{display:false}, ticks:{display:false} },
        y:{ grid:{display:false}, border:{display:false}, ticks:{ color:'#35383F', font:{family:'DM Mono',size:10} } }
      }
    }
  });
}
function makeBar(id, counts, order, colors){
  var c=document.getElementById(id); if(!c||typeof Chart==='undefined')return;
  var labels = order.filter(function(k){ return counts[k]; });
  var data   = labels.map(function(k){ return counts[k]; });
  var bgs    = labels.map(function(k){ return colors[k]||'#35383F'; });
  _charts[id]=new Chart(c,{
    type:'bar',
    data:{ labels:labels, datasets:[{ data:data, backgroundColor:bgs, borderWidth:0, borderRadius:5, barPercentage:0.6 }] },
    plugins:[bvlPlugin],
    options:{
      responsive:true, maintainAspectRatio:false, animation:false,
      layout:{ padding:{ top:18 } },
      plugins:{ legend:{display:false}, tooltip:{enabled:false} },
      scales:{
        x:{ grid:{display:false}, border:{display:false}, ticks:{ color:'#35383F', font:{family:'DM Mono',size:10} } },
        y:{ grid:{display:false}, border:{display:false}, ticks:{display:false}, beginAtZero:true }
      }
    }
  });
}
