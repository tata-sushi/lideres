<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Banco de Horas</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { width: 100%; height: 100%; background: #F4F4F4; overflow: hidden; }

    .wrapper {
      width: 100%;
      height: 100vh;
      overflow: hidden;
    }

    iframe {
      display: block;
      border: none;
      transform-origin: top left;
    }

    /* ── DESKTOP (> 1024px): 100% normal ── */
    @media (min-width: 1025px) {
      iframe {
        width: 100%;
        height: calc(100vh + 56px);
        transform: scale(1);
      }
    }

    /* ── TABLET (768px – 1024px): 80% ── */
    @media (min-width: 768px) and (max-width: 1024px) {
      iframe {
        width: calc(100% / 0.8);
        height: calc((100vh + 56px) / 0.8);
        transform: scale(0.8);
      }
    }

    /* ── MOBILE (< 768px): 50% ── */
    @media (max-width: 767px) {
      iframe {
        width: calc(100% / 0.5);
        height: calc((100vh + 56px) / 0.5);
        transform: scale(0.5);
      }
    }
  </style>
</head>
<body>
  <div class="wrapper">
    <iframe
      title="G&G - BANCO DE HORAS"
      src="https://app.powerbi.com/view?r=eyJrIjoiMjJlNzM5ZWItNDkwZi00MjYwLTkxMTMtZjFkMDE1YzIyNmZhIiwidCI6IjM1ZGMyZjFlLWU0MzItNDEzNC04ZWUyLThkOGFiM2U1ZjA5MyJ9"
      allowfullscreen="true"
    ></iframe>
  </div>
</body>
</html>
