<head>
  <meta charset="UTF-8" />

  <title>Banco de Horas — TATÁ Sushi</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { width: 100%; height: 100%; background: #F4F4F4; overflow: hidden; font-family: 'DM Sans', sans-serif; }

    /* ── HEADER ── */
    .header {
      background: #FFFFFF;
      border-bottom: 1px solid #E2E2E2;
      padding: 10px 16px;
      display: flex;
      align-items: center;
      gap: 10px;
      position: sticky;
      top: 0;
      z-index: 100;
      height: 60px;
    }
    .logo-img { width: 40px; height: 40px; object-fit: contain; flex-shrink: 0; }
    .header-title { font-size: 20px; font-weight: 700; color: #35383F; letter-spacing: -0.3px; }
    .header-user {
      font-family: 'DM Mono', monospace;
      font-size: 10px;
      font-weight: 500;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      color: #35383F;
      background: #F4F4F4;
      border: 1px solid #E2E2E2;
      border-radius: 4px;
      padding: 0 10px;
      height: 28px;
      display: inline-flex;
      align-items: center;
      white-space: nowrap;
      margin-left: auto;
    }

    /* ── WRAPPER IFRAME ── */
    .wrapper {
      position: relative;
      width: 100%;
      height: calc(100vh - 60px - 44px); /* viewport - header - footer */
      overflow: hidden;
    }

    iframe {
      display: block;
      border: none;
      transform-origin: top left;
    }

    /* Faixas sobrepostas para cobrir bordas brancas do PBI */
    .overlay-top, .overlay-left, .overlay-right {
      position: absolute;
      background: #F4F4F4;
      z-index: 10;
      pointer-events: none;
    }
    .overlay-top   { top: 0; left: 0; right: 0; height: 8px; }
    .overlay-left  { top: 0; left: 0; bottom: 0; width: 8px; }
    .overlay-right { top: 0; right: 0; bottom: 0; width: 8px; }

    /* ── DESKTOP (> 1024px) ── */
    @media (min-width: 1025px) {
      iframe {
        width: 100%;
        height: calc(100vh - 60px - 44px + 56px);
        transform: scale(1);
      }
    }

    /* ── TABLET (768px – 1024px) ── */
    @media (min-width: 768px) and (max-width: 1024px) {
      iframe {
        width: calc(100% / 0.8);
        height: calc((100vh - 60px - 44px + 56px) / 0.8);
        transform: scale(0.8);
      }
    }

    /* ── MOBILE (< 768px) ── */
    @media (max-width: 767px) {
      iframe {
        width: calc(100% / 0.5);
        height: calc((100vh - 60px - 44px + 56px) / 0.5);
        transform: scale(0.5);
      }
    }

    /* ── FOOTER ── */
    .footer {
      background: #35383F;
      padding: 12px 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 3px;
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      z-index: 100;
      height: 44px;
    }
    .footer-line1 {
      font-family: 'DM Mono', monospace;
      font-size: 10px;
      color: #CFFF00;
      letter-spacing: 1px;
      text-transform: uppercase;
    }
    .footer-line2 {
      font-family: 'DM Mono', monospace;
      font-size: 10px;
      color: rgba(255,255,255,0.4);
    }
  </style>
</head>
