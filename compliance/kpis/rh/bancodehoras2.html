<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Banco de Horas</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { width: 100%; height: 100%; background: #F4F4F4; overflow: hidden; font-family: 'DM Sans', sans-serif; }

    .wrapper {
      position: relative;
      width: 100%;
      height: calc(100vh - 44px); /* desconta o footer */
      overflow: hidden;
    }

    iframe {
      display: block;
      border: none;
      transform-origin: top left;
    }

    /* Faixas sobrepostas para cobrir bordas brancas do PBI */
    .overlay-top,
    .overlay-left,
    .overlay-right {
      position: absolute;
      background: #F4F4F4;
      z-index: 10;
      pointer-events: none;
    }
    .overlay-top    { top: 0; left: 0; right: 0; height: 8px; }
    .overlay-left   { top: 0; left: 0; bottom: 0; width: 8px; }
    .overlay-right  { top: 0; right: 0; bottom: 0; width: 8px; }

    /* ── DESKTOP (> 1024px) ── */
    @media (min-width: 1025px) {
      iframe {
        width: 100%;
        height: calc(100vh - 44px + 56px);
        transform: scale(1);
      }
    }

    /* ── TABLET (768px – 1024px) ── */
    @media (min-width: 768px) and (max-width: 1024px) {
      iframe {
        width: calc(100% / 0.8);
        height: calc((100vh - 44px + 56px) / 0.8);
        transform: scale(0.8);
      }
    }

    /* ── MOBILE (< 768px) ── */
    @media (max-width: 767px) {
      iframe {
        width: calc(100% / 0.5);
        height: calc((100vh - 44px + 56px) / 0.5);
        transform: scale(0.5);
      }
    }

    /* ── FOOTER ── */
    .footer {
      background: #35383F;
      padding: 12px 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 3px;
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      z-index: 100;
      height: 44px;
    }
    .footer-line1 {
      font-family: 'DM Mono', monospace;
      font-size: 10px;
      color: #CFFF00;
      letter-spacing: 1px;
      text-transform: uppercase;
    }
    .footer-line2 {
      font-family: 'DM Mono', monospace;
      font-size: 10px;
      color: rgba(255,255,255,0.4);
    }
  </style>
</head>
<body>
  <div class="wrapper">
    <iframe
      title="G&G - BANCO DE HORAS"
      src="https://app.powerbi.com/view?r=eyJrIjoiMjJlNzM5ZWItNDkwZi00MjYwLTkxMTMtZjFkMDE1YzIyNmZhIiwidCI6IjM1ZGMyZjFlLWU0MzItNDEzNC04ZWUyLThkOGFiM2U1ZjA5MyJ9"
      allowfullscreen="true"
    ></iframe>
    <!-- Cobrir bordas brancas do PBI -->
    <div class="overlay-top"></div>
    <div class="overlay-left"></div>
    <div class="overlay-right"></div>
  </div>

  <footer class="footer">
    <div class="footer-line1">TATÁ SUSHI &nbsp;|&nbsp; TATÁ POKE &nbsp;|&nbsp; 2016 – 2026</div>
    <div class="footer-line2" id="footer-date">Atualizado em —</div>
  </footer>

  <script>
    (function() {
      var hoje = new Date();
      var p = function(n) { return n < 10 ? '0' + n : String(n); };
      var fd = document.getElementById('footer-date');
      if (fd) fd.textContent = 'Atualizado: ' + p(hoje.getDate()) + '/' + p(hoje.getMonth() + 1) + '/' + hoje.getFullYear() + ', ' + p(hoje.getHours()) + ':' + p(hoje.getMinutes()) + ':' + p(hoje.getSeconds());
    })();
  </script>
</body>
</html>
