<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tata Férias</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
  :root {
    --bg: #F4F4F4;
    --surface: #FFFFFF;
    --bg-soft: #F5F5F5;
    --carbon: #35383F;
    --citric: #CFFF00;
    --border: rgba(53,56,63,0.12);
    --mid: #6B7280;
    --muted: #9CA3AF;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--carbon); font-family: 'DM Sans', sans-serif; min-height: 100vh; font-size: 14px; padding-bottom: 64px; }

  /* HEADER */
  .header { background: var(--surface); border-bottom: 1px solid var(--border); padding: 10px 16px; display: flex; align-items: center; gap: 10px; position: sticky; top: 0; z-index: 100; }
  .header-left { display: flex; align-items: center; gap: 10px; }
  .header-logo { width: 40px; height: 40px; object-fit: contain; }
  .header-info { display: flex; flex-direction: column; gap: 1px; }
  .header-title { font-size: 16px; font-weight: 700; color: var(--carbon); letter-spacing: -0.01em; }
  .header-sub { font-family: 'DM Mono', monospace; font-size: 10px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.08em; }
  .header-user { font-family: 'DM Mono', monospace; font-size: 10px; font-weight: 500; color: var(--carbon); background: var(--bg); border: 1px solid var(--border); border-radius: 4px; padding: 0 10px; height: 28px; display: inline-flex; align-items: center; white-space: nowrap; margin-left: auto; letter-spacing: 0.5px; text-transform: uppercase; }
  .header-plus { width: 28px; height: 28px; background: var(--carbon); border: none; border-radius: 4px; display: flex; align-items: center; justify-content: center; cursor: pointer; flex-shrink: 0; }
  .header-plus svg { width: 14px; height: 14px; stroke: var(--citric); fill: none; stroke-width: 2.5; stroke-linecap: round; }

  /* FILTER BAR */
  .filter-bar { background: var(--surface); border-bottom: 1px solid var(--border); padding: 14px 20px; display: flex; flex-direction: column; gap: 10px; }
  .filters-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .filter-group { display: flex; flex-direction: column; gap: 4px; }
  .filter-label { font-family: 'DM Mono', monospace; font-size: 10px; font-weight: 500; letter-spacing: 0.8px; text-transform: uppercase; color: var(--mid); }
  .filter-select { appearance: none; background: var(--bg) url("data:image/svg+xml,%3Csvg width='12' height='8' viewBox='0 0 12 8' fill='none' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M1 1L6 7L11 1' stroke='%23555' stroke-width='1.5' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E") no-repeat right 12px center; border: 1px solid var(--border); border-radius: 8px; padding: 9px 36px 9px 12px; font-family: 'DM Sans', sans-serif; font-size: 13px; color: var(--text, #111); cursor: pointer; transition: border-color 0.15s; width: 100%; }
  .filter-select:focus { outline: none; border-color: var(--carbon); }

  /* MAIN */
  .main { padding: 24px 28px; display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }

  /* KPI */
  .kpi-wrap { background: var(--surface); border-bottom: 1px solid var(--border); padding: 14px 20px; }
  .kpi-card { background: var(--bg); border: 1px solid var(--border); border-radius: 8px; padding: 12px 14px; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; gap: 4px; }
  .kpi-label { font-family: 'DM Mono', monospace; font-size: 10px; font-weight: 500; letter-spacing: 0.8px; text-transform: uppercase; color: var(--mid); }
  .kpi-value { font-size: 28px; font-weight: 700; color: var(--carbon); line-height: 1; letter-spacing: -1px; font-variant-numeric: tabular-nums; }
  .kpi-sub { font-family: 'DM Mono', monospace; font-size: 11px; color: var(--muted); }
  .kpi-sub strong { color: var(--carbon); font-weight: 600; }

  /* CHART CARD (padrão ouvidoria) */
  .chart-card { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 18px; display: flex; flex-direction: column; box-shadow: 0 1px 4px rgba(0,0,0,0.07); align-self: start; }
  .chart-card .chart-title { font-family: 'DM Mono', monospace; font-size: 10px; letter-spacing: 0.8px; text-transform: uppercase; color: var(--muted); margin-bottom: 14px; text-align: center; font-weight: 500; }
  .chart-wrap { position: relative; height: 260px; }

  /* TABLE CARD (padrão bancodehoras) */
  .table-card { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; box-shadow: 0 1px 4px rgba(0,0,0,0.07); padding: 16px; display: flex; flex-direction: column; overflow: hidden; }
  .table-card .chart-title { font-family: 'DM Mono', monospace; font-size: 11px; font-weight: 600; letter-spacing: 0.8px; text-transform: uppercase; color: var(--carbon); margin-bottom: 16px; text-align: center; }
  .table-count { font-family: 'DM Mono', monospace; font-size: 10px; color: var(--muted); margin-left: 8px; font-weight: normal; text-transform: none; letter-spacing: 0; }
  .btn-more { display: block; margin: 14px auto 0; background: transparent; border: 1px solid var(--border); padding: 8px 14px; font-family: 'DM Mono', monospace; font-size: 11px; color: var(--carbon); cursor: pointer; border-radius: 6px; }
  .btn-more:hover { border-color: var(--carbon); }
  .table-wrap { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; table-layout: fixed; }
  thead th { font-family: 'DM Mono', monospace; font-size: 9px; font-weight: 500; letter-spacing: 0.8px; text-transform: uppercase; color: var(--muted); padding: 8px 10px; text-align: left; border-bottom: 2px solid var(--carbon); background: var(--surface); cursor: pointer; user-select: none; transition: color 0.15s; }
  thead th:not(:first-child) { text-align: center; }
  thead th:hover { color: var(--carbon); }
  thead th::after { content: ' ↕'; color: var(--muted); }
  thead th.sa::after { content: ' ↑'; color: var(--carbon); }
  thead th.sd::after { content: ' ↓'; color: var(--carbon); }
  tbody tr { transition: background 0.1s; cursor: pointer; }
  tbody tr:hover { background: #FAFAFA; }
  tbody tr:last-child td { border-bottom: none; }
  tbody td { padding: 8px 10px; font-size: 13px; border-bottom: 1px solid var(--border); color: var(--carbon); font-family: 'DM Sans', sans-serif; }
  tbody td:first-child { word-break: break-word; font-weight: 500; }
  tbody td:not(:first-child) { text-align: center; font-family: 'DM Mono', monospace; font-size: 12px; }

  /* CROSS-FILTER (padrão bancodehoras) */
  body.cf-active tbody tr[onclick]:not(.cf-selected) { opacity: 0.45; }
  body.cf-active tbody tr.cf-selected { opacity: 1; }
  tbody tr.cf-selected { background: #FAFAFA !important; box-shadow: inset 4px 0 0 0 var(--carbon); }
  tbody tr.cf-selected td { color: var(--carbon); font-weight: 600; }
  tbody tr.cf-selected td:first-child { padding-left: 14px; }

  /* BADGES */
  .badge { display: inline-block; font-family: 'DM Mono', monospace; font-size: 9px; font-weight: 600; padding: 2px 8px; border-radius: 100px; letter-spacing: 0.04em; }
  .badge-hoje { background: var(--carbon); color: var(--citric); }
  .badge-semana { background: rgba(53,56,63,0.1); color: var(--carbon); }

  /* PROGRESS */
  .prog-wrap { display: flex; flex-direction: column; gap: 4px; min-width: 90px; }
  .prog-track { width: 100%; height: 6px; background: var(--bg-soft); border-radius: 3px; overflow: hidden; }
  .prog-fill { height: 100%; background: var(--carbon); border-radius: 3px; transition: width 0.4s ease; }
  .prog-fill.full { background: var(--citric); }
  .prog-meta { display: flex; justify-content: space-between; align-items: center; }
  .prog-val { font-family: 'DM Mono', monospace; font-size: 9px; color: var(--muted); }
  .prog-dias { font-family: 'DM Mono', monospace; font-size: 9px; color: var(--muted); }

  /* FOOTER */
  .footer { position: fixed; bottom: 0; left: 0; right: 0; background: var(--carbon); padding: 12px 20px; display: flex; flex-direction: column; align-items: center; gap: 3px; z-index: 99; }
  .footer-line1 { font-family: 'DM Mono', monospace; font-size: 10px; color: var(--citric); text-transform: uppercase; letter-spacing: 1px; line-height: 1.4; }
  .footer-line2 { font-family: 'DM Mono', monospace; font-size: 10px; color: rgba(255,255,255,0.4); line-height: 1.4; }

  @media (max-width: 900px) {
    .main { grid-template-columns: 1fr; padding: 16px; }
    .header, .filter-bar { padding-left: 16px; padding-right: 16px; }
  }

  /* ── DRAWER ── */
  .drawer-overlay{position:fixed;inset:0;background:rgba(0,0,0,.3);z-index:300;opacity:0;visibility:hidden;transition:opacity .25s,visibility .25s}
  .drawer-overlay.open{opacity:1;visibility:visible}
  .drawer{position:fixed;top:0;right:0;width:88%;max-width:340px;height:100%;height:100dvh;background:var(--surface);z-index:301;transform:translateX(100%);transition:transform .28s cubic-bezier(.4,0,.2,1);display:flex;flex-direction:column;overflow:hidden;box-shadow:-4px 0 24px rgba(0,0,0,.12);--mid:#555555;--muted:#999999}
  .drawer.open{transform:translateX(0)}
  .drawer-header{display:flex;align-items:center;justify-content:space-between;padding:0 16px;height:52px;border-bottom:1px solid var(--border);flex-shrink:0}
  .drawer-title{font-family:"DM Mono",monospace;font-size:10px;font-weight:500;letter-spacing:.14em;text-transform:uppercase;color:var(--carbon)}
  .drawer-close{width:28px;height:28px;background:var(--bg);border:1px solid var(--border);border-radius:4px;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:border-color .15s}
  .drawer-close:hover{border-color:var(--carbon)}
  .drawer-close svg{width:13px;height:13px;stroke:var(--mid);fill:none;stroke-width:2;stroke-linecap:round}
  .drawer-body{flex:1;overflow-y:auto;padding:14px 16px 10px}
  .drawer-section{margin-bottom:18px}
  .drawer-section-label{font-family:"DM Mono",monospace;font-size:9px;font-weight:500;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);margin-bottom:10px;display:flex;align-items:center;gap:8px}
  .drawer-section-label::after{content:"";flex:1;height:1px;background:var(--border)}
  .drawer-about{font-size:13px;line-height:1.7;color:var(--mid)}
  .drawer-kpi-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .drawer-kpi-card{background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:12px 10px;display:flex;flex-direction:column;align-items:center;gap:4px}
  .drawer-kpi-card-label{font-family:"DM Mono",monospace;font-size:10px;font-weight:500;letter-spacing:.06em;text-transform:uppercase;color:var(--mid)}
  .drawer-kpi-card-number{font-family:"DM Sans",sans-serif;font-size:28px;font-weight:700;color:var(--carbon);line-height:1;letter-spacing:-1px;font-variant-numeric:tabular-nums}
  .drawer-kpi-card-sub{font-family:"DM Mono",monospace;font-size:10px;color:var(--muted)}
  .drawer-kpi-card-sub strong{font-family:"DM Sans",sans-serif;font-weight:700;color:var(--carbon)}
  .drawer-version{background:var(--carbon);border-radius:4px;padding:14px 16px;display:flex;align-items:center;justify-content:space-between}
  .drawer-version-label{font-family:"DM Mono",monospace;font-size:9px;letter-spacing:.12em;text-transform:uppercase;color:rgba(255,255,255,.4)}
  .drawer-version-val{font-family:"DM Mono",monospace;font-size:20px;font-weight:300;color:var(--citric);letter-spacing:.04em}
  .drawer-footer{padding:12px 16px 16px;flex-shrink:0;background:var(--surface)}
  .drawer-footer-label{font-family:"DM Mono",monospace;font-size:9px;font-weight:500;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);margin-bottom:10px;display:flex;align-items:center;gap:8px}
  .drawer-footer-label::after{content:"";flex:1;height:1px;background:var(--border)}
  .drawer-footer-person{display:flex;align-items:center;gap:10px}
  .drawer-footer-avatar{width:32px;height:32px;border-radius:50%;background:var(--carbon);display:flex;align-items:center;justify-content:center;font-family:"DM Mono",monospace;font-size:10px;font-weight:500;color:var(--citric);flex-shrink:0}
  .drawer-footer-name{font-size:13px;font-weight:600;color:var(--carbon)}
  .drawer-footer-role{font-family:"DM Mono",monospace;font-size:9px;color:var(--muted);letter-spacing:.04em;margin-top:1px}
  .drawer-sam-btn{display:flex;align-items:center;justify-content:center;width:100%;padding:10px 14px;background:var(--carbon);border:none;border-radius:4px;font-family:"DM Mono",monospace;font-size:10px;font-weight:500;letter-spacing:.12em;text-transform:uppercase;color:#fff;cursor:pointer;text-decoration:none;transition:opacity .15s}
  .drawer-sam-btn:hover{opacity:.85}
  /* ── Modal Férias ── */
  .mf-overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:400;display:none;align-items:flex-end;justify-content:center}
  .mf-overlay.open{display:flex}
  @media(min-width:600px){.mf-overlay{align-items:center}}
  .mf-modal{background:var(--surface);border-radius:12px 12px 0 0;width:100%;max-width:560px;max-height:92vh;overflow:hidden;display:flex;flex-direction:column}
  @media(min-width:600px){.mf-modal{border-radius:12px;max-height:88vh}}
  .mf-handle{width:36px;height:4px;background:var(--border);border-radius:100px;margin:12px auto 0;flex-shrink:0}
  @media(min-width:600px){.mf-handle{display:none}}
  .mf-header{padding:14px 20px 12px;border-bottom:1px solid var(--border);display:flex;align-items:flex-start;justify-content:space-between;flex-shrink:0}
  .mf-eyebrow{font-family:"DM Mono",monospace;font-size:9px;text-transform:uppercase;letter-spacing:.8px;color:var(--muted);margin-bottom:2px}
  .mf-title{font-size:18px;font-weight:700;color:var(--carbon);letter-spacing:-.3px}
  .mf-close{background:none;border:none;cursor:pointer;color:var(--muted);font-size:18px;line-height:1;padding:4px}
  .mf-body{padding:14px 20px;flex:1;overflow-y:auto}
  .mf-footer{padding:12px 20px 24px;border-top:1px solid var(--border);display:flex;justify-content:flex-end;gap:8px;flex-shrink:0}
  .mf-field{display:flex;flex-direction:column;gap:4px;margin-bottom:12px}
  .mf-field:last-child{margin-bottom:0}
  .mf-row{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px}
  .mf-label{font-family:"DM Mono",monospace;font-size:10px;font-weight:500;letter-spacing:.6px;text-transform:uppercase;color:var(--muted)}
  .mf-input,.mf-select,.mf-textarea{font-family:"DM Sans",sans-serif;font-size:13px;border:1px solid var(--border);border-radius:6px;padding:8px 10px;color:var(--carbon);background:var(--surface);outline:none;width:100%;transition:border-color .15s}
  .mf-input:focus,.mf-select:focus,.mf-textarea:focus{border-color:var(--carbon)}
  .mf-select{appearance:none;background:var(--surface) url("data:image/svg+xml,%3Csvg width='12' height='8' viewBox='0 0 12 8' fill='none' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M1 1L6 7L11 1' stroke='%23555' stroke-width='1.5' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E") no-repeat right 12px center;padding-right:36px}
  .mf-textarea{min-height:72px;resize:vertical}
  .mf-btn-cancel{font-family:"DM Mono",monospace;font-size:10px;color:var(--muted);background:none;border:1px solid var(--border);border-radius:6px;padding:8px 14px;cursor:pointer;text-transform:uppercase}
  .mf-btn-submit{font-family:"DM Mono",monospace;font-size:10px;font-weight:500;border:none;border-radius:6px;padding:8px 18px;background:var(--carbon);color:var(--citric);cursor:pointer;text-transform:uppercase;display:inline-flex;align-items:center;gap:6px;transition:opacity .15s}
  .mf-btn-submit:hover{opacity:.85}
  .mf-btn-submit:disabled{opacity:.4;cursor:default}
  .mf-spin{width:11px;height:11px;border:2px solid rgba(207,255,0,.25);border-top-color:var(--citric);border-radius:50%;animation:mfSpin .6s linear infinite;display:none;flex-shrink:0}
  @keyframes mfSpin{to{transform:rotate(360deg)}}
  .mf-toggle-row{display:flex;gap:8px}
  .mf-toggle{flex:1;padding:8px 10px;font-family:"DM Mono",monospace;font-size:11px;font-weight:500;border:1px solid var(--border);border-radius:6px;background:var(--bg);color:var(--muted);cursor:pointer;transition:all .15s;text-align:center}
  .mf-toggle.active{background:var(--carbon);color:var(--citric);border-color:var(--carbon)}
  .mf-toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--carbon);color:var(--citric);font-family:"DM Mono",monospace;font-size:11px;padding:10px 16px;border-radius:6px;display:none;z-index:500;white-space:nowrap}
  .mf-toast.show{display:block}
  .mf-toast.err{background:#7A1A1A;color:#fff}
</style>
</head>
<body>
