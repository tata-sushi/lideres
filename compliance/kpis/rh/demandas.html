<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Demandas — TATÁ Sushi</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<script defer src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --bg: #F4F4F4; --surface: #FFFFFF; --carbon: #35383F; --citric: #CFFF00;
  --text: #111111; --mid: #555555; --muted: #999999; --border: #E2E2E2;
  --green: #1A5C2A; --green-bg: #EAF4ED; --amber: #7A4A00; --amber-bg: #FFF4DC;
  --red: #7A1A1A; --red-bg: #FDEAEA; --blue: #1A3A5C; --blue-bg: #E8F0FA;
  --radius: 8px; --shadow: 0 1px 4px rgba(0,0,0,0.07);
}
body { font-family: 'DM Sans', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; font-size: 14px; overflow-x: hidden; }

.header { background: var(--surface); border-bottom: 1px solid var(--border); padding: 10px 16px; display: flex; align-items: center; gap: 10px; position: sticky; top: 0; z-index: 100; }
.logo-img { width: 40px; height: 40px; object-fit: contain; flex-shrink: 0; }
.header-title { font-size: 20px; font-weight: 700; color: var(--carbon); letter-spacing: -0.3px; }
.header-sub { font-family: 'DM Mono', monospace; font-size: 10px; color: var(--muted); letter-spacing: 0.5px; text-transform: uppercase; margin-top: 1px; }
.header-user { font-family: 'DM Mono', monospace; font-size: 10px; font-weight: 500; letter-spacing: 0.5px; text-transform: uppercase; color: var(--carbon); background: var(--bg); border: 1px solid var(--border); border-radius: 4px; padding: 0 10px; height: 28px; display: inline-flex; align-items: center; margin-left: auto; white-space: nowrap; }
.header-plus { width: 28px; height: 28px; background: var(--carbon); border: none; border-radius: 4px; display: flex; align-items: center; justify-content: center; cursor: pointer; flex-shrink: 0; }
.header-plus svg { width: 14px; height: 14px; stroke: var(--citric); fill: none; stroke-width: 2.5; stroke-linecap: round; }

.tabs { display: flex; overflow-x: auto; background: var(--surface); border-bottom: 2px solid var(--border); scrollbar-width: none; }
.tabs::-webkit-scrollbar { display: none; }
.tab-btn { flex: 1 0 auto; min-width: max-content; white-space: nowrap; padding: 16px 24px; border: none; background: transparent; font-family: 'DM Mono', monospace; font-size: 11px; font-weight: 500; letter-spacing: 1.5px; text-transform: uppercase; color: var(--muted); cursor: pointer; transition: all 0.18s; border-bottom: 2px solid transparent; margin-bottom: -2px; }
.tab-btn:hover { color: var(--carbon); background: var(--bg); }
.tab-btn.active { background: var(--carbon); color: var(--citric); border-bottom-color: var(--carbon); }

.kpis-wrap { background: var(--surface); border-bottom: 1px solid var(--border); padding: 14px 20px; display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.kpi-card { background: var(--bg); border: 1px solid var(--border); border-radius: var(--radius); padding: 12px 14px; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; gap: 4px; }
.kpi-label { font-family: 'DM Mono', monospace; font-size: 10px; font-weight: 500; letter-spacing: 0.8px; text-transform: uppercase; color: var(--mid); }
.kpi-number { font-size: 28px; font-weight: 700; color: var(--carbon); line-height: 1; letter-spacing: -1px; font-variant-numeric: tabular-nums; }
.kpi-sub { font-family: 'DM Mono', monospace; font-size: 11px; color: var(--muted); }
.kpi-sub strong { color: var(--carbon); font-weight: 600; }

/* Cards de KPI's detalhados */
.kpis-detail { display: flex; flex-direction: column; gap: 14px; padding: 14px 20px 80px; }
@media (min-width: 768px) { .kpis-detail { max-width: 1100px; margin-left: auto; margin-right: auto; padding: 14px 32px 80px; } }
.kpis-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 16px 18px; }
.kpis-card-title { font-family: 'DM Mono', monospace; font-size: 11px; letter-spacing: 0.8px; text-transform: uppercase; color: var(--carbon); font-weight: 700; margin-bottom: 14px; text-align: center; }
.kpis-empty { font-family: 'DM Mono', monospace; font-size: 11px; color: var(--muted); padding: 8px 0; text-align: center; }
.kpis-grid-2 { display: grid; grid-template-columns: 1fr; gap: 14px; }
@media (min-width: 768px) { .kpis-grid-2 { grid-template-columns: 1fr 1fr; } }

.chart-card { background: var(--surface); border-bottom: 1px solid var(--border); padding: 14px 20px 16px; display: flex; flex-direction: column; }
.chart-title { font-family: 'DM Mono', monospace; font-size: 11px; letter-spacing: 0.8px; text-transform: uppercase; color: var(--carbon); margin-bottom: 14px; text-align: center; font-weight: 700; }
.chart-wrap { position: relative; height: 220px; }

/* Bar chart horizontal */
.bar-list { display: flex; flex-direction: column; gap: 6px; }
.bar-row { display: grid; grid-template-columns: 160px 1fr 56px; align-items: center; gap: 8px; }
.bar-name { font-family: 'DM Mono', monospace; font-size: 11px; color: var(--carbon); text-align: right; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.bar-track { height: 18px; background: var(--bg); border-radius: 4px; overflow: hidden; }
.bar-fill { height: 100%; background: var(--carbon); border-radius: 4px; transition: width 0.4s ease; }
.bar-val { font-family: 'DM Mono', monospace; font-size: 11px; font-weight: 600; color: var(--carbon); text-align: right; }

/* Cross-filter (clique nos gráficos/tabela) */
.cf-active-dem .bar-row:not(.cf-selected):not(.cf-related) { opacity: 0.45; }
.cf-active-dem .table-wrap tbody tr:not(.cf-related) { opacity: 0.5; }
.bar-row.clickable { cursor: pointer; }
.bar-row.cf-selected { outline: 2px solid var(--carbon); outline-offset: 2px; border-radius: 4px; }

/* Tabela RELAÇÃO DE TAREFAS */
.table-wrap { overflow-x: auto; }
.table-wrap table { width: 100%; border-collapse: collapse; table-layout: auto; }
.table-wrap thead th { font-family: 'DM Mono', monospace; font-size: 9px; font-weight: 500; letter-spacing: 0.8px; text-transform: uppercase; color: var(--muted); padding: 8px 10px; text-align: left; border-bottom: 2px solid var(--carbon); white-space: nowrap; }
.table-wrap thead th.num { text-align: right; }
.table-wrap tbody td { padding: 8px 10px; font-size: 12px; color: var(--carbon); border-bottom: 1px solid var(--border); vertical-align: middle; white-space: nowrap; }
.table-wrap tbody td.num { font-family: 'DM Mono', monospace; text-align: right; }
.table-wrap tbody td.date { font-family: 'DM Mono', monospace; color: var(--mid); }
.table-wrap tbody tr:hover { background: #FAFAFA; }
.cat-bar-row { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
.cat-bar-label { font-family: 'DM Mono', monospace; font-size: 10px; color: var(--mid); width: 180px; flex-shrink: 0; text-align: right; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.cat-bar-track { flex: 1; background: var(--bg); border-radius: 100px; height: 10px; overflow: hidden; border: 1px solid var(--border); }
.cat-bar-fill { height: 100%; background: var(--carbon); border-radius: 100px; transition: width 0.5s ease; }
.cat-bar-count { font-family: 'DM Mono', monospace; font-size: 10px; font-weight: 500; color: var(--carbon); width: 28px; flex-shrink: 0; }
.dashboard { padding-top: 14px; padding-bottom: 80px; }

/* Single-view: tudo sempre visível, sem tabs */

.filters-wrap { background: var(--surface); border-bottom: 1px solid var(--border); padding: 14px 20px; display: flex; flex-direction: column; gap: 10px; }
.filters-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.filter-group { display: flex; flex-direction: column; gap: 4px; }
.filter-label { font-family: 'DM Mono', monospace; font-size: 10px; font-weight: 500; letter-spacing: 0.8px; text-transform: uppercase; color: var(--mid); }
.filter-select { appearance: none; background: var(--bg); border: 1px solid var(--border); border-radius: var(--radius); padding: 9px 36px 9px 12px; font-family: 'DM Sans', sans-serif; font-size: 13px; color: var(--text); cursor: pointer; transition: border-color 0.15s; width: 100%; }
.filter-select:focus { outline: none; border-color: var(--carbon); }
.filter-input { background: var(--bg); border: 1px solid var(--border); border-radius: var(--radius); padding: 9px 12px; font-family: 'DM Sans', sans-serif; font-size: 13px; color: var(--text); width: 100%; outline: none; transition: border-color 0.15s; }
.filter-input:focus { border-color: var(--carbon); }
.filter-input::placeholder { color: var(--muted); }
.filters-actions { display: flex; align-items: center; justify-content: space-between; padding-top: 2px; }
.btn-clear { font-family: 'DM Mono', monospace; font-size: 10px; letter-spacing: 0.5px; color: var(--muted); background: none; border: none; cursor: pointer; padding: 4px 0; text-transform: uppercase; text-decoration: underline; text-underline-offset: 2px; }
.btn-clear:hover { color: var(--carbon); }
.results-count { font-family: 'DM Mono', monospace; font-size: 11px; color: var(--muted); }
.results-count span { color: var(--carbon); font-weight: 500; }

.content { padding: 16px 20px 80px; display: flex; flex-direction: column; gap: 10px; }
.card { background: var(--surface); border-radius: var(--radius); border: 1px solid var(--border); overflow: hidden; box-shadow: var(--shadow); transition: box-shadow 0.15s; }
.card:hover { box-shadow: 0 3px 12px rgba(0,0,0,0.1); }
.card-header { padding: 12px 14px 10px; border-bottom: 1px solid var(--border); display: flex; align-items: flex-start; justify-content: space-between; gap: 8px; }
.card-titulo { font-size: 13px; font-weight: 600; color: var(--carbon); line-height: 1.4; flex: 1; }
.status-badge { display: inline-flex; align-items: center; flex-shrink: 0; padding: 3px 9px; border-radius: 100px; font-family: 'DM Mono', monospace; font-size: 10px; font-weight: 500; letter-spacing: 0.3px; white-space: nowrap; }
.card-footer { border-top: 1px solid var(--border); padding: 8px 14px; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; background: #FAFAFA; }
.etq-badge { display: inline-flex; align-items: center; padding: 3px 9px; border-radius: 100px; font-family: 'DM Mono', monospace; font-size: 10px; font-weight: 500; white-space: nowrap; }
.date-pill { font-family: 'DM Mono', monospace; font-size: 10px; color: var(--muted); margin-left: auto; }

.s-concluido { background: var(--green-bg); color: var(--green); }
.s-andamento { background: var(--blue-bg); color: var(--blue); }
.s-pendente  { background: var(--amber-bg); color: var(--amber); }
.s-default   { background: #F0F0F0; color: #888; }

.etq-recrutamento  { background: var(--blue-bg);  color: var(--blue); }
.etq-desligamentos { background: var(--red-bg);   color: var(--red); }
.etq-movimentacoes { background: var(--amber-bg); color: var(--amber); }
.etq-promocoes     { background: var(--green-bg); color: var(--green); }
.etq-escalas       { background: var(--amber-bg); color: var(--amber); }
.etq-beneficios    { background: var(--green-bg); color: var(--green); }
.etq-gorjeta       { background: var(--amber-bg); color: var(--amber); }
.etq-reclamacao    { background: var(--red-bg);   color: var(--red); }
.etq-acoes         { background: var(--blue-bg);  color: var(--blue); }
.etq-outros        { background: #F0F0F0; color: #555; }
.etq-default       { background: #F0F0F0; color: #888; }

.empty-state { text-align: center; padding: 60px 20px; color: var(--muted); }
.empty-state p { font-family: 'DM Mono', monospace; font-size: 12px; letter-spacing: 0.5px; text-transform: uppercase; }

.footer { background: var(--carbon); padding: 12px 20px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; position: fixed; bottom: 0; left: 0; right: 0; }
.footer-module { font-family: 'DM Mono', monospace; font-size: 10px; color: var(--citric); letter-spacing: 1px; text-transform: uppercase; }
.footer-date { font-family: 'DM Mono', monospace; font-size: 10px; color: rgba(255,255,255,0.4); }
