<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TATÁ — Organograma</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #F4F4F4;
    --surface: #FFFFFF;
    --carbon: #35383F;
    --citric: #CFFF00;
    --border: #E8E8E8;
    --mid: #6B6F76;
    --muted: #9B9FA6;
    --itaim: #FFD66B;
    --pinheiros: #6BB6FF;
    --puc: #B98AFF;
    --line: rgba(53,56,63,0.25);
    --vinho: #7B2233;
    --vinho-off: rgba(123,34,51,0.16);
    --vinho-off-ink: rgba(123,34,51,0.40);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'DM Sans', sans-serif;
    background: var(--bg);
    color: var(--carbon);
    height: 100vh;
    overflow: hidden;
  }

  /* ── HEADER ── */
  .header {
    position: sticky;
    top: 0;
    z-index: 50;
    background: var(--carbon);
    border-bottom: 1px solid rgba(255,255,255,0.08);
    padding: 10px 16px;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .header-logo {
    height: 40px;
    width: auto;
    display: block;
    flex-shrink: 0;
    object-fit: contain;
    object-position: center;
    padding: 0;
    margin: 0;
    border: none;
    outline: none;
    background: transparent;
    line-height: 0;
    vertical-align: middle;
    clip-path: inset(0 4px 0 0);
  }
  .header-divider {
    width: 1px;
    height: 28px;
    background: transparent;
    flex-shrink: 0;
  }
  .header-text { flex: 1; min-width: 0; }
  .header-title {
    font-size: 18px;
    font-weight: 700;
    color: #FFFFFF;
    line-height: 1.2;
  }
  .header-subtitle {
    display: none;
  }
  .header-meta { display: flex; gap: 10px; align-items: center; flex-shrink: 0; }
  .badge {
    font-family: 'DM Mono', monospace;
    background: var(--carbon);
    color: var(--citric);
    padding: 5px 10px;
    border-radius: 100px;
    font-size: 10px;
    font-weight: 500;
    letter-spacing: 0.5px;
  }
  .view-mode {
    font-family: 'DM Mono', monospace;
    background: var(--bg);
    color: var(--mid);
    padding: 5px 10px;
    border-radius: 100px;
    font-size: 10px;
    border: 1px solid var(--border);
  }
  .btn-refresh {
    background: var(--bg);
    color: var(--carbon);
    border: 1px solid var(--border);
    padding: 5px 12px;
    border-radius: 100px;
    cursor: pointer;
    font-family: 'DM Mono', monospace;
    font-size: 11px;
    transition: all 0.15s;
  }
  .btn-refresh:hover { background: var(--carbon); color: var(--citric); border-color: var(--carbon); }

  /* ── KPI BAR CARD (overlay dentro do canvas-section) ── */
  .kpi-card-wrap {
    position: absolute;
    bottom: 30px;
    left: 30px;
    z-index: 10;
    width: 240px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    overflow: hidden;
    box-shadow: 0 4px 16px rgba(0,0,0,0.12);
  }
  .kpi-card-header {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 10px 12px;
    border-bottom: 1px solid var(--border);
  }
  .kpi-card-title {
    font-size: 12px;
    font-weight: 700;
    color: var(--carbon);
    letter-spacing: -0.1px;
  }
  .kpi-card-body { padding: 4px 12px 8px; }
  .kpi-bar-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 3px 0;
    border-bottom: 1px solid var(--border);
  }
  .kpi-bar-row:last-child { border-bottom: none; }
  .kpi-bar-label {
    font-size: 11px;
    color: var(--carbon);
  }
  .kpi-bar-label--top { font-weight: 400; }
  .kpi-card-title { flex: 1; }
  .kpi-total { font-family: 'DM Mono', monospace; font-size: 12px; font-weight: 700; color: var(--carbon); margin-left: auto; }
  .kpi-bar-track { display: none; }
  .kpi-bar-fill { display: none; }
  .kpi-bar-value {
    font-size: 11px;
    font-weight: 700;
    font-variant-numeric: tabular-nums;
    color: var(--carbon);
    white-space: nowrap;
  }
  .kpi-bar-pct {
    display: inline;
    font-weight: 400;
    color: var(--muted);
    font-size: 10px;
    margin-left: 2px;
  }
  .kpi-section {
    max-width: 1440px;
    margin: 10px auto 0;
    padding: 0 16px;
  }
  .kpi-card-wrap.kpi-mobile {
    position: static;
    width: auto;
    margin: 0;
    box-shadow: none;
  }

  /* ── TOOLBAR ── */
  .toolbar-section {
    display: none;
  }
  .canvas-section {
    position: relative;
  }
  .toolbar {
    position: absolute;
    top: 12px;
    right: 12px;
    z-index: 10;
    display: flex;
    align-items: center;
    gap: 8px;
    white-space: nowrap;
  }
  .toolbar-controls {
    display: flex;
    align-items: center;
    gap: 6px;
    background: var(--carbon);
    border-radius: 100px;
    padding: 7px 12px;
    box-shadow: 0 4px 16px rgba(0,0,0,0.18);
  }
  .toolbar.collapsed .toolbar-controls { display: none; }
  .toolbar-toggle {
    width: 36px;
    height: 36px;
    flex-shrink: 0;
    background: var(--carbon);
    border: none;
    border-radius: 50%;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 4px 16px rgba(0,0,0,0.18);
    position: relative;
    z-index: 11;               /* sempre por cima da pílula de aviso */
    transition: transform 0.6s cubic-bezier(0.4,0,0.2,1);
  }
  .toolbar-toggle svg {
    width: 16px;
    height: 16px;
    stroke: var(--citric);
    fill: none;
    stroke-width: 2.2;
    stroke-linecap: round;
    stroke-linejoin: round;
    transition: transform 0.2s;
  }
  .toolbar:not(.collapsed) .toolbar-toggle svg { transform: rotate(180deg); }
  .toolbar-toggle.arrow-right svg { transform: rotate(180deg); }   /* aponta p/ direita ao recolher o aviso */
  .toolbar-controls button {
    font-family: 'DM Mono', monospace;
    font-size: 10px;
    background: transparent;
    border: 1px solid rgba(255,255,255,0.2);
    padding: 5px 11px;
    border-radius: 100px;
    cursor: pointer;
    color: #FFFFFF;
    transition: all 0.15s;
  }
  .toolbar-controls button:hover { background: var(--citric); color: var(--carbon); border-color: var(--citric); }
  .unit-filter {
    font-family: 'DM Mono', monospace;
    font-size: 10px;
    background: transparent;
    border: 1px solid rgba(255,255,255,0.2);
    padding: 5px 26px 5px 11px;
    border-radius: 100px;
    cursor: pointer;
    color: #FFFFFF;
    appearance: none;
    -webkit-appearance: none;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='10' height='10' viewBox='0 0 10 10'><path d='M2 4 L5 7 L8 4' stroke='%23FFFFFF' stroke-width='1.5' fill='none' stroke-linecap='round'/></svg>");
    background-repeat: no-repeat;
    background-position: right 10px center;
    transition: all 0.15s;
  }
  .unit-filter:hover, .unit-filter.active { background-color: var(--citric); color: var(--carbon); border-color: var(--citric); background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='10' height='10' viewBox='0 0 10 10'><path d='M2 4 L5 7 L8 4' stroke='%2335383F' stroke-width='1.5' fill='none' stroke-linecap='round'/></svg>"); }
  .unit-filter option { background: var(--carbon); color: #FFFFFF; }
  .legend {
    display: flex;
    gap: 10px;
    font-family: 'DM Mono', monospace;
    font-size: 10px;
    padding-left: 10px;
    border-left: 1px solid var(--border);
    color: var(--mid);
  }
  .legend-item { display: flex; align-items: center; gap: 5px; }
  .legend-dot { width: 8px; height: 8px; border-radius: 2px; }

  /* ── CANVAS ── */
  .canvas {
    background: var(--surface);
    overflow: auto;
    height: 100dvh;
    cursor: grab;
    background-image: radial-gradient(circle, rgba(53,56,63,0.07) 1px, transparent 1px);
    background-size: 20px 20px;
    display: flex;
    align-items: flex-start;
    /* centralização vertical é feita via JS (marginTop/scrollTop no fitScreen) */
    /* Gestos tratados via JS (arrastar + pinça); impede o zoom do navegador */
    touch-action: none;
  }
  .canvas:active { cursor: grabbing; }
  #svgContainer {
    flex-shrink: 0;
    margin: 0 auto;
  }

  /* ── MOBILE TREE ── */
  .tree-section {
    max-width: 1440px;
    margin: 10px auto 0;
    padding: 0 16px;
  }
  .tree-wrap {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 12px;
    min-height: 60vh;
  }
  .tree-toolbar {
    display: flex;
    gap: 6px;
    margin-bottom: 12px;
    padding-bottom: 12px;
    border-bottom: 1px solid var(--border);
  }
  .tree-toolbar button {
    font-family: 'DM Mono', monospace;
    font-size: 10px;
    background: var(--bg);
    border: 1px solid var(--border);
    padding: 8px 12px;
    border-radius: 100px;
    cursor: pointer;
    flex: 1;
    color: var(--carbon);
  }
  .tree-toolbar button.primary { background: var(--carbon); color: var(--citric); border-color: var(--carbon); }
  .tree-toolbar .unit-filter {
    background-color: var(--bg);
    border: 1px solid var(--border);
    color: var(--carbon);
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='10' height='10' viewBox='0 0 10 10'><path d='M2 4 L5 7 L8 4' stroke='%2335383F' stroke-width='1.5' fill='none' stroke-linecap='round'/></svg>");
    padding: 8px 26px 8px 11px;
  }
  .tree-toolbar .unit-filter option { background: #FFFFFF; color: var(--carbon); }
  /* ── PÓDIO MOBILE (peer header) ── */
  .mobile-peer-header {
    display: flex;
    align-items: flex-end;
    justify-content: center;
    gap: 8px;
    padding: 16px 12px 0;
    position: relative;
  }
  .mp-center {
    display: flex;
    flex-direction: column;
    align-items: center;
    margin-bottom: 0;
  }
  .mp-card {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 5px;
    background: var(--carbon);
    border-radius: 10px;
    padding: 8px 8px 7px;
    width: 100px;
  }
  .mp-card.mp-ceo { margin-bottom: 0; }
  .mp-avatar {
    width: 32px; height: 32px;
    border-radius: 50%;
    background: var(--citric);
    display: flex; align-items: center; justify-content: center;
    font-family: 'DM Sans', sans-serif;
    font-size: 12px; font-weight: 700; color: var(--carbon);
    flex-shrink: 0; overflow: hidden;
  }
  .mp-avatar-ceo { width: 32px; height: 32px; font-size: 12px; }
  .mp-name {
    font-family: 'DM Sans', sans-serif;
    font-size: 10px; font-weight: 700;
    color: #FFFFFF; text-align: center;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    max-width: 100%;
  }
  .mp-role {
    font-family: 'DM Mono', monospace;
    font-size: 8px; color: var(--citric);
    text-align: center; letter-spacing: 0.04em;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    max-width: 100%;
  }
  .mp-connector {
    width: 2px; height: 20px;
    background: #35383F;
    margin: 0 auto;
  }

  .tree-root-connector {
    position: relative;
    height: 28px;
    margin: 0 12px;
  }
  /* horizontal: vai do centro (onde Tito está) até a esquerda (onde a vertical da árvore começa) */
  .tree-root-connector::before {
    content: '';
    position: absolute;
    bottom: 0; left: 0; right: 0;
    height: 2px;
    background: #35383F;
  }
  /* vertical: desce de Tito até a horizontal */
  .tree-root-connector::after {
    content: '';
    position: absolute;
    top: 0; bottom: 0;
    left: 50%;
    width: 2px;
    transform: translateX(-50%);
    background: #35383F;
  }

  .tree-item { margin-left: 12px; }
  .tree-item.root { margin-left: 0; }
  .tree-row {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 8px 12px;
    margin: 4px 0 4px 12px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    cursor: pointer;
    position: relative;
    transition: all 0.15s;
  }
  .tree-item.root > .tree-row { margin-left: 0; }
  .tree-row::before {
    content: '';
    position: absolute;
    left: -12px; top: 50%;
    width: 12px; height: 1px;
    background: var(--line);
  }
  .tree-item.root > .tree-row::before { display: none; }
  .tree-row:hover { border-color: var(--carbon); }
  .tree-row.has-children { background: var(--carbon); color: #fff; border-color: var(--carbon); }
  .tree-row.has-children .tree-role { color: var(--citric); }
  .tree-row.has-children .tree-toggle { background: var(--citric); color: var(--carbon); }
  .tree-row.has-children .tree-avatar { color: var(--carbon); }
  .tree-row.unit-itaim { border-left: 3px solid var(--carbon); }
  .tree-row.unit-pinheiros { border-left: 3px solid var(--carbon); }
  .tree-row.unit-puc { border-left: 3px solid var(--carbon); }
  .tree-row.unit-tatahouse { border-left: 3px solid var(--carbon); }
  .tree-row:not([class*="unit-"]):not(.has-children) { border-left: 3px solid var(--citric); }

  .tree-avatar {
    width: 36px; height: 36px;
    border-radius: 50%;
    flex-shrink: 0;
    background: var(--citric);
    display: flex; align-items: center; justify-content: center;
    font-weight: 700; color: var(--carbon); font-size: 12px;
    overflow: hidden;
    border: 2px solid var(--surface);
    box-shadow: 0 0 0 1px var(--border);
  }
  .tree-avatar img { width: 100%; height: 100%; object-fit: cover; }
  .tree-row.has-children .tree-avatar { box-shadow: 0 0 0 1px var(--citric); }

  .tree-toggle {
    width: 22px; height: 22px;
    background: var(--bg);
    border-radius: 5px;
    display: flex; align-items: center; justify-content: center;
    font-family: 'DM Mono', monospace;
    font-size: 14px; font-weight: 700;
    flex-shrink: 0;
    color: var(--carbon);
  }
  .tree-toggle.empty { visibility: hidden; }

  .tree-pill {
    flex-shrink: 0;
    font-family: 'DM Mono', monospace;
    font-size: 9px;
    font-weight: 700;
    background: var(--citric);
    color: var(--carbon);
    border-radius: 20px;
    padding: 2px 8px;
    white-space: nowrap;
    min-width: 40px;
    text-align: center;
  }

  .tree-info { flex: 1; min-width: 0; }
  .tree-name { font-weight: 600; font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .tree-role {
    font-family: 'DM Mono', monospace;
    font-size: 10px; color: var(--mid);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .tree-meta { display: flex; gap: 4px; flex-shrink: 0; }
  .mini-badge {
    font-family: 'DM Mono', monospace;
    font-size: 9px; padding: 2px 6px;
    border-radius: 100px;
    background: var(--citric); color: var(--carbon); font-weight: 700;
  }
  .tree-item.collapsed > .tree-children { display: none; }

  .tree-children {
    position: relative;
  }
  .tree-children::before {
    content: '';
    position: absolute;
    top: 0; bottom: 0;
    left: 12px;
    width: 2px;
    background: var(--line);
  }

  /* ── MODAL ── */
  .modal-bg {
    position: fixed; inset: 0;
    background: rgba(0,0,0,.5);
    display: none; align-items: flex-end; justify-content: center;
    z-index: 100;
  }
  .modal-bg.show { display: flex; }
  .modal-bg.modal-bg--hidden { display: none; }
  .modal {
    background: var(--surface);
    border-radius: 12px 12px 0 0;
    padding: 0 24px 24px;
    max-width: 480px; width: 100%;
    max-height: 92vh; overflow-y: auto; -webkit-overflow-scrolling: touch;
    position: relative; display: flex; flex-direction: column;
  }
  .modal-handle { width: 36px; height: 4px; background: var(--border); border-radius: 100px; margin: 12px auto 0; flex-shrink: 0; }
  .modal-close-x {
    position: absolute;
    top: 14px; right: 14px;
    width: 28px; height: 28px;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 6px;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer;
    transition: border-color 0.15s;
  }
  .modal-close-x:hover { border-color: var(--carbon); }
  .modal-close-x svg { width: 13px; height: 13px; stroke: var(--mid); fill: none; stroke-width: 2; stroke-linecap: round; }
  .modal-avatar {
    width: 72px; height: 72px; border-radius: 50%;
    background: var(--citric);
    margin: 16px auto 12px;
    display: flex; align-items: center; justify-content: center;
    font-weight: 700; font-size: 24px; color: var(--carbon);
    overflow: hidden; border: 3px solid var(--carbon);
  }
  .modal-avatar img { width: 100%; height: 100%; object-fit: cover; }
  .modal h3 { font-size: 18px; font-weight: 700; color: var(--carbon); letter-spacing: -0.3px; text-align: center; margin-bottom: 4px; }
  .modal-role { font-family: 'DM Mono', monospace; font-size: 10px; letter-spacing: 0.5px; text-transform: uppercase; color: var(--muted); text-align: center; margin-bottom: 9px; }
  /* selos de avaliação — círculos com check (apagados por padrão, acendem conforme avaliações) */
  .modal-checks { display: flex; justify-content: center; align-items: center; gap: 7px; margin: 0 0 16px; }
  .modal-check {
    width: 18px; height: 18px;
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    background: var(--vinho-off);
    color: var(--vinho-off-ink);
    flex-shrink: 0;
    transition: background 0.2s, color 0.2s;
  }
  .modal-check svg { width: 11px; height: 11px; stroke: currentColor; fill: none; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
  .modal-check.on { background: var(--vinho); color: #FFFFFF; }
  .modal-row {
    display: flex; justify-content: space-between;
    padding: 8px 0; border-bottom: 1px solid var(--border);
    font-size: 13px; gap: 12px;
  }
  .modal-row span:first-child { font-family: 'DM Mono', monospace; font-size: 9px; text-transform: uppercase; letter-spacing: 0.5px; color: var(--muted); flex-shrink: 0; align-self: center; }
  .modal-row span:last-child { font-weight: 500; color: var(--carbon); text-align: right; word-break: break-word; }
  .modal-actions {
    display: flex; gap: 8px; margin-top: 16px;
  }
  .modal-close {
    flex: 1; height: 40px;
    background: var(--carbon); color: var(--citric);
    border: none;
    border-radius: 100px;
    font-family: 'DM Mono', monospace;
    font-size: 10px; cursor: pointer;
    letter-spacing: 0.6px; text-transform: uppercase;
    transition: opacity 0.15s;
  }
  .modal-close:hover { opacity: 0.85; }
  .modal-btn-cargo {
    flex: 1; height: 40px;
    background: var(--carbon); color: var(--citric);
    border: none;
    border-radius: 100px;
    font-family: 'DM Mono', monospace;
    font-size: 10px; cursor: pointer;
    letter-spacing: 0.6px; text-transform: uppercase;
    transition: opacity 0.15s;
  }
  .modal-btn-cargo:hover { opacity: 0.85; }

  /* ── SUB-MODAIS (cargo / remuneração) ── */
  .sub-modal-bg {
    position: fixed; inset: 0;
    background: rgba(0,0,0,.5);
    display: none; align-items: flex-end; justify-content: center;
    z-index: 200;
  }
  .sub-modal-bg.show { display: flex; }
  .sub-modal {
    background: var(--surface);
    border-radius: 12px 12px 0 0;
    width: 100%;
    max-height: 92vh; display: flex; flex-direction: column;
  }
  .sub-modal.cargo  { max-width: 580px; }
  .sub-modal.remuneracao { max-width: 420px; }
  .sub-modal-handle { width: 36px; height: 4px; background: var(--border); border-radius: 100px; margin: 12px auto 0; flex-shrink: 0; }
  .sub-modal-header {
    display: flex; align-items: flex-start; justify-content: space-between;
    padding: 14px 20px 12px;
    border-bottom: 1px solid var(--border);
    background: var(--surface);
    position: sticky; top: 0; z-index: 1; flex-shrink: 0;
  }
  .sub-modal-title {
    font-family: 'DM Mono', monospace;
    font-size: 9px; font-weight: 500;
    letter-spacing: 0.8px; text-transform: uppercase;
    color: var(--muted); margin-bottom: 2px;
  }
  .sub-modal-subtitle {
    font-family: 'DM Sans', sans-serif;
    font-size: 18px; font-weight: 700;
    color: var(--carbon); letter-spacing: -0.3px;
  }
  .sub-modal-close {
    background: none; border: none; cursor: pointer;
    color: var(--muted); font-size: 20px; line-height: 1;
    padding: 2px 4px; flex-shrink: 0;
  }
  .sub-modal-close svg { display: none; }
  .sub-modal-body { padding: 20px 18px; overflow-y: auto; flex: 1; }
  .sub-modal-section { margin-bottom: 20px; }
  .sub-modal-section:last-child { margin-bottom: 0; }
  .sub-modal-label {
    font-family: 'DM Mono', monospace;
    font-size: 9px; font-weight: 500;
    letter-spacing: 0.16em; text-transform: uppercase;
    color: var(--muted); margin-bottom: 8px;
    display: flex; align-items: center; gap: 8px;
  }
  .sub-modal-label::after { content: ''; flex: 1; height: 1px; background: var(--border); }
  .sub-modal-text {
    font-family: 'DM Sans', sans-serif;
    font-size: 13px; line-height: 1.7; color: var(--mid);
  }
  .sub-modal-list { list-style: none; padding: 0; margin: 0; display: flex; flex-direction: column; gap: 6px; }
  .sub-modal-list li {
    font-family: 'DM Sans', sans-serif;
    font-size: 13px; color: var(--mid);
    padding-left: 14px; position: relative; line-height: 1.5;
  }
  .sub-modal-list li::before { display: none; }
  .qual-list { list-style: disc; padding-left: 18px; margin: 0; display: flex; flex-direction: column; gap: 5px; }
  .qual-list li { font-family: 'DM Sans', sans-serif; font-size: 13px; color: var(--mid); line-height: 1.5; }
  .qual-list li strong { color: var(--carbon); font-weight: 600; }
  .sub-modal-tag {
    display: inline-block;
    background: var(--bg); border: 1px solid var(--border);
    border-radius: 100px;
    font-family: 'DM Mono', monospace;
    font-size: 10px; color: var(--carbon);
    padding: 4px 12px; margin: 2px 4px 2px 0;
  }

  /* ── ESTADOS ── */
  .err-box {
    max-width: 1440px;
    margin: 0 auto;
    padding: 0;
  }
  .err-inner {
    padding: 12px 16px;
    border-radius: 8px;
    font-family: 'DM Mono', monospace;
    font-size: 12px;
    background: #FFE0E0; border: 1px solid #FF8888; color: #800000;
    display: none;
  }
  .err-inner.show { display: block; }

  @media (min-width: 768px) {
    .modal-bg, .sub-modal-bg { align-items: center; }
    .modal { border-radius: 12px; max-height: 88vh; animation: orgModalIn 0.22s ease; }
    .sub-modal { border-radius: 12px; max-height: 88vh; animation: orgModalIn 0.22s ease; }
    @keyframes orgModalIn { from{opacity:0;transform:scale(.97) translateY(6px)} to{opacity:1;transform:scale(1) translateY(0)} }
    .modal-handle, .sub-modal-handle { display: none; }
  }

  /* LOADING OVERLAY — padrão único do portal (git-claude/readmeload.md) */
  .loading-overlay { display: none; position: fixed; inset: 0; background: rgba(255,255,255,.75); z-index: 500; align-items: center; justify-content: center; flex-direction: column; gap: 10px; }
  .loading-overlay.show { display: flex; }
  .loading-overlay .spinner { width: 28px; height: 28px; border: 3px solid var(--border); border-top-color: var(--carbon); border-radius: 50%; animation: spin .7s linear infinite; }
  .loading-overlay span { font-family: 'DM Mono', monospace; font-size: 11px; color: var(--mid); }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* ── FOOTER ── */
  .footer {
    position: fixed;
    bottom: 0; left: 0; right: 0;
    background: var(--carbon);
    padding: 8px 24px;
    text-align: center;
    z-index: 40;
  }
  .footer-brand {
    font-family: 'DM Mono', monospace;
    font-size: 10px;
    color: var(--citric);
    text-transform: uppercase;
    letter-spacing: 1px;
    line-height: 1.4;
  }
  .footer-updated {
    font-family: 'DM Mono', monospace;
    font-size: 10px;
    color: rgba(255,255,255,0.4);
    margin-top: 1px;
  }

  /* ── RESPONSIVO ── */
  @media (max-width: 640px) {
    .toolbar { top: 8px; right: 8px; }
    .toolbar-controls { padding: 6px 10px; gap: 4px; }
    .toolbar-controls button, .unit-filter { font-size: 9px; padding: 4px 9px; }
  }

  /* ── AVISOS: pílula que nasce de dentro do menu; a setinha acompanha (vai p/ a esquerda) ── */
  .hint-bar {
    position: fixed;
    top: 12px;                 /* alinhado com a setinha (36px @ top 12) */
    right: 12px;               /* borda direita alinhada com a setinha */
    height: 36px;
    z-index: 9;                /* abaixo da toolbar (z-index 10): a setinha fica por cima */
    display: flex;
    align-items: center;
    gap: 8px;
    max-width: min(92vw, 350px);
    padding: 0 18px 0 50px;    /* espaço à ESQUERDA p/ a setinha, que vai p/ lá ao abrir */
    background: var(--carbon); /* mesmo padrão do seletor */
    color: #FFFFFF;
    border-radius: 100px;      /* PÍLULA */
    font-family: 'DM Sans', sans-serif;
    font-size: 11.5px;
    font-weight: 600;
    line-height: 1.15;
    white-space: nowrap;
    visibility: hidden;
    pointer-events: none;
    clip-path: inset(0 0 0 100% round 18px);   /* recolhido: cresce da direita p/ a esquerda */
    transition: clip-path 0.6s cubic-bezier(0.4,0,0.2,1), visibility 0.6s;
  }
  .hint-bar.show { visibility: visible; clip-path: inset(0 0 0 0 round 18px); }
  .hint-ico { flex-shrink: 0; display: flex; }
  .hint-ico svg {
    width: 20px; height: 20px;
    stroke: var(--citric); fill: none;
    stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round;
  }
  .hint-ico.rotate svg { animation: rotate-tip 2.4s ease-in-out infinite; }
  .hint-ico.pinch svg  { animation: pinch-move 1.5s ease-in-out infinite; transform-origin: center; }
  .hint-ico.unit svg   { animation: bob 1.4s ease-in-out infinite; }
  .hint-ico.move svg   { animation: move-around 2s ease-in-out infinite; }
  @keyframes rotate-tip { 0%, 55%, 100% { transform: rotate(0deg); } 25%, 40% { transform: rotate(88deg); } }
  @keyframes pinch-move { 0%, 100% { transform: scale(1); } 50% { transform: scale(0.62); } }
  @keyframes bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-6px); } }
  @keyframes move-around { 0%,100% { transform: translate(0,0); } 25% { transform: translate(-4px,0); } 50% { transform: translate(0,-4px); } 75% { transform: translate(4px,2px); } }
  /* no mobile a toolbar fica em top/right 8px — alinha a pílula à setinha */
  @media (max-width: 640px) {
    .hint-bar { top: 8px; right: 8px; }
  }
</style>

<!-- ══ SCRIPT ══════════════════════════════════════════════════════════════ -->
<script>
(function() {
  'use strict';

  // ============================================
  // CONFIGURAÇÃO — cole aqui a URL do Web App
  // ============================================
  var ENDPOINT = 'https://script.google.com/macros/s/AKfycbxUWUoOmv-Cn19-FjUJ18jYTu5G_embOGDaQDsgC4Jd8agVfgqs98Tbu3qlqa9e7tpu/exec';
  var CES_URL  = 'https://script.google.com/macros/s/AKfycbw2xzOPIsuWKeKwgpKatRyzAOWsvurH8QessggIRaKK3ftrPHdZeDguMJZGxr01z7Y5/exec';
  // Armários — mesma base usada em /compliance/kpis/rh/armarios.html
  var ARMARIO_URL = 'https://script.google.com/macros/s/AKfycbxD9BwHYMh44Zzob_94BKUgoetxhRxm7s7_cYncnQkCYpPrwhzpIO0t3ihSpY72Amxp-A/exec';
  // Medicina ocupacional — mesma base usada em /compliance/kpis/rh/medicina.html
  var MEDICINA_URL = 'https://script.google.com/macros/s/AKfycbw2d8S-nsu0cvs5oPyRZTsXtYvBC_9B85IBkE8t5IGoAsoq2nEumkNGllhSdIGUoXnTbg/exec';

  // Aba "Salarios" → sub-modal REMUNERAÇÃO  |  Aba "Cargos" → sub-modal DESC. DO CARGO
  var _cesSalarios = {};
  var _cesCargos   = {};

  // Armários indexados por matrícula e por nome do colaborador
  var _armariosByMatricula = {};
  var _armariosByNome      = {};

  // Próximo exame (medicina) indexado por matrícula e por nome
  var _exameByMatricula = {};
  var _exameByNome      = {};

  var arvore = null;
  var nodeMap = {};
  var peerNos = [];  // sócios vindos da planilha (sem supervisor, não-CEO)

  function fmtMoney(val) {
    if (val === null || val === undefined || val === '') return '—';
    var n = parseFloat(String(val).replace(',', '.'));
    if (isNaN(n) || n === 0) return '—';
    return 'R$ ' + n.toLocaleString('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  }

  function normCargoId(s) {
    return String(s || '').trim().toLowerCase();
  }

  function carregarCES() {
    fetch(CES_URL + '?action=getAll')
      .then(function(r) { return r.json(); })
      .then(function(data) {
        if (!data.ok) return;
        (data.salarios || []).forEach(function(s) {
          if (s.cargo_id) _cesSalarios[normCargoId(s.cargo_id)] = s;
        });
        (data.cargos || []).forEach(function(c) {
          if (c.cargo_id) _cesCargos[normCargoId(c.cargo_id)] = c;
        });
      })
      .catch(function() {});
  }

  // ============================================
  // CARREGAR ARMÁRIOS (mesma base de armarios.html)
  // ============================================
  function normNome(s) {
    return String(s || '')
      .normalize('NFD').replace(/[̀-ͯ]/g, '')  // remove acentos
      .trim().toLowerCase().replace(/\s+/g, ' ');
  }
  function normMat(s) {
    return String(s || '').trim().toLowerCase();
  }

  function carregarArmarios() {
    fetch(ARMARIO_URL + '?action=armarios')
      .then(function(r) { return r.json(); })
      .then(function(lista) {
        (lista || []).forEach(function(a) {
          if (!a || !a.num) return;
          if (a.matricula) _armariosByMatricula[normMat(a.matricula)] = a;
          if (a.colaborador) _armariosByNome[normNome(a.colaborador)] = a;
        });
      })
      .catch(function() {});
  }

  // Retorna o armário do colaborador (por matrícula ou nome) ou null
  function armarioDoColaborador(n) {
    if (!n) return null;
    var byMat = n.matricula ? _armariosByMatricula[normMat(n.matricula)] : null;
    if (byMat) return byMat;
    return n.nome ? (_armariosByNome[normNome(n.nome)] || null) : null;
  }

  // ============================================
  // CARREGAR PRÓXIMO EXAME (mesma base de medicina.html)
  // ============================================
  // normaliza cabeçalho da planilha → chave (igual a medicina.html)
  function _headerKey(h) {
    return String(h || '').toLowerCase().trim()
      .replace(/[áàâã]/g, 'a').replace(/[éê]/g, 'e')
      .replace(/[í]/g, 'i').replace(/[óôõ]/g, 'o')
      .replace(/[ú]/g, 'u').replace(/[ç]/g, 'c')
      .replace(/\s+/g, '_').replace(/[^a-z0-9_]/g, '_');
  }

  function carregarExames() {
    fetch(MEDICINA_URL + '?action=getData')
      .then(function(r) { return r.json(); })
      .then(function(data) {
        var rows = (data && data.values) || [];
        if (rows.length < 2) return;
        var headers = rows[0].map(_headerKey);
        function col() {  // retorna índice da 1ª chave existente
          for (var i = 0; i < arguments.length; i++) {
            var idx = headers.indexOf(arguments[i]);
            if (idx !== -1) return idx;
          }
          return -1;
        }
        var iMat   = col('matricula');
        var iNome  = col('nome');
        var iProx  = col('proxima_realizacao', 'data_do_proximo_exame', 'data_proximo_exame', 'proximo_exame');
        var iReal  = col('realiza_exame', 'realiza');
        for (var r = 1; r < rows.length; r++) {
          var row = rows[r];
          if (!row || !row.some(function(c) { return c && String(c).trim(); })) continue;
          var rec = {
            proxima: iProx !== -1 ? String(row[iProx] || '').trim() : '',
            realiza: iReal !== -1 ? String(row[iReal] || '').trim() : ''
          };
          var mat = iMat !== -1 ? String(row[iMat] || '').trim() : '';
          var nm  = iNome !== -1 ? String(row[iNome] || '').trim() : '';
          if (mat) _exameByMatricula[normMat(mat)] = rec;
          if (nm)  _exameByNome[normNome(nm)] = rec;
        }
      })
      .catch(function() {});
  }

  // Texto do próximo exame para o colaborador
  function proximoExameDoColaborador(n) {
    if (!n) return '—';
    var rec = (n.matricula && _exameByMatricula[normMat(n.matricula)]) ||
              (n.nome && _exameByNome[normNome(n.nome)]) || null;
    if (!rec) return '—';
    var realiza = normNome(rec.realiza);
    if (realiza === 'nao') return 'Dispensado';
    return rec.proxima || '—';
  }

  function showError(msg) {
    var box = document.getElementById('errBox');
    box.textContent = 'ERRO: ' + msg;
    box.classList.add('show');
    showLoading(false);
    console.error(msg);
  }

  function showLoading(show) {
    document.getElementById('loading-overlay').classList.toggle('show', show);
  }

  // ============================================
  // CARREGAR DADOS DO APPS SCRIPT
  // ============================================
  function carregarDados(opts) {
    opts = opts || {};
    showLoading(true);
    document.getElementById('errBox').classList.remove('show');

    var url = ENDPOINT + (opts.refresh ? (ENDPOINT.indexOf('?') >= 0 ? '&' : '?') + 'refresh=1' : '');
    fetch(url)
      .then(function(r) {
        if (!r.ok) throw new Error('HTTP ' + r.status);
        return r.json();
      })
      .then(function(data) {
        if (data.erro) throw new Error(data.erro);
        if (!data.arvore) throw new Error('Resposta invalida (sem arvore)');

        arvore = inicializarNode(data.arvore);
        sortChildren(arvore);
        nodeMap = {};
        mapearNos(arvore, null);
        peerNos = (data.peers || []).map(function(p) { return Object.assign({ children: [] }, p); });
        peerNos.forEach(function(p) { nodeMap[p.id] = p; });

        atualizarStats(data.stats || {}, data.total || 0);
        // Filtro inicial: Itaim (recalcula flags e reflete no seletor antes do 1º render)
        recomputeFilterFlags(arvore);
        var _uf0 = document.getElementById('unitFilter');
        if (_uf0) { _uf0.value = _unitFilter; _uf0.classList.toggle('active', !!_unitFilter); }
        showLoading(false);
        detectMode(true);
        // Avisos só depois que o carregamento terminou
        setTimeout(showHints, 600);
        var _cv = document.getElementById('canvas');
        if (_cv) _cv.scrollTop = 0;
        if (window.scrollTo) window.scrollTo(0, 0);
        // Reaplica o zoom/centralização depois do layout assentar (fitScreen centraliza)
        setTimeout(function() { if (window.fitScreen) window.fitScreen(); }, 200);

        console.log('Carregado:', data.total, 'colaboradores');
      })
      .catch(function(err) {
        showError(err.message + '. Verifique se o ENDPOINT esta correto e o Web App publicado como "Qualquer pessoa".');
      });
  }

  function inicializarNode(n) {
    n.collapsed = false;
    if (n.children) n.children.forEach(inicializarNode);
    return n;
  }

  function mapearNos(n, parent) {
    nodeMap[n.id] = n;
    n._parent = parent || null;
    if (n.children) n.children.forEach(function(c) { mapearNos(c, n); });
  }

  // Sócios que estão alocados no Administrativo mas não entram na contagem de colaboradores
  var SOCIOS_FORA_DA_CONTA = 3;

  function atualizarStats(stats, total) {
    var back = Math.max(0, (stats.backoffice || 0) - SOCIOS_FORA_DA_CONTA);
    total = Math.max(0, (total || 0) - SOCIOS_FORA_DA_CONTA);

    document.querySelectorAll('.kpi-total').forEach(function(el) { el.textContent = total; });

    var unidades = [
      { key: 'itaim',     val: stats.itaim      || 0 },
      { key: 'pinheiros', val: stats.pinheiros  || 0 },
      { key: 'puc',       val: stats.puc        || 0 },
      { key: 'tatahouse', val: stats.tatahouse  || 0 },
      { key: 'back',      val: back }
    ];

    var sorted = unidades.slice().sort(function(a, b) { return b.val - a.val; });

    document.querySelectorAll('.kpi-bar-list').forEach(function(list) {
      unidades.forEach(function(u) {
        var row = list.querySelector('.kpi-bar-row[data-key="' + u.key + '"]');
        if (!row) return;
        var num = row.querySelector('.kpi-bar-num');
        var pct = row.querySelector('.kpi-bar-pct');
        var pctVal = total > 0 ? Math.round(u.val / total * 100) : 0;
        if (num) num.textContent = u.val;
        if (pct) pct.textContent = '(' + pctVal + '%)';
      });
      sorted.forEach(function(u) {
        var row = list.querySelector('.kpi-bar-row[data-key="' + u.key + '"]');
        if (row) list.appendChild(row);
      });
      var rows = list.querySelectorAll('.kpi-bar-row');
      rows.forEach(function(r) {
        var lbl = r.querySelector('.kpi-bar-label');
        if (lbl) lbl.classList.remove('kpi-bar-label--top');
      });
      if (rows[0]) {
        var firstLbl = rows[0].querySelector('.kpi-bar-label');
        if (firstLbl) firstLbl.classList.add('kpi-bar-label--top');
      }
    });
  }

  window.recarregar = function() { carregarDados(); };
  window.atualizarFotos = function() { carregarDados({ refresh: true }); };

  // ============================================
  // HELPERS
  // ============================================
  function descendantCount(n) {
    var kids = _unitFilter ? filteredChildren(n) : (n.children || []);
    var c = kids.length;
    kids.forEach(function(k) { c += descendantCount(k); });
    return c;
  }
  function isOperacional(n) { return n.nivel === 'operacional'; }

  function cargoSortKey(n) {
    var nivelOrd = { diretoria: 0, gerencia: 1, supervisor: 2, operacional: 3 };
    var base = (nivelOrd[n.nivel] !== undefined ? nivelOrd[n.nivel] : 3) * 100000;
    var c = String(n.cargo || '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '');
    var tier;
    if      (/\bsr\b|\bsenior\b/.test(c))             tier = 10000;
    else if (/\bp3\b/.test(c))                         tier = 20000;
    else if (/\bp2\b/.test(c))                         tier = 30000;
    else if (/\bp1\b|\bpl\b|\bpleno\b/.test(c))       tier = 40000;
    else if (/\bjr\b/.test(c) && !/auxiliar/.test(c)) tier = 50000;
    else if (/\bauxiliar\b/.test(c))                   tier = 60000;
    else if (/aprendiz|estagia/.test(c))               tier = 70000;
    else                                                tier = 50000;
    // Dentro do mesmo tier: número maior = mais sênior = sort menor
    // "Sr 4" → offset 600, "Sr 1" → offset 900, sem número → 500
    var numMatch = c.match(/\b(\d+)\b/);
    var num = numMatch ? parseInt(numMatch[1]) : 0;
    var numOffset = num > 0 ? (10 - Math.min(num, 9)) * 100 : 500;
    return base + tier + numOffset;
  }

  function sortChildren(n) {
    if (!n.children || n.children.length < 2) { if (n.children) n.children.forEach(sortChildren); return; }
    n.children.sort(function(a, b) { return cargoSortKey(a) - cargoSortKey(b); });
    n.children.forEach(sortChildren);
  }

  // ── FILTRO POR UNIDADE ────────────────────────────────────
  // Entra na página já filtrado por Itaim (pode ser trocado no seletor).
  var _unitFilter = 'itaim';

  function nodeMatchesUnit(n) {
    if (!_unitFilter) return true;
    if (_unitFilter === 'adm') return !n.unitClass;
    return n.unitClass === _unitFilter;
  }

  function recomputeFilterFlags(n) {
    var selfMatch = nodeMatchesUnit(n);
    var subtreeMatch = false;
    if (n.children) {
      n.children.forEach(function(c) {
        recomputeFilterFlags(c);
        if (c._matchesFilter) subtreeMatch = true;
      });
    }
    n._matchesFilter = selfMatch || subtreeMatch;
  }

  function filteredChildren(n) {
    if (!n.children) return [];
    if (!_unitFilter) return n.children;
    return n.children.filter(function(c) { return c._matchesFilter; });
  }

  window.setUnitFilter = function(value) {
    _unitFilter = value || '';
    var d = document.getElementById('unitFilter');
    var m = document.getElementById('unitFilterMobile');
    if (d) { d.value = _unitFilter; d.classList.toggle('active', !!_unitFilter); }
    if (m) { m.value = _unitFilter; m.classList.toggle('active', !!_unitFilter); }
    if (!arvore) return;
    recomputeFilterFlags(arvore);
    if (currentMode === 'desktop') renderSvg();
    else renderTree();
  };

  // Filtro de visão inicial: esconde supervisores e operacionais. Qualquer interação do usuário desliga.
  var _initialView = false;

  // Fallback no cliente caso a Apps Script não classifique corretamente (ex.: "Chef Executivo")
  function isManager(n) {
    if (n.nivel === 'diretoria' || n.nivel === 'gerencia') return true;
    var c = (n.cargo || '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '');
    return /^(diretor|ceo|socio|presidente|coo|cfo|chro|cco|gerente|coord|chef)/.test(c);
  }

  // Regra de visibilidade: nas unidades operacionais (Itaim, Pinheiros, Poke,
  // Tatá House) mostra só quem tem subordinados; o Administrativo mostra todos.
  // Nada é apagado — apenas ocultado. Para voltar a exibir todo mundo, troque
  // MOSTRAR_SO_COM_SUBORDINADOS para false.
  var MOSTRAR_SO_COM_SUBORDINADOS = true;
  function temSubordinados(n) { return !!(n.children && n.children.length > 0); }
  function ehAdministrativo(n) { return !n.unitClass; }
  function deveExibirNo(n) {
    if (!MOSTRAR_SO_COM_SUBORDINADOS) return true;
    return ehAdministrativo(n) || temSubordinados(n);
  }

  function visibleChildren(n) {
    if (n.collapsed || !n.children) return [];
    var kids = filteredChildren(n);
    kids = kids.filter(deveExibirNo);
    if (_initialView && !n._expanded) {
      kids = kids.filter(isManager);
    }
    return kids;
  }
  function countVisible(n) {
    var c = 1;
    visibleChildren(n).forEach(function(k) { c += countVisible(k); });
    return c;
  }
  function escapeHtml(str) {
    return String(str).replace(/[&<>"']/g, function(c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }

  function tempoDeCasa(admissao) {
    if (!admissao) return '—';
    var adm = new Date(admissao);
    if (isNaN(adm)) return '—';
    var hoje = new Date();
    var anos = hoje.getFullYear() - adm.getFullYear();
    var meses = hoje.getMonth() - adm.getMonth();
    if (meses < 0 || (meses === 0 && hoje.getDate() < adm.getDate())) { anos--; meses += 12; }
    if (hoje.getDate() < adm.getDate()) { meses--; if (meses < 0) { anos--; meses += 11; } }
    var partes = [];
    if (anos > 0) partes.push(anos + (anos === 1 ? ' ano' : ' anos'));
    if (meses > 0) partes.push(meses + (meses === 1 ? ' mês' : ' meses'));
    return partes.length ? partes.join(' e ') : 'Menos de 1 mês';
  }

  function formatarData(data) {
    if (!data) return '—';
    var d = new Date(String(data).indexOf('T') >= 0 ? data : data + 'T00:00:00');
    if (isNaN(d)) return '—';
    var dd = String(d.getDate()).padStart(2, '0');
    var mm = String(d.getMonth() + 1).padStart(2, '0');
    return dd + '/' + mm + '/' + d.getFullYear();
  }

  function formatarAniversario(dataNasc) {
    if (!dataNasc) return '—';
    var d = new Date(dataNasc + 'T00:00:00');
    if (isNaN(d)) return '—';
    var meses = ['Jan','Fev','Mar','Abr','Mai','Jun','Jul','Ago','Set','Out','Nov','Dez'];
    return d.getDate() + ' de ' + meses[d.getMonth()];
  }

  function abreviarNome(nome) {
    var p = String(nome).trim().split(/\s+/);
    if (p.length <= 2) return nome;
    var primeiro = p[0];
    var ultimo = p[p.length - 1];
    var meios = p.slice(1, -1).map(function(s) { return s.charAt(0) + '.'; });
    return [primeiro].concat(meios).concat([ultimo]).join(' ');
  }
  function setCollapsed(n, value, onlyOps) {
    if (n.children && n.children.length > 0) {
      if (onlyOps) {
        var todosOps = n.children.every(isOperacional);
        if (todosOps) n.collapsed = value;
      } else {
        n.collapsed = value;
      }
      n.children.forEach(function(c) { setCollapsed(c, value, onlyOps); });
    }
  }

  // Mostra somente diretoria + gerentes: colapsa qualquer nó que não seja diretoria.
  // Diretoria fica expandida (filhos visíveis), gerentes ficam visíveis mas com filhos ocultos.
  function collapseToManagers(n) {
    if (!n.children || n.children.length === 0) return;
    n.collapsed = (n.nivel !== 'diretoria');
    n.children.forEach(collapseToManagers);
  }

  // ============================================
  // SVG (DESKTOP)
  // ============================================
  var NODE_W = 160;          // recalculado dinamicamente a cada render (maior card necessário)
  var NODE_H = 108;
  var H_GAP = 24;
  var V_GAP_LEVEL = 152;
  var V_GAP_OP = 12;
  var AVATAR_SIZE = 62;

  // Medição real do texto (para as pílulas caberem nome/cargo completos, sem abreviar)
  var NAME_FONT = '600 11px "DM Sans", sans-serif';
  var ROLE_FONT = '500 9px "DM Mono", monospace';
  var PILL_PAD_X = 12;
  var _measCtx = (function(){ try { return document.createElement('canvas').getContext('2d'); } catch(e) { return null; } })();
  function measureText(text, font) {
    if (!_measCtx) return String(text || '').length * 6.5;
    _measCtx.font = font;
    return _measCtx.measureText(String(text || '')).width;
  }
  function pillNameW(nome) { return Math.ceil(measureText(nome, NAME_FONT)) + PILL_PAD_X * 2; }
  function pillRoleW(cargo) { return cargo ? Math.ceil(measureText(cargo, ROLE_FONT)) + PILL_PAD_X * 2 : 0; }
  function nodeContentW(nome, cargo) { return Math.max(AVATAR_SIZE, pillNameW(nome), pillRoleW(cargo)); }

  // Horizontal layout: 2+ kids where at least one has its own children (multi-dept)
  // Leaf kids are grouped by departamento into shared columns
  function buildGroups(kids) {
    var groups = [];
    var leafMap = {};
    var leafOrder = [];
    kids.forEach(function(c) {
      if (c.children && c.children.length > 0) {
        groups.push({ type: 'node', node: c, subWidth: 0, subHeight: 0 });
      } else {
        var key = c.departamento || '__';
        if (!leafMap[key]) { leafMap[key] = { type: 'leafGroup', nodes: [], subWidth: NODE_W, subHeight: 0 }; leafOrder.push(key); }
        leafMap[key].nodes.push(c);
      }
    });
    leafOrder.forEach(function(k) { groups.push(leafMap[k]); });
    return groups;
  }

  function calcWidth(n) {
    var kids = visibleChildren(n);
    if (kids.length === 0) { n.subWidth = NODE_W; n._layout = 'leaf'; n._groups = []; return NODE_W; }
    n._groups = buildGroups(kids);
    if (n._groups.length === 1) {
      n._layout = 'vertical';
      var g = n._groups[0];
      g.subWidth = (g.type === 'node') ? calcWidth(g.node) : NODE_W;
      n.subWidth = Math.max(NODE_W, g.subWidth);
    } else {
      n._layout = 'horizontal';
      var total = 0;
      n._groups.forEach(function(g) {
        g.subWidth = (g.type === 'node') ? calcWidth(g.node) : NODE_W;
        total += g.subWidth + H_GAP;
      });
      n.subWidth = Math.max(NODE_W, total - H_GAP);
    }
    return n.subWidth;
  }

  function calcSubHeight(n) {
    if (n._layout === 'leaf') { n.subHeight = NODE_H; return NODE_H; }
    n._groups.forEach(function(g) {
      if (g.type === 'node') {
        g.subHeight = calcSubHeight(g.node);
      } else {
        g.subHeight = g.nodes.length * NODE_H + (g.nodes.length - 1) * V_GAP_OP;
      }
    });
    if (n._layout === 'vertical') {
      n.subHeight = V_GAP_LEVEL + n._groups[0].subHeight;
    } else {
      var maxH = 0;
      n._groups.forEach(function(g) { if (g.subHeight > maxH) maxH = g.subHeight; });
      n.subHeight = NODE_H + V_GAP_LEVEL + maxH;
    }
    return n.subHeight;
  }

  function positionGroup(g, x, y) {
    if (g.type === 'node') {
      position(g.node, x, y);
    } else {
      var cx = x + (g.subWidth - NODE_W) / 2;
      var stackY = y;
      g.nodes.forEach(function(c) {
        c.x = cx; c.y = stackY;
        stackY += NODE_H + V_GAP_OP;
      });
    }
  }

  function position(n, x, y) {
    n.x = x + (n.subWidth - NODE_W) / 2;
    n.y = y;
    if (n._layout === 'leaf') return;
    if (n._layout === 'vertical') {
      positionGroup(n._groups[0], n.x + NODE_W / 2 - n._groups[0].subWidth / 2, n.y + V_GAP_LEVEL);
    } else {
      var totalW = 0;
      n._groups.forEach(function(g) { totalW += g.subWidth + H_GAP; });
      var cursor = x + (n.subWidth - (totalW - H_GAP)) / 2;
      n._groups.forEach(function(g) { positionGroup(g, cursor, y + V_GAP_LEVEL); cursor += g.subWidth + H_GAP; });
    }
  }

  var container = document.getElementById('svgContainer');
  var canvas = document.getElementById('canvas');
  var W = 0, H = 0;
  var zoom = 1;

  var PEER_DY   = 30;
  var PEER_GAP  = 20;
  var SUBTIER_DY = 30;   // pequeno degrau dos coordenadores (mesma lógica visual dos sócios)

  // Coordenadores ligados direto ao CEO ganham o mesmo tratamento visual dos
  // sócios: continuam filhos do CEO (hierarquia/líder intactos), mas flanqueiam
  // a fileira dos gerentes um pequeno degrau abaixo.
  function isSubTierRole(n) {
    var c = String(n && n.cargo || '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '');
    return /\bcoordenador/.test(c);
  }
  // Gerente que ocupa o CENTRO da fileira (sob o CEO): a "Gerente Executiva" (Cinthia)
  function isCentralManager(n) {
    var c = String(n && n.cargo || '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '');
    var nome = String(n && n.nome || '').toLowerCase();
    return /gerente executiv/.test(c) || /\bcinthia\b/.test(nome);
  }
  // Desloca o nó e toda a subárvore visível por (dx, dy)
  function shiftVisibleTree(n, dx, dy) {
    n.x += dx; n.y += dy;
    visibleChildren(n).forEach(function(c) { shiftVisibleTree(c, dx, dy); });
  }

  function renderSvg() {
    if (!container || !arvore) return;
    // Largura da célula = maior card necessário (nome/cargo completos), uniforme p/ não sobrepor
    var _needW = AVATAR_SIZE;
    (function scan(n) {
      _needW = Math.max(_needW, nodeContentW(n.nome, n.cargo));
      visibleChildren(n).forEach(scan);
    })(arvore);
    peerNos.forEach(function(p) { _needW = Math.max(_needW, nodeContentW(p.nome, p.cargo)); });
    NODE_W = Math.min(300, _needW);
    calcWidth(arvore);
    calcSubHeight(arvore);
    position(arvore, 30 + NODE_W + PEER_GAP, 30);

    var _pL = peerNos[0] || null;
    var _pR = peerNos[1] || null;
    var socL = _pL ? { x: arvore.x - NODE_W - PEER_GAP, y: arvore.y + PEER_DY, id: _pL.id, nome: _pL.nome, cargo: _pL.cargo, nivel: 'diretoria', iniciais: _pL.iniciais, foto: _pL.foto } : null;
    var socR = _pR ? { x: arvore.x + NODE_W + PEER_GAP, y: arvore.y + PEER_DY, id: _pR.id, nome: _pR.nome, cargo: _pR.cargo, nivel: 'diretoria', iniciais: _pR.iniciais, foto: _pR.foto } : null;

    // Garante espaço mínimo entre a base dos sócios e os filhos do CEO
    if (socL || socR) {
      var socBottom = arvore.y + PEER_DY + NODE_H;
      var MIN_GAP = 30;
      function firstGroupY(n) {
        if (!n._groups || n._groups.length === 0) return Infinity;
        var g = n._groups[0];
        return g.type === 'node' ? g.node.y : g.nodes[0].y;
      }
      var childY = firstGroupY(arvore);
      if (childY < socBottom + MIN_GAP) {
        var dy = (socBottom + MIN_GAP) - childY;
        function shiftDown(n) { n.y += dy; if (n.children) n.children.forEach(shiftDown); }
        arvore._groups.forEach(function(g) {
          if (g.type === 'node') shiftDown(g.node);
          else g.nodes.forEach(function(nd) { shiftDown(nd); });
        });
      }
    }

    // ── LAYOUT DO TOPO: gerentes centralizados + coordenadores nas pontas ──
    // Fileira única: Coordenador · Gerentes (Cinthia no centro sob o CEO) · Coordenador.
    // Os coordenadores flanqueiam os gerentes um pequeno degrau abaixo — mesma
    // lógica visual dos sócios em relação ao CEO. Líder/hierarquia permanecem.
    var _rootLayout = null;
    if (arvore._layout === 'horizontal') {
      var vkids = visibleChildren(arvore);
      var gers = vkids.filter(function(n) { return !isSubTierRole(n); });
      var coords = vkids.filter(isSubTierRole);
      if (coords.length && gers.length) {
        var central = gers.filter(isCentralManager);
        if (central.length) {
          var others = gers.filter(function(n) { return !isCentralManager(n); });
          var mid = Math.floor(others.length / 2);
          gers = others.slice(0, mid).concat(central, others.slice(mid));
        }
        // metade dos coordenadores à esquerda, metade à direita (nas pontas)
        var splitAt = Math.floor(coords.length / 2);
        var leftC = coords.slice(0, splitAt);
        var rightC = coords.slice(splitAt);
        var order = leftC.concat(gers).concat(rightC);

        var ceoCx = arvore.x + NODE_W / 2;
        var gy = gers[0].y;   // linha dos gerentes (após ajuste dos sócios)

        function rowWidth(list) {
          var w = 0;
          list.forEach(function(n) { w += (n.subWidth || NODE_W) + H_GAP; });
          return w - H_GAP;
        }
        // centraliza a fileira inteira sob o CEO; coordenadores descem SUBTIER_DY
        var cursor = ceoCx - rowWidth(order) / 2;
        order.forEach(function(n) {
          var sw = n.subWidth || NODE_W;
          var dx = (cursor + sw / 2) - (n.x + NODE_W / 2);
          var rowY = isSubTierRole(n) ? gy + SUBTIER_DY : gy;
          shiftVisibleTree(n, dx, rowY - n.y);
          cursor += sw + H_GAP;
        });
        _rootLayout = { order: order };
      }
    }

    var minX = Infinity, minY = Infinity, maxX = 0, maxY = 0;
    function bounds(n) {
      if (n.x < minX) minX = n.x;
      if (n.y < minY) minY = n.y;
      if (n.x + NODE_W > maxX) maxX = n.x + NODE_W;
      if (n.y + NODE_H > maxY) maxY = n.y + NODE_H;
      visibleChildren(n).forEach(bounds);
    }
    bounds(arvore);
    if (socL) { minX = Math.min(minX, socL.x); minY = Math.min(minY, socL.y); }
    if (socR) { maxX = Math.max(maxX, socR.x + NODE_W); minY = Math.min(minY, socR.y); }
    if (!isFinite(minX)) minX = 0;
    if (!isFinite(minY)) minY = 0;
    // viewBox justinho ao conteúdo com padding igual dos dois lados → centraliza certo
    var PAD = 40;
    var vbX = minX - PAD, vbY = minY - PAD;
    W = (maxX - minX) + PAD * 2;
    H = (maxY - minY) + PAD * 2;

    var parts = [];
    parts.push('<svg xmlns="http://www.w3.org/2000/svg" width="' + W + '" height="' + H + '" viewBox="' + vbX + ' ' + vbY + ' ' + W + ' ' + H + '">');
    parts.push('<defs>');
    function defsFor(n) {
      if (n.foto) parts.push('<clipPath id="clip_' + n.id + '"><circle cx="0" cy="0" r="' + (AVATAR_SIZE/2) + '"/></clipPath>');
      if (n.children) n.children.forEach(defsFor);
    }
    defsFor(arvore);
    if (socL && socL.foto) parts.push('<clipPath id="clip_' + socL.id + '"><circle cx="0" cy="0" r="' + (AVATAR_SIZE/2) + '"/></clipPath>');
    if (socR && socR.foto) parts.push('<clipPath id="clip_' + socR.id + '"><circle cx="0" cy="0" r="' + (AVATAR_SIZE/2) + '"/></clipPath>');
    parts.push('</defs>');

    parts.push('<g class="connectors" stroke="rgba(53,56,63,0.15)" stroke-width="1.2" fill="none">');
    function drawConn(n) {
      if (!n._groups || n._groups.length === 0) return;
      var x1 = n.x + NODE_W / 2, y1 = n.y + NODE_H;
      // Raiz (CEO): T invertido grosso (stem + trilho) + curvas bezier dos filhos saindo do centro do trilho
      if (n === arvore && n._layout !== 'vertical') {
        // Fileira única (gerentes + coordenadores nas pontas): trilho + bezier p/ cada
        if (_rootLayout) {
          var socioBottomR = socL ? (socL.y + NODE_H) : (socR ? (socR.y + NODE_H) : (y1 + 40));
          var railYR = socioBottomR + 10;
          var tgts = _rootLayout.order.map(function(nd) { return { x: nd.x + NODE_W / 2, y: nd.y, node: nd }; });
          var railHalfR = NODE_W;
          tgts.forEach(function(t) { railHalfR = Math.max(railHalfR, Math.abs(t.x - x1)); });
          parts.push('<path d="M ' + x1 + ' ' + y1 + ' L ' + x1 + ' ' + railYR + '" stroke="#35383F" stroke-width="1.8"/>');
          parts.push('<path d="M ' + (x1 - railHalfR) + ' ' + railYR + ' L ' + (x1 + railHalfR) + ' ' + railYR + '" stroke="#35383F" stroke-width="1.8"/>');
          tgts.forEach(function(t) {
            var ctrlY = railYR + (t.y - railYR) * 0.6;
            parts.push('<path d="M ' + x1 + ' ' + railYR + ' C ' + x1 + ' ' + ctrlY + ', ' + t.x + ' ' + ctrlY + ', ' + t.x + ' ' + t.y + '"/>');
            drawConn(t.node);
          });
          return;
        }
        var targets = n._groups.map(function(g) {
          var tn = g.type === 'node' ? g.node : g.nodes[0];
          return { x: tn.x + NODE_W / 2, y: tn.y, group: g };
        });
        // Trilho fica 10px abaixo da base dos sócios (Leo/Luiz)
        var socioBottom = socL ? (socL.y + NODE_H) : (socR ? (socR.y + NODE_H) : (y1 + 40));
        var railY = socioBottom + 10;
        // Trilho centrado no CEO, largura próxima a 2x NODE_W (haltere curto)
        var railHalf = NODE_W;
        var railLeft = x1 - railHalf;
        var railRight = x1 + railHalf;
        // T invertido — stem e trilho em carbon escuro com traço mais grosso
        parts.push('<path d="M ' + x1 + ' ' + y1 + ' L ' + x1 + ' ' + railY + '" stroke="#35383F" stroke-width="1.8"/>');
        parts.push('<path d="M ' + railLeft + ' ' + railY + ' L ' + railRight + ' ' + railY + '" stroke="#35383F" stroke-width="1.8"/>');
        // Curvas bezier saindo do centro do trilho até cada filho
        targets.forEach(function(t) {
          var ctrlY = railY + (t.y - railY) * 0.6;
          parts.push('<path d="M ' + x1 + ' ' + railY + ' C ' + x1 + ' ' + ctrlY + ', ' + t.x + ' ' + ctrlY + ', ' + t.x + ' ' + t.y + '"/>');
          if (t.group.type === 'leafGroup' && t.group.nodes.length > 1) {
            var ln = t.group.nodes[t.group.nodes.length - 1];
            parts.push('<path d="M ' + t.x + ' ' + (t.y + NODE_H) + ' L ' + t.x + ' ' + ln.y + '"/>');
          }
          if (t.group.type === 'node') drawConn(t.group.node);
        });
        return;
      }
      if (n._layout === 'vertical') {
        var g = n._groups[0];
        if (g.type === 'node') {
          var x2 = g.node.x + NODE_W / 2, y2 = g.node.y;
          parts.push('<path d="M ' + x1 + ' ' + y1 + ' L ' + x2 + ' ' + y2 + '"/>');
          drawConn(g.node);
        } else {
          var fn = g.nodes[0], ln = g.nodes[g.nodes.length - 1];
          parts.push('<path d="M ' + x1 + ' ' + y1 + ' L ' + (fn.x + NODE_W/2) + ' ' + ln.y + '"/>');
        }
      } else {
        n._groups.forEach(function(g) {
          var fn = g.type === 'node' ? g.node : g.nodes[0];
          var x2 = fn.x + NODE_W / 2, y2 = fn.y;
          var midY = y1 + (y2 - y1) / 2;
          parts.push('<path d="M ' + x1 + ' ' + y1 + ' C ' + x1 + ' ' + midY + ', ' + x2 + ' ' + midY + ', ' + x2 + ' ' + y2 + '"/>');
          if (g.type === 'leafGroup' && g.nodes.length > 1) {
            var ln = g.nodes[g.nodes.length - 1];
            parts.push('<path d="M ' + x2 + ' ' + (y2 + NODE_H) + ' L ' + x2 + ' ' + ln.y + '"/>');
          }
          if (g.type === 'node') drawConn(g.node);
        });
      }
    }
    drawConn(arvore);
    parts.push('</g>');

    parts.push('<g class="nodes">');
    function drawNode(n) {
      var dispName = String(n.nome || '');
      var dispRole = String(n.cargo || '');

      var cx = n.x + NODE_W / 2;
      var avatarR = AVATAR_SIZE / 2;
      var avatarCy = n.y + avatarR + 1;

      parts.push('<g class="org-node" data-id="' + escapeHtml(n.id) + '">');
      // Área clicável invisível (cobre todo o card)
      parts.push('<rect x="' + n.x + '" y="' + n.y + '" width="' + NODE_W + '" height="' + NODE_H + '" fill="transparent" style="cursor:pointer"/>');

      // Foto centralizada no topo (fora das pílulas)
      if (n.foto) {
        parts.push('<circle cx="' + cx + '" cy="' + avatarCy + '" r="' + avatarR + '" fill="#CFFF00" stroke="#35383F" stroke-width="2.5" pointer-events="none"/>');
        parts.push('<g transform="translate(' + cx + ',' + avatarCy + ')" pointer-events="none">' +
          '<image x="' + (-avatarR) + '" y="' + (-avatarR) +
          '" width="' + AVATAR_SIZE + '" height="' + AVATAR_SIZE +
          '" href="' + escapeHtml(n.foto) + '" clip-path="url(#clip_' + n.id + ')" preserveAspectRatio="xMidYMid slice"/></g>');
      } else {
        parts.push('<circle cx="' + cx + '" cy="' + avatarCy + '" r="' + avatarR + '" fill="#CFFF00" stroke="#35383F" stroke-width="2.5" pointer-events="none"/>');
        parts.push('<text x="' + cx + '" y="' + (avatarCy + 7) +
          '" text-anchor="middle" font-family="DM Sans, sans-serif" font-size="21" font-weight="700" fill="#35383F" pointer-events="none">' +
          escapeHtml(n.iniciais || '?') + '</text>');
      }

      // Pílula do nome (escura) + pílula do cargo (cítrica), centralizadas e coladas
      var pillTop = avatarCy + avatarR + 6;
      var nameW = pillNameW(dispName);
      var nameH = 19;
      parts.push(
        '<g pointer-events="none">' +
        '<rect x="' + (cx - nameW / 2) + '" y="' + pillTop + '" width="' + nameW + '" height="' + nameH + '" rx="9.5" fill="#35383F"/>' +

  function applyZoom() {
    if (!container) return;

    container.style.height = (H * zoom) + 'px';

  var ZOOM_MIN = 0.25, ZOOM_MAX = 3;

  // Zoom mantendo fixo o ponto sob o cursor/centro da pinça
  function zoomAtPoint(newZoom, px, py) {
    if (!canvas) { zoom = Math.max(ZOOM_MIN, Math.min(ZOOM_MAX, newZoom)); applyZoom(); return; }
    newZoom = Math.max(ZOOM_MIN, Math.min(ZOOM_MAX, newZoom));
    var contentX = (canvas.scrollLeft + px) / zoom;
    var contentY = (canvas.scrollTop + py) / zoom;
    zoom = newZoom;
    applyZoom();
    canvas.scrollLeft = contentX * zoom - px;
    canvas.scrollTop = contentY * zoom - py;
  }

  if (canvas) {
    var dragging = false, sx = 0, sy = 0, sl = 0, st = 0;
    canvas.addEventListener('mousedown', function(e) {
      if (e.target.closest('.org-node') || e.target.closest('.toggle-btn')) return;
      dragging = true; sx = e.pageX; sy = e.pageY; sl = canvas.scrollLeft; st = canvas.scrollTop;
    });
    document.addEventListener('mouseup', function() { dragging = false; });
    document.addEventListener('mousemove', function(e) {
      if (!dragging) return;
      canvas.scrollLeft = sl - (e.pageX - sx);
      canvas.scrollTop = st - (e.pageY - sy);
    });

    // Pinça de trackpad / Ctrl+scroll (desktop) — zoom sem afetar o navegador
    canvas.addEventListener('wheel', function(e) {
      if (!e.ctrlKey) return;   // scroll normal continua rolando o canvas
      e.preventDefault();
      var rect = canvas.getBoundingClientRect();
      zoomAtPoint(zoom * Math.exp(-e.deltaY * 0.01), e.clientX - rect.left, e.clientY - rect.top);
    }, { passive: false });

    // Toque: 1 dedo = arrastar (pan) · 2 dedos = pinça (zoom)
    var tMode = null, tDist0 = 0, tZoom0 = 1, tsx = 0, tsy = 0, tsl = 0, tst = 0;
    function touchDist(a, b) { return Math.hypot(b.clientX - a.clientX, b.clientY - a.clientY); }

    canvas.addEventListener('touchstart', function(e) {
      if (e.touches.length >= 2) {
        tMode = 'pinch';
        tDist0 = touchDist(e.touches[0], e.touches[1]);
        tZoom0 = zoom;
      } else if (e.touches.length === 1) {
        tMode = 'pan';
        tsx = e.touches[0].clientX; tsy = e.touches[0].clientY;
        tsl = canvas.scrollLeft; tst = canvas.scrollTop;
      }
    }, { passive: false });

    canvas.addEventListener('touchmove', function(e) {
      if (tMode === 'pinch' && e.touches.length >= 2) {
        e.preventDefault();
        if (tDist0 <= 0) return;
        var rect = canvas.getBoundingClientRect();
        var mx = (e.touches[0].clientX + e.touches[1].clientX) / 2 - rect.left;
        var my = (e.touches[0].clientY + e.touches[1].clientY) / 2 - rect.top;
        zoomAtPoint(tZoom0 * (touchDist(e.touches[0], e.touches[1]) / tDist0), mx, my);
      } else if (tMode === 'pan' && e.touches.length === 1) {
        e.preventDefault();
        canvas.scrollLeft = tsl - (e.touches[0].clientX - tsx);
        canvas.scrollTop = tst - (e.touches[0].clientY - tsy);
      }
    }, { passive: false });

    canvas.addEventListener('touchend', function(e) {
      if (e.touches.length === 0) {
        tMode = null;
      } else if (e.touches.length === 1) {
        // saiu da pinça para 1 dedo → volta a arrastar
        tMode = 'pan';
        tsx = e.touches[0].clientX; tsy = e.touches[0].clientY;
        tsl = canvas.scrollLeft; tst = canvas.scrollTop;
      }
    });
  }

  function clearExpandedFlags(n) { n._expanded = false; if (n.children) n.children.forEach(clearExpandedFlags); }
  window.expandAll = function() { _initialView = false; clearExpandedFlags(arvore); setCollapsed(arvore, false, false); renderSvg(); };
  window.collapseOps = function() { _initialView = false; clearExpandedFlags(arvore); setCollapsed(arvore, false, false); setCollapsed(arvore, true, true); renderSvg(); };
  window.collapseAllLevels = function() { _initialView = false; clearExpandedFlags(arvore); setCollapsed(arvore, true, false); arvore.collapsed = false; renderSvg(); };
  window.zoomChange = function(delta) {
    zoomAtPoint(zoom + delta, canvas ? canvas.clientWidth / 2 : 0, canvas ? canvas.clientHeight / 2 : 0);
  };
  window.toggleToolbar = function() {
    var tb = document.getElementById('toolbar');
    if (tb) tb.classList.toggle('collapsed');
  };
  window.zoomReset = function() { zoom = 1; applyZoom(); };
  window.fitScreen = function() {
    if (!canvas) return;
    var vw = canvas.clientWidth - 20;
    var fit = Math.min(1, vw / W);
    // Abre com 3× o zoom que caberia (dobro + 50%), mantendo centralizado
    zoom = Math.min(ZOOM_MAX, fit * 3);
    applyZoom();
    // centraliza horizontal e verticalmente
    var contentW = W * zoom, contentH = H * zoom;
    var cw = canvas.clientWidth, ch = canvas.clientHeight;
    canvas.scrollLeft = Math.max(0, (contentW - cw) / 2);
    if (container) {
      // cabe na vertical → centraliza com margem; não cabe → rola para o meio
      container.style.marginTop = contentH < ch ? Math.round((ch - contentH) / 2) + 'px' : '0px';
    }
    canvas.scrollTop = contentH > ch ? (contentH - ch) / 2 : 0;
    if (window.scrollTo) window.scrollTo(0, 0);
  };

  function renderTreeNode(n, isRoot) {
    var typeClass = '';
    if (n.nivel === 'diretoria' && isRoot) typeClass = 'is-root';
    else if (n.nivel === 'diretoria') typeClass = 'is-diretoria';
    else if (n.nivel === 'gerencia') typeClass = 'is-gerencia';
    else if (n.nivel === 'supervisor') typeClass = 'is-supervisor';

    var unitClass = n.unitClass ? 'unit-' + n.unitClass : '';
    var fkids = filteredChildren(n);
    var hasChildren = fkids.length > 0;
    var toggleSymbol = n.collapsed ? '+' : (hasChildren ? '−' : '');
    var toggleClass = hasChildren ? '' : 'empty';
    var descCount = descendantCount(n);

    var avatarHtml = n.foto
      ? '<div class="tree-avatar"><img src="' + escapeHtml(n.foto) + '" onerror="this.parentNode.innerHTML=\'' + escapeHtml(n.iniciais || '?') + '\'"/></div>'
      : '<div class="tree-avatar">' + escapeHtml(n.iniciais || '?') + '</div>';

    var html = '<div class="tree-item ' + (isRoot ? 'root' : '') + ' ' + (n.collapsed ? 'collapsed' : '') + '" data-id="' + escapeHtml(n.id) + '">';
    html += '<div class="tree-row ' + typeClass + ' ' + unitClass + (hasChildren ? ' has-children' : '') + '" data-id="' + escapeHtml(n.id) + '">';
    html += '<div class="tree-toggle ' + toggleClass + '" data-toggle="' + escapeHtml(n.id) + '">' + toggleSymbol + '</div>';

    if (hasChildren) {
      treePill = n.unitClass ? (treeUnitLabels[n.unitClass] || n.unitClass) : 'Adm';
    } else {
      treePill = (n.departamento || '').trim() || (n.unitClass ? (treeUnitLabels[n.unitClass] || n.unitClass) : 'Adm');
    }
    html += '<div class="tree-info"><div class="tree-name">' + escapeHtml(abreviarNome(n.nome)) + '</div><div class="tree-role">' + escapeHtml(n.cargo) + '</div></div>';
    html += '<span class="tree-pill">' + escapeHtml(treePill) + '</span>';
    html += '</div>';
    if (hasChildren) {
      html += '<div class="tree-children">';
      fkids.forEach(function(c) { html += renderTreeNode(c, false); });
      html += '</div>';
    }
    html += '</div>';
    return html;
  }

  }

  // Avisos (~3s cada). O de girar aparece POR CIMA do carregamento (translúcido,
  // com o loading rodando por trás). O da pinça fica centralizado (fundo 60%) e
  // fecha ao clicar em qualquer ponto (ou sozinho após 3s).
  // Avisos num card central: gira → pinça → escolher unidade, cada um com ícone
  // animado ("uma movimentadinha"). Abre/fecha entre os passos e repete a cada 45s.
  var HINT_REPEAT_MS = 90000;
  var _hintRunning = false;
  var ICON_ROTATE = '<svg viewBox="0 0 24 24"><rect x="5" y="2" width="14" height="20" rx="2.5"/><line x1="10" y1="18.5" x2="14" y2="18.5"/></svg>';
  var ICON_PINCH  = '<svg viewBox="0 0 24 24"><path d="M15 3h6v6"/><path d="M9 21H3v-6"/><path d="M21 3l-8 8"/><path d="M3 21l8-8"/></svg>';
  var ICON_UNIT   = '<svg viewBox="0 0 24 24"><line x1="4" y1="7" x2="20" y2="7"/><line x1="4" y1="12" x2="20" y2="12"/><line x1="4" y1="17" x2="20" y2="17"/><circle cx="9" cy="7" r="2.2"/><circle cx="15" cy="12" r="2.2"/><circle cx="9" cy="17" r="2.2"/></svg>';
  var ICON_MOVE   = '<svg viewBox="0 0 24 24"><polyline points="5 9 2 12 5 15"/><polyline points="9 5 12 2 15 5"/><polyline points="9 19 12 22 15 19"/><polyline points="19 9 22 12 19 15"/><line x1="2" y1="12" x2="22" y2="12"/><line x1="12" y1="2" x2="12" y2="22"/></svg>';

  function playHints() {
    var card = document.getElementById('hintCard');
    var ico = document.getElementById('hintIco');
    var txt = document.getElementById('hintTxt');
    var toggle = document.querySelector('.toolbar-toggle');
    if (!card || _hintRunning) return;
    var isTouch = ('ontouchstart' in window) || (navigator.maxTouchPoints > 0);
    var isPortraitPhone = window.matchMedia && window.matchMedia('(max-width: 820px) and (orientation: portrait)').matches;
    var steps = [];
    if (isPortraitPhone) steps.push({ cls: 'rotate', icon: ICON_ROTATE, text: 'Gire o celular para ver melhor', ms: 6000 });
    if (isTouch)         steps.push({ cls: 'pinch',  icon: ICON_PINCH,  text: 'Use dois dedos para dar zoom', ms: 6000 });
    steps.push({ cls: 'move', icon: ICON_MOVE, text: 'Arraste para os lados, cima e baixo', ms: 6000 });
    steps.push({ cls: 'unit', icon: ICON_UNIT, text: 'Toque aqui para trocar de unidade', ms: 6000 });
    if (!steps.length) return;
    // A setinha acompanha: vai p/ a esquerda (aponta ‹) ao abrir; volta p/ a direita (aponta ›) ao recolher
    function shiftToggle(on) {
      if (!toggle) return;
      if (on) {
        var w = card.getBoundingClientRect().width;   // largura total da pílula
        toggle.style.transform = 'translateX(-' + Math.max(0, Math.round(w - 42)) + 'px)';
        toggle.classList.remove('arrow-right');       // vai p/ esquerda → aponta ‹
      } else {
        toggle.style.transform = '';
        toggle.classList.add('arrow-right');          // volta p/ direita → aponta ›
      }
    }
    _hintRunning = true;
    var i = 0;
    function next() {
      if (i >= steps.length) {
        card.classList.remove('show');
        if (toggle) { toggle.style.transform = ''; toggle.classList.remove('arrow-right'); }  // repouso: ‹
        _hintRunning = false;
        return;
      }
      var s = steps[i++];
      ico.className = 'hint-ico ' + s.cls;
      ico.innerHTML = s.icon;
      txt.textContent = s.text;
      card.classList.add('show');
      shiftToggle(true);                 // abre: pílula + setinha vão p/ a esquerda
      setTimeout(function() {
        card.classList.remove('show');   // fecha (suave)
        shiftToggle(false);              // ...e a setinha recolhe junto
        setTimeout(next, 720);           // espera o recolhimento terminar antes de abrir o próximo
      }, s.ms);
    }
    next();
  }
  var _hintsInit = false;
  function showHints() {
    if (_hintsInit) return;
    _hintsInit = true;
    playHints();
    setInterval(playHints, HINT_REPEAT_MS);   // repete o movimento periodicamente
  }

  carregarDados();
  carregarCES();
  carregarArmarios();
  carregarExames();

})();
</script>
</body>
</html>
