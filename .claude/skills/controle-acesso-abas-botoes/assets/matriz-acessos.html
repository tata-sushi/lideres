<title>Acessos do Portal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700;800&family=DM+Mono:wght@400;500&display=swap">
<style>
/* Layout: barra fixa no topo · lista de páginas à esquerda (celular: seletor) · colunas Página/Abas/Botões/Valor lado a lado (celular: empilhadas) */
:root {
  --bg: #F4F4F4; --surface: #FFFFFF; --surface-2: #F7F7F5; --line: #E2E2E2;
  --text: #16171A; --mid: #4E5157; --muted: #8A8C91;
  --ink: #35383F; --ink-fg: #CFFF00; --accent: #CFFF00;
  --add-bg: #EAF4ED; --add-fg: #1A5C2A; --del-bg: #FDEAEA; --del-fg: #7A1A1A;
  --aba-bg: #E8F0FA; --aba-fg: #1A3A5C; --val-bg: #FFF4DC; --val-fg: #7A4A00;
  --focus: #1A3A5C;
  --sans: 'DM Sans', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --mono: 'DM Mono', ui-monospace, 'SFMono-Regular', Menlo, monospace;
  --r: 8px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #141518; --surface: #1D1F23; --surface-2: #24262B; --line: #33363C;
  --text: #ECEDEF; --mid: #B4B7BD; --muted: #858890;
  --ink: #CFFF00; --ink-fg: #16171A; --accent: #CFFF00;
  --add-bg: #17331F; --add-fg: #9FE0B0; --del-bg: #3A1A1C; --del-fg: #F2A7A7;
  --aba-bg: #1A2A3D; --aba-fg: #A9C8EE; --val-bg: #3A2C10; --val-fg: #F1CE85;
  --focus: #A9C8EE; color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #141518; --surface: #1D1F23; --surface-2: #24262B; --line: #33363C;
  --text: #ECEDEF; --mid: #B4B7BD; --muted: #858890;
  --ink: #CFFF00; --ink-fg: #16171A; --accent: #CFFF00;
  --add-bg: #17331F; --add-fg: #9FE0B0; --del-bg: #3A1A1C; --del-fg: #F2A7A7;
  --aba-bg: #1A2A3D; --aba-fg: #A9C8EE; --val-bg: #3A2C10; --val-fg: #F1CE85;
  --focus: #A9C8EE; color-scheme: dark; }

* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--text); font-family: var(--sans); font-size: 14px; line-height: 1.4; }
button { font: inherit; color: inherit; }
button:focus-visible, input:focus-visible, select:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
.mono { font-family: var(--mono); }

.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--surface); border-bottom: 1px solid var(--line);
  padding: 10px 16px; display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.top h1 { margin: 0; font-size: 17px; font-weight: 800; letter-spacing: -0.2px; text-wrap: balance; }
.top .sub { font-family: var(--mono); font-size: 10.5px; color: var(--muted); letter-spacing: .4px; }
.top .titulo { flex: 1; min-width: 180px; }
.vis { display: flex; gap: 6px; flex-wrap: wrap; }
.vb { border: 1px solid var(--line); background: var(--surface); border-radius: 100px; padding: 8px 14px; font-size: 12.5px; font-weight: 500; cursor: pointer; }
.vb[aria-selected="true"] { background: var(--ink); color: var(--ink-fg); border-color: var(--ink); }
.vb .n { display: inline-block; min-width: 18px; margin-left: 6px; padding: 0 6px; border-radius: 100px; background: var(--accent); color: #16171A; font-weight: 800; font-size: 11px; text-align: center; }
.vb .n[data-zero] { display: none; }

.aviso { margin: 12px 16px 0; padding: 10px 12px; border-radius: var(--r); background: var(--val-bg); color: var(--val-fg); font-size: 12.5px; }
.aviso[hidden] { display: none; }

/* ---------- Por página ---------- */
.porpag { display: grid; grid-template-columns: 1fr; gap: 0; }
.lado { display: none; }
.selwrap { padding: 12px 16px 0; display: flex; flex-direction: column; gap: 8px; }
.campo { width: 100%; font: inherit; font-size: 14px; padding: 10px 12px; border: 1px solid var(--line); border-radius: var(--r); background: var(--surface); color: var(--text); }
.rot { font-family: var(--mono); font-size: 10px; letter-spacing: .8px; text-transform: uppercase; color: var(--muted); }
.pag { padding: 14px 16px 120px; min-width: 0; }
.pag-h { display: flex; flex-direction: column; gap: 4px; margin-bottom: 12px; }
.pag-h h2 { margin: 0; font-size: 20px; font-weight: 800; letter-spacing: -0.3px; }
.pag-h .arq { font-family: var(--mono); font-size: 11px; color: var(--muted); word-break: break-all; }
.pag-h .adm { font-size: 12px; color: var(--mid); }
.nav-pag { display: flex; gap: 8px; margin-top: 6px; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-height: 36px; padding: 0 14px; border-radius: var(--r);
  border: 1px solid var(--line); background: var(--surface); font-size: 12.5px; font-weight: 500; cursor: pointer; }
.btn:hover { border-color: var(--mid); }
.btn--ink { background: var(--ink); color: var(--ink-fg); border-color: var(--ink); }
.btn--perigo { color: var(--del-fg); }

.cols { display: flex; flex-direction: column; gap: 12px; }
.col { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 12px; display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.col-h { display: flex; flex-direction: column; gap: 4px; }
.col-h .nome { font-size: 14px; font-weight: 700; }
.col-h .slug { font-family: var(--mono); font-size: 10.5px; color: var(--muted); word-break: break-all; }
.col-h .nota { font-size: 11.5px; color: var(--mid); }
.tag { align-self: flex-start; font-size: 10px; font-weight: 500; letter-spacing: .3px; padding: 3px 9px; border-radius: 100px; text-transform: uppercase; }
.tag.pagina { background: var(--ink); color: var(--ink-fg); }
.tag.aba { background: var(--aba-bg); color: var(--aba-fg); }
.tag.botao { background: var(--surface-2); color: var(--text); border: 1px solid var(--line); }
.tag.menu { background: var(--surface-2); color: var(--text); border: 1px dashed var(--mid); }
.tag.valor { background: var(--val-bg); color: var(--val-fg); }
.regra { font-size: 11px; color: var(--muted); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { display: inline-flex; align-items: center; gap: 6px; min-height: 32px; padding: 0 10px; border-radius: 100px; border: 1px solid var(--line);
  background: var(--surface-2); font-size: 12.5px; cursor: pointer; max-width: 100%; }
.chip .x { font-size: 13px; line-height: 1; color: var(--muted); }
.chip:hover .x { color: var(--text); }
.chip.add { background: var(--add-bg); color: var(--add-fg); border-color: transparent; font-weight: 500; }
.chip.add .x, .chip.del .x { color: inherit; }
.chip.del { background: var(--del-bg); color: var(--del-fg); border-color: transparent; text-decoration: line-through; }
.chip.off { opacity: .45; text-decoration: line-through; cursor: default; }
.chip.fixo { cursor: default; border-style: dashed; }
.chip.fixo .x { font-size: 10px; text-transform: uppercase; letter-spacing: .3px; }
.chip.foco { outline: 2px solid var(--focus); outline-offset: 1px; }
.vazio { font-size: 12px; color: var(--muted); }
.incluir { align-self: flex-start; }

/* ---------- Grade páginas × pessoas ---------- */
.grade-wrap { padding: 14px 16px 120px; }
.grade-scroll { overflow: auto; max-height: calc(100vh - 170px); border: 1px solid var(--line); border-radius: var(--r); background: var(--surface); }
table.grade { border-collapse: separate; border-spacing: 0; font-size: 12px; }
.grade th, .grade td { border-bottom: 1px solid var(--line); padding: 0; }
.grade thead th { position: sticky; top: 0; background: var(--surface); z-index: 2; vertical-align: bottom; }
.grade thead th.pessoa { height: 128px; width: 34px; }
.grade thead th.pessoa span { writing-mode: vertical-rl; transform: rotate(180deg); white-space: nowrap; font-weight: 500; padding: 8px 0; display: inline-block; }
.grade th.pg { position: sticky; left: 0; z-index: 1; background: var(--surface); text-align: left; font-weight: 500; padding: 6px 10px; min-width: 190px; max-width: 240px; border-right: 1px solid var(--line); }
.grade thead th.pg { z-index: 3; font-family: var(--mono); font-size: 10px; letter-spacing: .8px; text-transform: uppercase; color: var(--muted); }
.grade tr.sec th { position: sticky; left: 0; background: var(--surface-2); text-align: left; padding: 8px 10px; font-family: var(--mono); font-size: 10px; letter-spacing: .8px; text-transform: uppercase; color: var(--mid); }
.grade td.c { text-align: center; }
.cel { width: 34px; height: 30px; border: 0; background: none; cursor: pointer; font-size: 13px; color: var(--muted); }
.cel.tem::before { content: '●'; color: var(--text); }
.cel.add::before { content: '+'; color: var(--add-fg); font-weight: 800; }
.cel.add { background: var(--add-bg); }
.cel.del::before { content: '×'; color: var(--del-fg); font-weight: 800; }
.cel.del { background: var(--del-bg); }
.cel:hover { background: var(--surface-2); }
.grade tr:hover th.pg { background: var(--surface-2); }

/* ---------- Mudanças ---------- */
.mud { padding: 14px 16px 120px; max-width: 900px; }
.mud-h { display: flex; flex-direction: column; gap: 8px; margin-bottom: 14px; }
.mud-h p { margin: 0; color: var(--mid); max-width: 62ch; }
.mud-acoes { display: flex; gap: 8px; flex-wrap: wrap; }
.grupo { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); margin-bottom: 12px; overflow: hidden; }
.grupo h3 { margin: 0; padding: 10px 12px; font-size: 13.5px; font-weight: 700; border-bottom: 1px solid var(--line); display: flex; justify-content: space-between; gap: 8px; }
.linha { display: grid; grid-template-columns: auto 1fr auto; gap: 10px; align-items: center; padding: 8px 12px; border-bottom: 1px solid var(--line); }
.linha:last-child { border-bottom: 0; }
.acao { font-size: 10px; font-weight: 500; padding: 3px 9px; border-radius: 100px; text-transform: uppercase; letter-spacing: .3px; }
.acao.incluir { background: var(--add-bg); color: var(--add-fg); }
.acao.tirar { background: var(--del-bg); color: var(--del-fg); }
.linha .o { min-width: 0; }
.linha .o b { font-weight: 700; }
.linha .o .s { font-size: 11.5px; color: var(--muted); }

/* ---------- Seletor de pessoa (folha) ---------- */
.folha-fundo { position: fixed; inset: 0; background: rgba(0,0,0,.35); z-index: 40; display: flex; align-items: flex-end; justify-content: center; }
.folha-fundo[hidden] { display: none; }
.folha { background: var(--surface); width: 100%; max-width: 480px; max-height: 80vh; border-radius: 14px 14px 0 0; display: flex; flex-direction: column;
  padding: 14px 16px calc(14px + env(safe-area-inset-bottom, 0px)); gap: 10px; }
.folha h4 { margin: 0; font-size: 15px; font-weight: 700; }
.folha .s { font-size: 12px; color: var(--muted); margin-top: -6px; }
.folha ul { list-style: none; margin: 0; padding: 0; overflow: auto; display: flex; flex-direction: column; }
.folha li button { width: 100%; text-align: left; background: none; border: 0; border-bottom: 1px solid var(--line); padding: 10px 4px; cursor: pointer; display: flex; flex-direction: column; gap: 2px; }
.folha li button:hover { background: var(--surface-2); }
.folha li .c { font-size: 11.5px; color: var(--muted); }
.folha li .p { font-size: 11px; color: var(--val-fg); }

.toast { position: fixed; left: 50%; bottom: calc(16px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); z-index: 50;
  background: var(--ink); color: var(--ink-fg); border-radius: 100px; padding: 8px 8px 8px 16px; display: flex; gap: 10px; align-items: center;
  font-size: 12.5px; max-width: calc(100% - 32px); box-shadow: 0 6px 24px rgba(0,0,0,.18); }
.toast[hidden] { display: none; }
.toast button { background: var(--accent); color: #16171A; border: 0; border-radius: 100px; padding: 6px 12px; font-weight: 700; cursor: pointer; }

[hidden] { display: none !important; }

@media (min-width: 720px) {
  .cols { flex-direction: row; overflow-x: auto; align-items: flex-start; padding-bottom: 8px; }
  .col { flex: 0 0 240px; }
  .folha-fundo { align-items: center; }
  .folha { border-radius: 14px; }
}
@media (min-width: 1000px) {
  .porpag { grid-template-columns: 280px minmax(0, 1fr); }
  .lado { display: flex; flex-direction: column; gap: 8px; position: sticky; top: 64px; align-self: start; max-height: calc(100vh - 64px);
    overflow: auto; padding: 14px 0 40px 16px; }
  .selwrap { display: none; }
  .lado .campo { font-size: 13px; padding: 8px 10px; }
  .lado .sec { font-family: var(--mono); font-size: 10px; letter-spacing: .8px; text-transform: uppercase; color: var(--muted); margin: 10px 0 2px; }
  .lado .it { display: flex; justify-content: space-between; gap: 8px; text-align: left; background: none; border: 0; border-radius: 6px; padding: 6px 8px; cursor: pointer; font-size: 13px; }
  .lado .it:hover { background: var(--surface); }
  .lado .it[aria-current="true"] { background: var(--ink); color: var(--ink-fg); }
  .lado .it .q { font-family: var(--mono); font-size: 11px; opacity: .7; }
  .lado .it .pd { background: var(--accent); color: #16171A; border-radius: 100px; font-size: 10px; font-weight: 800; padding: 0 6px; margin-left: 4px; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

<header class="top">
  <div class="titulo">
    <h1>Acessos do Portal</h1>
    <div class="sub" id="gerado">Carregando os acessos…</div>
  </div>
  <div class="vis" role="tablist" aria-label="Visões">
    <button class="vb" role="tab" id="tab-pg" aria-selected="true" data-v="pg">Por página</button>
    <button class="vb" role="tab" id="tab-gr" aria-selected="false" data-v="gr">Páginas × pessoas</button>
    <button class="vb" role="tab" id="tab-md" aria-selected="false" data-v="md">Mudanças<span class="n" id="n-mud" data-zero>0</span></button>
  </div>
</header>
<div class="aviso" id="aviso" hidden></div>

<main>
  <section id="v-pg" class="porpag" aria-labelledby="tab-pg">
    <aside class="lado" id="lado">
      <input class="campo" id="busca-lado" type="search" placeholder="Buscar página…" aria-label="Buscar página">
      <select class="campo" id="foco-lado" aria-label="Destacar pessoa"></select>
      <div id="lista-lado"></div>
    </aside>
    <div class="selwrap">
      <label class="rot" for="sel-pag">Página</label>
      <select class="campo" id="sel-pag"></select>
      <select class="campo" id="foco-cel" aria-label="Destacar pessoa"></select>
    </div>
    <div class="pag" id="pag"><p class="vazio">Carregando…</p></div>
  </section>

  <section id="v-gr" class="grade-wrap" aria-labelledby="tab-gr" hidden>
    <p class="regra" style="margin:0 0 10px">Toque numa célula para dar ou tirar o acesso à página. ● tem acesso · <b>+</b> vai ganhar · <b>×</b> vai perder. Admins veem tudo e não aparecem aqui.</p>
    <div class="grade-scroll"><table class="grade" id="grade"></table></div>
  </section>

  <section id="v-md" class="mud" aria-labelledby="tab-md" hidden>
    <div class="mud-h">
      <p id="mud-txt">Nenhuma mudança ainda. Tudo o que você incluir ou tirar nas outras visões aparece aqui.</p>
      <div class="mud-acoes">
        <button class="btn" id="btn-copiar" type="button">Copiar lista</button>
        <button class="btn btn--perigo" id="btn-limpar" type="button">Desfazer tudo</button>
      </div>
    </div>
    <div id="mud-lista"></div>
  </section>
</main>

<div class="folha-fundo" id="folha" hidden>
  <div class="folha" role="dialog" aria-modal="true" aria-labelledby="folha-t">
    <h4 id="folha-t">Incluir pessoa</h4>
    <div class="s" id="folha-s"></div>
    <input class="campo" id="folha-busca" type="search" placeholder="Buscar pelo nome, cargo ou unidade…" aria-label="Buscar pessoa">
    <ul id="folha-lista"></ul>
    <button class="btn" id="folha-fechar" type="button">Fechar</button>
  </div>
</div>
<div class="toast" id="toast" role="status" hidden><span id="toast-t"></span><button id="toast-b" type="button">Desfazer</button></div>

<script>
(function () {
  'use strict';
  var E = null, PES = {}, PAG = {}, ORDEM = [];
  var pend = new Map();          // chave -> {tipo,item,pagina,matricula,acao,em,...}
  var col = null, modo = 'carregando';
  var atual = null, foco = '', vis = 'pg', buscaLado = '';
  var LS = 'acessos-portal-mudancas';

  function $(id) { return document.getElementById(id); }
  function el(tag, cls, txt) { var e = document.createElement(tag); if (cls) e.className = cls; if (txt != null) e.textContent = txt; return e; }
  function chave(tipo, item, m) { return tipo + '~' + item + '@' + m; }
  function lsGet() { try { return JSON.parse(localStorage.getItem(LS) || '{}'); } catch (e) { return {}; } }
  function lsSet(o) { try { localStorage.setItem(LS, JSON.stringify(o)); } catch (e) {} }
  function guardar(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
  function ler(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }

  // ---------- estado efetivo (banco + mudanças) ----------
  function base(tipo, pg, it, m) {
    if (tipo === 'pagina') return pg.acessoSet.has(m);
    if (tipo === 'aba') return !it.bloqSet.has(m);
    return it.libSet.has(m);                       // botão e valor
  }
  function ef(tipo, pg, it, m) {
    var d = pend.get(chave(tipo, tipo === 'pagina' ? pg.id : it.id, m));
    return d ? d.acao === 'incluir' : base(tipo, pg, it, m);
  }
  function temPag(pg, m) { return ef('pagina', pg, null, m); }
  function veItem(pg, it, m) {
    if (it.tipo === 'valor') return ef('valor', pg, it, m);
    return temPag(pg, m) && ef(it.tipo, pg, it, m);
  }
  function veItemBase(pg, it, m) {
    if (it.tipo === 'valor') return base('valor', pg, it, m);
    return pg.acessoSet.has(m) && base(it.tipo, pg, it, m);
  }
  // Admin vê toda página/aba/botão (menos a seção App), mas NÃO os valores em R$: esses seguem a liberação.
  function genteDa(pg, it) { return E.pessoas.filter(function (p) { return (it && it.tipo === 'valor') || !(pg.adminVeTudo && p.admin); }); }

  // ---------- gravação ----------
  function definir(tipo, pg, it, m, alvo, silencioso) {
    var item = tipo === 'pagina' ? pg.id : it.id;
    var k = chave(tipo, item, m);
    var antes = pend.get(k) || null;
    var b = base(tipo, pg, it, m);
    var depois = null;
    if (alvo !== b) {
      depois = { tipo: tipo, item: item, pagina: pg.id, matricula: m, acao: alvo ? 'incluir' : 'tirar',
                 itemLabel: tipo === 'pagina' ? pg.label : it.label, paginaLabel: pg.label, em: new Date().toISOString() };
    }
    if (!antes && !depois) return null;
    aplicarLocal(k, depois);
    salvar(k, depois, antes);
    if (!silencioso) render();
    return { k: k, antes: antes };
  }
  function aplicarLocal(k, v) { if (v) pend.set(k, v); else pend.delete(k); }
  function salvar(k, v, antes) {
    if (modo === 'db' && col) {
      var ref = col.doc(k);
      (v ? ref.set(v) : ref.delete()).catch(function (e) {
        aplicarLocal(k, antes); render();
        aviso('Não consegui salvar a última mudança (' + (e && e.code || 'erro') + '). Tente de novo.');
      });
    } else {
      var o = lsGet(); if (v) o[k] = v; else delete o[k]; lsSet(o);
    }
  }
  var desfazerUlt = null, toastT = null;
  function toast(txt, desfazer) {
    $('toast-t').textContent = txt; $('toast').hidden = false;
    desfazerUlt = desfazer || null; $('toast-b').hidden = !desfazer;
    clearTimeout(toastT); toastT = setTimeout(function () { $('toast').hidden = true; }, 5000);
  }
  $('toast-b').addEventListener('click', function () {
    if (desfazerUlt) desfazerUlt(); $('toast').hidden = true; render();
  });
  function aviso(txt) { var a = $('aviso'); a.textContent = txt; a.hidden = !txt; }

  // Grava várias mudanças e devolve uma função que desfaz todas.
  function lote(fns) {
    var feitos = [];
    fns.forEach(function (f) { var r = f(); if (r) feitos.push(r); });
    render();
    return function () {
      feitos.reverse().forEach(function (r) { var atualV = pend.get(r.k) || null; aplicarLocal(r.k, r.antes); salvar(r.k, r.antes, atualV); });
    };
  }

  // ---------- ações da interface ----------
  function nomeCurto(m) { return (PES[m] && PES[m].curto) || m; }
  function tocarChip(tipo, pg, it, m) {
    var alvo = !(tipo === 'pagina' ? temPag(pg, m) : ef(tipo, pg, it, m));
    var rot = tipo === 'pagina' ? 'a página' : it.label;
    var und = lote([function () { return definir(tipo, pg, it, m, alvo, true); }]);
    var k = chave(tipo, tipo === 'pagina' ? pg.id : it.id, m);
    var txt = pend.has(k) ? (alvo ? 'Incluir ' : 'Tirar ') + nomeCurto(m) + (alvo ? ' em ' : ' de ') + rot : 'Desfeito: ' + nomeCurto(m) + ' · ' + rot;
    toast(txt, und);
  }
  function incluir(pg, it, m) {
    var fns = [];
    if (!it || it.tipo !== 'valor') {
      if (!temPag(pg, m)) fns.push(function () { return definir('pagina', pg, null, m, true, true); });
    }
    if (it) fns.push(function () { return definir(it.tipo, pg, it, m, true, true); });
    var und = lote(fns);
    toast('Incluir ' + nomeCurto(m) + ' em ' + (it ? it.label : 'a página'), und);
  }

  // ---------- render: por página ----------
  function render() {
    var n = pend.size;
    $('n-mud').textContent = n; if (n) $('n-mud').removeAttribute('data-zero'); else $('n-mud').setAttribute('data-zero', '');
    renderLado();
    if (vis === 'pg') renderPagina();
    if (vis === 'gr') renderGrade();
    if (vis === 'md') renderMud();
  }
  function pendDaPagina(pid) { var c = 0; pend.forEach(function (v) { if (v.pagina === pid) c++; }); return c; }
  function qtdPag(pg) { var c = 0; genteDa(pg).forEach(function (p) { if (temPag(pg, p.m)) c++; }); return c; }

  function renderLado() {
    var lista = $('lista-lado'); lista.textContent = '';
    var q = buscaLado.trim().toLowerCase(), sec = null;
    ORDEM.forEach(function (pg) {
      if (q && (pg.label + ' ' + pg.secao + ' ' + (pg.sub || '') + ' ' + pg.id).toLowerCase().indexOf(q) < 0) return;
      if (foco && !temPag(pg, foco) && pg.adminVeTudo) return;
      var s = pg.secao + (pg.sub ? ' · ' + pg.sub : '');
      if (s !== sec) { sec = s; lista.appendChild(el('div', 'sec', s)); }
      var b = el('button', 'it'); b.type = 'button';
      if (atual === pg) b.setAttribute('aria-current', 'true');
      var nome = el('span', null, pg.label);
      var pd = pendDaPagina(pg.id); if (pd) { var t = el('span', 'pd', String(pd)); nome.appendChild(t); }
      b.appendChild(nome); b.appendChild(el('span', 'q', String(qtdPag(pg))));
      b.addEventListener('click', function () { abrir(pg.id); });
      lista.appendChild(b);
    });
    // seletor do celular
    var sel = $('sel-pag');
    if (!sel.options.length) {
      var grupo = null, g = null;
      ORDEM.forEach(function (pg) {
        var s = pg.secao + (pg.sub ? ' · ' + pg.sub : '');
        if (s !== grupo) { grupo = s; g = document.createElement('optgroup'); g.label = s; sel.appendChild(g); }
        var o = document.createElement('option'); o.value = pg.id; o.textContent = pg.label; g.appendChild(o);
      });
    }
    if (atual) sel.value = atual.id;
  }

  function chipsDe(pg, tipo, it) {
    var wrap = el('div', 'chips'), algum = false;
    genteDa(pg, it).forEach(function (p) {
      var m = p.m, agora, antes, cls;
      if (it && it.tipo === 'valor' && it.geralSet.has(m)) {
        var f = el('button', 'chip fixo' + (foco === m ? ' foco' : '')); f.type = 'button'; f.disabled = true;
        f.appendChild(el('span', null, p.curto)); f.appendChild(el('span', 'x', 'todas'));
        f.title = p.nome + ' — liberado para ver valores de todas as áreas (muda no painel do app)';
        wrap.appendChild(f); algum = true; return;
      }
      if (tipo === 'pagina') { agora = temPag(pg, m); antes = pg.acessoSet.has(m); }
      else { agora = veItem(pg, it, m); antes = veItemBase(pg, it, m); }
      if (!agora && !antes) return;
      algum = true;
      var semPag = tipo !== 'pagina' && it.tipo !== 'valor' && !temPag(pg, m);
      if (agora && antes) cls = 'chip';
      else if (agora) cls = 'chip add';
      else cls = semPag ? 'chip off' : 'chip del';
      if (foco === m) cls += ' foco';
      var b = el('button', cls); b.type = 'button';
      b.appendChild(el('span', null, p.curto));
      if (semPag && !agora) {
        b.title = p.nome + ' — perde a página, então perde isto também';
        b.disabled = true;
      } else {
        b.appendChild(el('span', 'x', agora ? '×' : '↺'));
        b.title = p.nome + ' · ' + p.cargo + (agora ? ' — tocar para tirar' : ' — tocar para desfazer');
        b.setAttribute('aria-label', (agora ? 'Tirar ' : 'Desfazer ') + p.nome);
        b.addEventListener('click', function () { tocarChip(tipo === 'pagina' ? 'pagina' : it.tipo, pg, it, m); });
      }
      wrap.appendChild(b);
    });
    if (!algum) wrap.appendChild(el('span', 'vazio', tipo === 'pagina' ? (pg.adminVeTudo ? 'Só admins' : 'Ninguém') :
      (it.tipo === 'aba' ? 'Ninguém além dos admins' : 'Só admins')));
    return wrap;
  }

  function coluna(pg, it) {
    var c = el('div', 'col'), h = el('div', 'col-h');
    var tipo = it ? it.tipo : 'pagina';
    var tg = { pagina: 'Página', aba: 'Aba', botao: it && it.menu ? 'Botão · menu lateral' : 'Botão', valor: 'Valores R$' }[tipo];
    h.appendChild(el('span', 'tag ' + (tipo === 'botao' && it.menu ? 'menu' : tipo), tg));
    h.appendChild(el('div', 'nome', it ? it.label : 'Quem abre a página'));
    if (it) h.appendChild(el('div', 'slug', it.slug));
    var regra = { pagina: 'Sem a página, a pessoa não vê nada dela.', aba: 'Todos que abrem a página veem; tirar = bloquear.',
      botao: 'Escondido; aparece só para quem está aqui.', valor: 'Valores em R$ (salários) desta área. Admin não vê automaticamente.' }[tipo];
    h.appendChild(el('div', 'regra', regra));
    if (it && it.so_banco) h.appendChild(el('div', 'nota', 'Controlado pelo servidor (não tem botão próprio na página).'));
    if (it && !it.cadastrado) h.appendChild(el('div', 'nota', 'Ainda sem cadastro no banco: hoje aparece para todos.'));
    c.appendChild(h);
    c.appendChild(chipsDe(pg, tipo, it));
    var add = el('button', 'btn incluir', '+ Incluir'); add.type = 'button';
    add.addEventListener('click', function () { abrirFolha(pg, it); });
    c.appendChild(add);
    return c;
  }

  function renderPagina() {
    var box = $('pag'); box.textContent = '';
    if (!atual) { box.appendChild(el('p', 'vazio', 'Escolha uma página.')); return; }
    var pg = atual, h = el('div', 'pag-h');
    h.appendChild(el('span', 'rot', pg.secao + (pg.sub ? ' · ' + pg.sub : '')));
    h.appendChild(el('h2', null, pg.label));
    h.appendChild(el('div', 'arq', pg.arquivo + (pg.existe ? '' : ' — arquivo não existe mais')));
    var adm = E.pessoas.filter(function (p) { return p.admin; }).map(function (p) { return p.curto; }).join(', ');
    h.appendChild(el('div', 'adm', pg.adminVeTudo ? 'Admins veem tudo nesta página: ' + adm + '.' : 'Seção App: admin também precisa estar na lista.'));
    var nav = el('div', 'nav-pag'), i = ORDEM.indexOf(pg);
    var ant = el('button', 'btn', '← Anterior'), prox = el('button', 'btn', 'Próxima →');
    ant.type = prox.type = 'button'; ant.disabled = i <= 0; prox.disabled = i >= ORDEM.length - 1;
    ant.addEventListener('click', function () { abrir(ORDEM[i - 1].id); });
    prox.addEventListener('click', function () { abrir(ORDEM[i + 1].id); });
    nav.appendChild(ant); nav.appendChild(prox); h.appendChild(nav);
    box.appendChild(h);
    var cols = el('div', 'cols');
    cols.appendChild(coluna(pg, null));
    pg.itens.forEach(function (it) { cols.appendChild(coluna(pg, it)); });
    if (!pg.itens.length) { var v = el('div', 'col'); v.appendChild(el('div', 'vazio', 'Esta página não tem abas nem botões controlados.')); cols.appendChild(v); }
    box.appendChild(cols);
  }

  function abrir(pid) {
    atual = PAG[pid] || ORDEM[0]; guardar('acessos-portal-pagina', atual.id);
    try { history.replaceState(null, '', '#' + atual.id.replace(/[^\w.~-]/g, '')); } catch (e) {}
    render(); window.scrollTo(0, 0);
  }

  // ---------- folha "incluir" ----------
  var folhaCtx = null;
  function abrirFolha(pg, it) {
    folhaCtx = { pg: pg, it: it };
    $('folha-t').textContent = 'Incluir em ' + (it ? it.label : pg.label);
    $('folha-s').textContent = it ? (it.tipo === 'valor' ? 'Vai ver os valores em R$ desta área.' : 'Quem ainda não abre a página ganha a página junto.') : 'Vai poder abrir a página.';
    $('folha-busca').value = ''; listarFolha(); $('folha').hidden = false; $('folha-busca').focus();
  }
  function listarFolha() {
    var ul = $('folha-lista'); ul.textContent = '';
    var q = $('folha-busca').value.trim().toLowerCase(), pg = folhaCtx.pg, it = folhaCtx.it, n = 0;
    genteDa(pg, it).forEach(function (p) {
      var ja = it ? veItem(pg, it, p.m) : temPag(pg, p.m);
      if (it && it.tipo === 'valor' && it.geralSet.has(p.m)) ja = true;
      if (ja) return;
      if (q && (p.nome + ' ' + p.cargo + ' ' + p.unidade).toLowerCase().indexOf(q) < 0) return;
      var li = el('li'), b = el('button'); b.type = 'button';
      b.appendChild(el('span', null, p.nome)); b.appendChild(el('span', 'c', p.cargo + ' · ' + p.unidade));
      if (it && it.tipo !== 'valor' && !temPag(pg, p.m)) b.appendChild(el('span', 'p', 'Também ganha a página'));
      b.addEventListener('click', function () { incluir(pg, it, p.m); listarFolha(); });
      li.appendChild(b); ul.appendChild(li); n++;
    });
    if (!n) ul.appendChild(el('li', 'vazio', q ? 'Ninguém com esse nome.' : 'Todo mundo já está incluído.'));
  }
  $('folha-busca').addEventListener('input', listarFolha);
  $('folha-fechar').addEventListener('click', function () { $('folha').hidden = true; render(); });
  $('folha').addEventListener('click', function (e) { if (e.target === $('folha')) { $('folha').hidden = true; render(); } });
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape' && !$('folha').hidden) { $('folha').hidden = true; render(); } });

  // ---------- grade páginas × pessoas ----------
  function renderGrade() {
    var t = $('grade'); t.textContent = '';
    var gente = E.pessoas.filter(function (p) { return !p.admin; });
    var th = el('thead'), tr = el('tr'), c0 = el('th', 'pg', 'Página'); tr.appendChild(c0);
    gente.forEach(function (p) { var h = el('th', 'pessoa'); var s = el('span', null, p.curto); s.title = p.nome + ' · ' + p.cargo; h.appendChild(s); tr.appendChild(h); });
    th.appendChild(tr); t.appendChild(th);
    var tb = el('tbody'), sec = null;
    ORDEM.forEach(function (pg) {
      var s = pg.secao + (pg.sub ? ' · ' + pg.sub : '');
      if (s !== sec) { sec = s; var r = el('tr', 'sec'), h = el('th', null, s); h.colSpan = gente.length + 1; r.appendChild(h); tb.appendChild(r); }
      var row = el('tr'), nome = el('th', 'pg', pg.label); nome.title = pg.arquivo; row.appendChild(nome);
      gente.forEach(function (p) {
        var td = el('td', 'c'), b = el('button', 'cel'); b.type = 'button';
        var agora = temPag(pg, p.m), antes = pg.acessoSet.has(p.m);
        b.className = 'cel' + (agora && antes ? ' tem' : agora ? ' add' : antes ? ' del' : '');
        b.setAttribute('aria-label', p.nome + ' — ' + pg.label + (agora ? ': tem acesso' : ': sem acesso'));
        b.title = p.curto + ' · ' + pg.label;
        b.addEventListener('click', function () { tocarChip('pagina', pg, null, p.m); });
        td.appendChild(b); row.appendChild(td);
      });
      tb.appendChild(row);
    });
    t.appendChild(tb);
  }

  // ---------- mudanças ----------
  function itemDe(v) { var pg = PAG[v.pagina]; if (!pg) return null; return v.tipo === 'pagina' ? null : pg.itens.filter(function (i) { return i.id === v.item; })[0] || null; }
  function textoMud() {
    var linhas = [];
    pend.forEach(function (v) {
      var p = PES[v.matricula];
      linhas.push((v.acao === 'incluir' ? 'INCLUIR' : 'TIRAR') + ' | ' + (p ? p.nome : v.matricula) + ' (' + v.matricula + ') | ' +
        v.paginaLabel + ' | ' + (v.tipo === 'pagina' ? 'página' : v.tipo) + ' | ' + v.item);
    });
    return linhas.sort().join('\n');
  }
  function renderMud() {
    var box = $('mud-lista'); box.textContent = '';
    var n = pend.size;
    $('mud-txt').textContent = n ? n + (n === 1 ? ' mudança salva' : ' mudanças salvas') +
      (modo === 'db' ? ' aqui na página. Quando terminar, me diga no chat que pode aplicar: eu leio esta lista, aplico no banco e atualizo a tabela.'
                     : ' só neste aparelho. Toque em "Copiar lista" e cole no chat para eu aplicar.')
      : 'Nenhuma mudança ainda. Tudo o que você incluir ou tirar nas outras visões aparece aqui.';
    $('btn-limpar').hidden = !n; $('btn-copiar').hidden = !n;
    var porPag = {};
    pend.forEach(function (v, k) { (porPag[v.pagina] = porPag[v.pagina] || []).push([k, v]); });
    ORDEM.forEach(function (pg) {
      var lst = porPag[pg.id]; if (!lst) return;
      var g = el('div', 'grupo'), h = el('h3'); h.appendChild(el('span', null, pg.label));
      var ir = el('button', 'btn', 'Abrir'); ir.type = 'button'; ir.addEventListener('click', function () { trocarVis('pg'); abrir(pg.id); });
      h.appendChild(ir); g.appendChild(h);
      lst.sort(function (a, b) { return (a[1].itemLabel + nomeCurto(a[1].matricula)).localeCompare(b[1].itemLabel + nomeCurto(b[1].matricula), 'pt'); });
      lst.forEach(function (kv) {
        var v = kv[1], it = itemDe(v), p = PES[v.matricula];
        var l = el('div', 'linha');
        l.appendChild(el('span', 'acao ' + v.acao, v.acao === 'incluir' ? 'Incluir' : 'Tirar'));
        var o = el('div', 'o'), b = el('b', null, p ? p.nome : v.matricula); o.appendChild(b);
        var tipoTxt = v.tipo === 'pagina' ? 'Página' : v.tipo === 'aba' ? (v.acao === 'incluir' ? 'Aba (desbloquear)' : 'Aba (bloquear)') : v.tipo === 'valor' ? 'Valores R$' : 'Botão';
        o.appendChild(el('div', 's', tipoTxt + ' · ' + (v.tipo === 'pagina' ? pg.label : (it ? it.label : v.itemLabel))));
        l.appendChild(o);
        var d = el('button', 'btn', 'Desfazer'); d.type = 'button';
        d.addEventListener('click', function () { var antes = pend.get(kv[0]); aplicarLocal(kv[0], null); salvar(kv[0], null, antes); render(); });
        l.appendChild(d); g.appendChild(l);
      });
      box.appendChild(g);
    });
  }
  $('btn-copiar').addEventListener('click', function () {
    var txt = textoMud();
    var ok = function () { toast('Lista copiada. Cole no chat.'); };
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(txt).then(ok, mostrarTexto); else mostrarTexto();
    function mostrarTexto() {
      var ta = el('textarea', 'campo'); ta.value = txt; ta.rows = 8; ta.readOnly = true;
      $('mud-lista').prepend(ta); ta.focus(); ta.select();
    }
  });
  var limparArmado = false;
  $('btn-limpar').addEventListener('click', function () {
    if (!limparArmado) { limparArmado = true; this.textContent = 'Confirmar: desfazer ' + pend.size; var b = this;
      setTimeout(function () { limparArmado = false; b.textContent = 'Desfazer tudo'; }, 4000); return; }
    limparArmado = false; this.textContent = 'Desfazer tudo';
    Array.from(pend.keys()).forEach(function (k) { var antes = pend.get(k); aplicarLocal(k, null); salvar(k, null, antes); });
    render();
  });

  // ---------- visões ----------
  function trocarVis(v) {
    vis = v;
    ['pg', 'gr', 'md'].forEach(function (x) { $('v-' + x).hidden = x !== v; $('tab-' + x).setAttribute('aria-selected', String(x === v)); });
    guardar('acessos-portal-visao', v); render();
  }
  document.querySelectorAll('.vb').forEach(function (b) { b.addEventListener('click', function () { trocarVis(b.dataset.v); }); });
  $('sel-pag').addEventListener('change', function () { abrir(this.value); });
  $('busca-lado').addEventListener('input', function () { buscaLado = this.value; renderLado(); });
  function preencherFoco(sel) {
    var o = document.createElement('option'); o.value = ''; o.textContent = 'Destacar pessoa: ninguém'; sel.appendChild(o);
    E.pessoas.filter(function (p) { return !p.admin; }).forEach(function (p) { var x = document.createElement('option'); x.value = p.m; x.textContent = p.nome; sel.appendChild(x); });
    sel.addEventListener('change', function () { foco = this.value; $('foco-lado').value = $('foco-cel').value = foco; render(); });
  }

  // ---------- início ----------
  function indexar() {
    E.pessoas.forEach(function (p) { PES[p.m] = p; });
    E.paginas.forEach(function (pg) {
      pg.acessoSet = new Set(pg.acesso);
      pg.itens.forEach(function (it) { it.bloqSet = new Set(it.bloq || []); it.libSet = new Set(it.lib || []); it.geralSet = new Set(it.geral || []); });
      PAG[pg.id] = pg; ORDEM.push(pg);
    });
  }
  function ligarBanco() {
    var c = window.claude;
    if (!c || typeof c.use !== 'function') { modoLocal(); return; }
    c.use('db').then(function (db) {
      if (!db) { modoLocal(); return; }
      col = db.collection('mudancas'); modo = 'db'; aviso('');
      col.onSnapshot(function (snap) {
        var m = new Map(); snap.docs.forEach(function (d) { m.set(d.id, d.data()); }); pend = m; render();
      }, function (e) { modoLocal(); aviso('A conexão com o salvamento caiu (' + (e && e.code || 'erro') + '). As mudanças novas ficam só neste aparelho.'); });
    }, modoLocal);
  }
  function modoLocal() {
    if (modo === 'db') return;
    modo = 'local'; var o = lsGet(); pend = new Map(Object.keys(o).map(function (k) { return [k, o[k]]; }));
    aviso('As mudanças estão ficando só neste aparelho. Quando terminar, abra "Mudanças" e toque em "Copiar lista".'); render();
  }

  fetch('estado.json', { cache: 'no-store' }).then(function (r) { if (!r.ok) throw new Error(r.status); return r.json(); }).then(function (j) {
    E = j; indexar();
    $('gerado').textContent = 'Situação do banco em ' + E.gerado + ' · ' + E.paginas.length + ' páginas · ' + E.pessoas.filter(function (p) { return !p.admin; }).length + ' pessoas + admins';
    preencherFoco($('foco-lado')); preencherFoco($('foco-cel'));
    var h = (location.hash || '').slice(1), salvo = ler('acessos-portal-pagina');
    atual = PAG[h] || PAG[salvo] || ORDEM[0];
    var v = ler('acessos-portal-visao'); if (v === 'gr' || v === 'md') trocarVis(v); else render();
    ligarBanco();
  }).catch(function () {
    $('gerado').textContent = 'Não consegui carregar os acessos. Recarregue a página.';
    $('pag').textContent = '';
  });
})();
</script>
