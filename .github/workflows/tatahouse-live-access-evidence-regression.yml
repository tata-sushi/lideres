name: TATÁ House live access evidence regression

on:
  push:
    branches:
      - 'feat/tatahouse-governanca-phase1'
    paths:
      - '.github/workflows/tatahouse-live-access-evidence-regression.yml'

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Validate permanent evidence and readiness
        shell: bash
        run: |
          set -euo pipefail
          node compliance/kpis/tatahouse/house_governanca_live_access_evidence_v1.test.cjs
          node compliance/kpis/tatahouse/house_governanca_readiness_v1.test.cjs
          git diff --check HEAD^ HEAD
          test ! -e .github/workflows/tatahouse-live-rpc-readonly-proof.yml
          echo 'LIVE_ACCESS_PERMANENT_REGRESSION=PASS'
          echo 'READINESS_FAIL_CLOSED_PRESERVED=PASS'
          echo 'TEMP_LIVE_RPC_PROOF_REMOVED=PASS'
