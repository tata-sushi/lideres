name: TATA House readonly ready wire temporary
on:
  push:
    branches:
      - feat/tatahouse-governanca-phase1
    paths:
      - '.github/workflows/tatahouse-readonly-ready-wire-temp.yml'
permissions:
  contents: write
jobs:
  wire:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/tatahouse-governanca-phase1
          fetch-depth: 0
      - name: Patch planner shell handshake
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('compliance/kpis/tatahouse/planejador-v2.html')
          s=p.read_text()
          s=s.replace('var housePronto=false;','var evidenciaPronta=false;',1)
          s=s.replace('if(!housePronto||!evidenciaAtual||!ro)return false;','if(!evidenciaPronta||!evidenciaAtual||!ro)return false;',1)
          s=s.replace("        if(etapa==='house-pronto'){housePronto=true;enviarEvidenciaSePronto();}\n",'',1)
          anchor="      function mostrarDraft(registro){\n"
          listener="      window.addEventListener('message',function(event){\n        if(!ro||event.origin!==ro.houseOrigin||event.source!==iframe.contentWindow)return;\n        var msg=event.data;\n        if(!msg||msg.type!==ro.readyType||msg.versao!==1)return;\n        evidenciaPronta=true;\n        enviarEvidenciaSePronto();\n      });\n\n"
          assert anchor in s and 'msg.type!==ro.readyType' not in s
          s=s.replace(anchor,listener+anchor,1)
          s=s.replace('          housePronto=false;','          evidenciaPronta=false;',1)
          assert 'housePronto' not in s
          p.write_text(s)
          PY
      - name: Contract and structural checks
        run: |
          node compliance/kpis/tatahouse/house_governanca_readonly_v1.test.cjs
          grep -q "msg.type!==ro.readyType" compliance/kpis/tatahouse/planejador-v2.html
          grep -q "event.origin!==ro.houseOrigin" compliance/kpis/tatahouse/planejador-v2.html
          grep -q "event.source!==iframe.contentWindow" compliance/kpis/tatahouse/planejador-v2.html
          ! grep -q "housePronto" compliance/kpis/tatahouse/planejador-v2.html
          ! grep -E '\.(insert|update|delete|upsert)\(' compliance/kpis/tatahouse/house_governanca_readonly_v1.js
          git diff --check
      - name: Commit and push shell wiring
        run: |
          git config user.name 'cesarspichencoff-cmyk'
          git config user.email 'cesar.spichencoff@gmail.com'
          git add compliance/kpis/tatahouse/planejador-v2.html
          git commit -m 'fix(tatahouse): send readonly evidence after receiver ready'
          git fetch origin feat/tatahouse-governanca-phase1
          git rebase origin/feat/tatahouse-governanca-phase1
          node compliance/kpis/tatahouse/house_governanca_readonly_v1.test.cjs
          git push origin HEAD:feat/tatahouse-governanca-phase1
      - name: Remove temporary workflow
        if: always()
        run: |
          git rebase --abort 2>/dev/null || true
          git fetch origin feat/tatahouse-governanca-phase1
          git reset --hard origin/feat/tatahouse-governanca-phase1
          if [ -f .github/workflows/tatahouse-readonly-ready-wire-temp.yml ]; then
            git config user.name 'cesarspichencoff-cmyk'
            git config user.email 'cesar.spichencoff@gmail.com'
            git rm .github/workflows/tatahouse-readonly-ready-wire-temp.yml
            git commit -m 'test(tatahouse): remove readonly ready wire harness'
            git push origin HEAD:feat/tatahouse-governanca-phase1
          fi
