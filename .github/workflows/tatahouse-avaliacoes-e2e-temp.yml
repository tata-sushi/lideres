name: TATA House Governance evaluations E2E temporary

on:
  push:
    branches:
      - feat/tatahouse-governanca-phase1

permissions:
  contents: write

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/tatahouse-governanca-phase1
      - uses: actions/checkout@v4
        with:
          repository: cesarspichencoff-cmyk/tata-house.github.io
          ref: feat/house-governanca-phase1
          path: house
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Syntax Governance receiver
        run: node --check compliance/kpis/tatahouse/house_governanca_avaliacoes_local_v1.js
      - name: Contract wiring Governance receiver
        run: |
          grep -q "house_governanca_avaliacoes_local_v1.js" compliance/kpis/tatahouse/integracao-local.html
          grep -q "ACK individual por ID" compliance/kpis/tatahouse/integracao-local.html
      - name: Scoped diff hygiene
        run: git diff --check 8f5bf2a330b38a0b66e7e39f04f5bd9a4e6a5bb2..HEAD -- compliance/kpis/tatahouse/house_governanca_avaliacoes_local_v1.js compliance/kpis/tatahouse/integracao-local.html
      - name: Test and build House feature
        working-directory: house
        run: |
          npm ci
          npm test -- src/lib/cardapio/governanca-postmessage.test.ts src/lib/cardapio/governanca-sync.test.ts src/lib/cardapio/governanca-outbox.test.ts src/lib/cardapio/governanca-cardapio.test.ts src/lib/cardapio/governanca-handoff.test.ts
          npm run typecheck
          npm run build
      - name: Install Chromium
        run: |
          mkdir -p /tmp/eval-e2e
          cd /tmp/eval-e2e
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 >/dev/null
          npx playwright install --with-deps chromium
      - name: Start exact-origin HTTPS harness
        run: |
          cat > /tmp/eval-cert.cnf <<'EOF'
          [req]
          distinguished_name=req_dn
          x509_extensions=v3_req
          prompt=no
          [req_dn]
          CN=tata-house-governanca-evaluations
          [v3_req]
          subjectAltName=@alt_names
          [alt_names]
          DNS.1=tata-house.github.io
          DNS.2=lideres.tatasushi.tech
          EOF
          openssl req -x509 -nodes -newkey rsa:2048 -days 1 -keyout /tmp/eval-key.pem -out /tmp/eval-cert.pem -config /tmp/eval-cert.cnf >/dev/null 2>&1
          sudo -E node .github/scripts/tatahouse_avaliacoes_e2e.cjs server >/tmp/eval-server.log 2>&1 &
          for i in $(seq 1 20); do
            if curl --noproxy '*' --resolve lideres.tatasushi.tech:443:127.0.0.1 -ksSf https://lideres.tatasushi.tech/compliance/kpis/tatahouse/integracao-local.html >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/eval-server.log
          exit 1
      - name: Prove evaluation round trip
        run: |
          set +e
          node .github/scripts/tatahouse_avaliacoes_e2e.cjs test > evaluation-e2e.log 2>&1
          code=$?
          cat evaluation-e2e.log
          exit $code
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tatahouse-evaluation-e2e-diagnostics
          path: |
            evaluation-e2e.log
            /tmp/eval-server.log
      - name: Remove temporary evaluation harness
        if: success()
        run: |
          rm .github/workflows/tatahouse-avaliacoes-e2e-temp.yml .github/scripts/tatahouse_avaliacoes_e2e.cjs
          git config user.name "cesarspichencoff-cmyk"
          git config user.email "cesar.spichencoff@gmail.com"
          git add .github/workflows/tatahouse-avaliacoes-e2e-temp.yml .github/scripts/tatahouse_avaliacoes_e2e.cjs
          git commit -m "test(tatahouse): remove temporary evaluation E2E harness"
          git push origin HEAD:feat/tatahouse-governanca-phase1
