name: TATA House readiness mobile fix temporary

on:
  push:
    branches: [feat/tatahouse-governanca-phase1]
    paths:
      - '.github/workflows/tatahouse-readiness-mobile-fix-temp.yml'

permissions:
  contents: write

jobs:
  fix-and-prove:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/tatahouse-governanca-phase1
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Apply bounded mobile fix
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('compliance/kpis/tatahouse/prontidao.html')
          s=p.read_text()
          old='.gate-evidence{display:block;color:#888;margin-top:4px;font-size:10px}'
          new='.gate-evidence{display:block;color:#888;margin-top:4px;font-size:10px;max-width:100%;overflow-wrap:anywhere;word-break:break-word}'
          if s.count(old)!=1:
              raise SystemExit(f'expected exactly one gate-evidence rule, found {s.count(old)}')
          p.write_text(s.replace(old,new,1))
          PY
          git diff -- compliance/kpis/tatahouse/prontidao.html

      - name: Permanent readiness regression
        run: node compliance/kpis/tatahouse/house_governanca_readiness_v1.test.cjs

      - name: Install Chromium
        run: |
          mkdir -p /tmp/readiness-mobile && cd /tmp/readiness-mobile
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 >/dev/null
          npx playwright install --with-deps chromium >/dev/null

      - name: Prepare exact-origin harness
        run: |
          cat > /tmp/readiness-mobile-cert.cnf <<'EOF'
          [req]
          distinguished_name=req_dn
          x509_extensions=v3_req
          prompt=no
          [req_dn]
          CN=tatahouse-readiness-mobile
          [v3_req]
          subjectAltName=@alt_names
          [alt_names]
          DNS.1=lideres.tatasushi.tech
          DNS.2=tata-house.github.io
          EOF
          openssl req -x509 -nodes -newkey rsa:2048 -days 1 -keyout /tmp/readiness-mobile-key.pem -out /tmp/readiness-mobile-cert.pem -config /tmp/readiness-mobile-cert.cnf >/dev/null 2>&1

          cat > /tmp/readiness-mobile/proof.cjs <<'NODE'
          const https=require('https'),fs=require('fs'),path=require('path');
          const mode=process.argv[2],root=process.env.GITHUB_WORKSPACE;
          const gateStub="(function(){document.documentElement.dataset.auth='ok';window.__lideresSession={displayName:'E2E Readiness',perfil:'gestao'};})();";
          function send(res,status,body,type='text/plain; charset=utf-8'){res.writeHead(status,{'content-type':type,'cache-control':'no-store'});res.end(body)}
          function mime(f){if(f.endsWith('.html'))return'text/html; charset=utf-8';if(f.endsWith('.js'))return'application/javascript; charset=utf-8';if(f.endsWith('.json'))return'application/json; charset=utf-8';if(f.endsWith('.css'))return'text/css; charset=utf-8';return'application/octet-stream'}
          function serve(res,base,p){let rel=decodeURIComponent(p);while(rel.startsWith('/'))rel=rel.slice(1);if(!rel)rel='index.html';const br=path.resolve(base),file=path.resolve(base,rel);if(!file.startsWith(br+path.sep)&&file!==br)return send(res,403,'forbidden');try{if(!fs.statSync(file).isFile())return send(res,404,'not found');res.writeHead(200,{'content-type':mime(file),'cache-control':'no-store'});fs.createReadStream(file).pipe(res)}catch{return send(res,404,'not found')}}
          function server(){https.createServer({key:fs.readFileSync('/tmp/readiness-mobile-key.pem'),cert:fs.readFileSync('/tmp/readiness-mobile-cert.pem')},(req,res)=>{const host=(req.headers.host||'').split(':')[0],p=new URL(req.url,'https://'+host).pathname;if(host==='lideres.tatasushi.tech'){if(p==='/compliance/gate.js')return send(res,200,gateStub,'application/javascript; charset=utf-8');return serve(res,root,p)}if(host==='tata-house.github.io')return send(res,200,'<!doctype html><title>House proof stub</title><main>House official origin stub</main>','text/html; charset=utf-8');return send(res,421,'host')}).listen(443,'0.0.0.0')}
          async function test(){
            const {chromium}=require('/tmp/readiness-mobile/node_modules/playwright');
            const browser=await chromium.launch({headless:true,args:['--host-resolver-rules=MAP lideres.tatasushi.tech 127.0.0.1, MAP tata-house.github.io 127.0.0.1','--no-proxy-server']});
            const context=await browser.newContext({ignoreHTTPSErrors:true,viewport:{width:390,height:844},timezoneId:'America/Sao_Paulo'});
            await context.route('https://cdn.jsdelivr.net/**',r=>r.fulfill({status:200,contentType:'application/javascript',body:''}));
            await context.route('https://fonts.googleapis.com/**',r=>r.fulfill({status:200,contentType:'text/css',body:''}));
            await context.route('https://fonts.gstatic.com/**',r=>r.abort());
            const writes=[];context.on('request',r=>{if(!['GET','HEAD','OPTIONS'].includes(r.method()))writes.push({method:r.method(),url:r.url()})});

            const page=await context.newPage();
            await page.goto('https://lideres.tatasushi.tech/compliance/kpis/tatahouse/prontidao.html',{waitUntil:'domcontentloaded'});
            await page.waitForFunction(()=>document.getElementById('global-signal')?.textContent==='PRÉ-SUPABASE PRONTO',null,{timeout:10000});
            if(await page.locator('#fatal').isVisible())throw new Error('fatal inesperado');
            const badges=await page.locator('.target .badge').allTextContents();
            if(JSON.stringify(badges)!==JSON.stringify(['PRONTO','BLOQUEADO','BLOQUEADO']))throw new Error('targets '+JSON.stringify(badges));
            const width=await page.evaluate(()=>({client:document.documentElement.clientWidth,scroll:document.documentElement.scrollWidth,evidence:[...document.querySelectorAll('.gate-evidence')].map(e=>({client:e.clientWidth,scroll:e.scrollWidth}))}));
            if(width.scroll>width.client)throw new Error('overflow mobile '+JSON.stringify(width));
            if(width.evidence.some(x=>x.scroll>x.client+1))throw new Error('evidência ainda transborda '+JSON.stringify(width.evidence));
            console.log('READINESS_UI_TARGETS=PASS');
            console.log('READINESS_UI_MOBILE=PASS');

            const central=await context.newPage();
            await central.goto('https://lideres.tatasushi.tech/compliance/kpis/tatahouse/central.html',{waitUntil:'domcontentloaded'});
            const link=central.locator('a[data-readiness-entry="v1"]');
            if(await link.count()!==1||(await link.getAttribute('href'))!=='prontidao.html')throw new Error('entrada Prontidão inválida');
            if((await central.locator('#house-frame').getAttribute('src'))!=='https://tata-house.github.io/')throw new Error('origem House inválida');
            console.log('READINESS_CENTRAL_WIRING=PASS');

            const closed=await context.newPage();
            await closed.route('**/house_governanca_readiness_v1.json',r=>r.fulfill({status:200,contentType:'application/json',body:'{"contrato":"inválido","versao":1}'}));
            await closed.goto('https://lideres.tatasushi.tech/compliance/kpis/tatahouse/prontidao.html',{waitUntil:'domcontentloaded'});
            await closed.waitForFunction(()=>document.getElementById('global-signal')?.textContent==='FAIL-CLOSED',null,{timeout:10000});
            if(!(await closed.locator('#fatal').isVisible()))throw new Error('fail-closed visual ausente');
            console.log('READINESS_UI_FAIL_CLOSED=PASS');

            if(writes.length)throw new Error('writes '+JSON.stringify(writes));
            console.log('READINESS_NO_WRITES=PASS');
            console.log('READINESS_BROWSER_FULL=PASS');
            await browser.close();
          }
          if(mode==='server')server();else test().catch(e=>{console.error(e);process.exit(1)});
          NODE
          node --check /tmp/readiness-mobile/proof.cjs

      - name: Start exact-origin HTTPS harness
        run: |
          sudo -E node /tmp/readiness-mobile/proof.cjs server >/tmp/readiness-mobile-server.log 2>&1 &
          for i in $(seq 1 20); do if curl --noproxy '*' --resolve lideres.tatasushi.tech:443:127.0.0.1 -ksSf https://lideres.tatasushi.tech/compliance/kpis/tatahouse/prontidao.html >/dev/null; then exit 0; fi; sleep 1; done
          cat /tmp/readiness-mobile-server.log
          exit 1

      - name: Prove readiness dashboard after fix
        run: node /tmp/readiness-mobile/proof.cjs test

      - name: Diff hygiene
        run: git diff --check

      - name: Commit bounded product fix
        run: |
          git config user.name "cesarspichencoff-cmyk"
          git config user.email "cesar.spichencoff@gmail.com"
          git add -- compliance/kpis/tatahouse/prontidao.html
          git diff --cached --quiet && exit 0
          git commit -m "fix(tatahouse): wrap readiness evidence on mobile"
          git push origin HEAD:feat/tatahouse-governanca-phase1

      - name: Remove temporary workflow only
        if: always()
        run: |
          git config user.name "cesarspichencoff-cmyk"
          git config user.email "cesar.spichencoff@gmail.com"
          for attempt in 1 2 3; do
            git fetch origin feat/tatahouse-governanca-phase1
            git reset --hard origin/feat/tatahouse-governanca-phase1
            if [ ! -f .github/workflows/tatahouse-readiness-mobile-fix-temp.yml ]; then exit 0; fi
            git rm -f -- .github/workflows/tatahouse-readiness-mobile-fix-temp.yml
            git commit -m "test(tatahouse): remove temporary readiness mobile fix harness"
            if git push origin HEAD:feat/tatahouse-governanca-phase1; then exit 0; fi
            sleep 1
          done
          exit 1
