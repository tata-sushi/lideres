name: TATA House preflight promotion temporary

on:
  push:
    branches:
      - feat/tatahouse-governanca-phase1
    paths:
      - '.github/workflows/tatahouse-preflight-promotion-temp.yml'

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/tatahouse-governanca-phase1
      - name: Validate live readonly preflight
        run: node compliance/kpis/tatahouse/house_governanca_live_readonly_preflight_v1.test.cjs
      - name: Validate House promotion map
        run: node compliance/kpis/tatahouse/house_governanca_promotion_map_v1.test.cjs
      - name: Preserve readiness
        run: node compliance/kpis/tatahouse/house_governanca_readiness_v1.test.cjs
      - name: Diff hygiene
        run: git diff --check
