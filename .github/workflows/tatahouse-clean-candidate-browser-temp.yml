name: TATA House clean candidate browser proof temporary

on:
  push:
    branches:
      - feat/tatahouse-governanca-phase1
    paths:
      - '.github/workflows/tatahouse-clean-candidate-browser-temp.yml'

jobs:
  browser-proof:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/tatahouse-governanca-phase1
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Validate permanent promotion contracts
        run: |
          node compliance/kpis/tatahouse/house_governanca_clean_candidate_recipe_v1.test.cjs
          node compliance/kpis/tatahouse/house_governanca_house_slice_manifest_v1.test.cjs
          node compliance/kpis/tatahouse/house_governanca_promotion_map_v1.test.cjs

      - name: Reconstruct clean House candidate from production
        env:
          BASE: 6dc04827b195aaca9d4653618e5a40ca64a1a6f4
          FEATURE: e7b3b791750ba85b1da2f6f229a3168e69c0a217
          PLANNER_SCENARIOS: 05f17fd0cae2438389dfb03973644131c7a2820e
          READONLY_OVERLAY: e6980d8c69f35252bd113d2a96f6594cf278bc48
          SCENARIO_COMPONENT: 36bbd9346bea7ac3a29a09329b5907213684b5ac
          CANDIDATES_SOURCE: 15ee28bbeabef3c5c1220db79396168929984f0f
          CANDIDATES_TEST_SOURCE: 447df60c9dbe8b156b9f2bd993cd92aac484e3a0
          PDFJS_SECURITY: a1302762b9c8ac82e77556f05020b044605ce843
        run: |
          git clone --quiet https://github.com/cesarspichencoff-cmyk/tata-house.github.io.git /tmp/house
          cd /tmp/house
          git fetch --quiet origin "$BASE" "$FEATURE" "$PLANNER_SCENARIOS" "$READONLY_OVERLAY" "$SCENARIO_COMPONENT" "$CANDIDATES_SOURCE" "$CANDIDATES_TEST_SOURCE" "$PDFJS_SECURITY"
          git checkout --quiet --detach "$BASE"

          MANIFEST="$GITHUB_WORKSPACE/compliance/kpis/tatahouse/house_governanca_house_slice_manifest_v1.json"
          jq -r '.classificacoes[] | select(.id=="WHOLE_FILE_INTEGRATION") | .arquivos[]' "$MANIFEST" | while IFS= read -r p; do
            mkdir -p "$(dirname "$p")"
            git show "$FEATURE:$p" > "$p"
          done

          mkdir -p src/components/cardapio src/lib/cardapio
          git show "$PLANNER_SCENARIOS:src/components/cardapio/PlanejadorGovernanca.tsx" > src/components/cardapio/PlanejadorGovernanca.tsx
          git show "$SCENARIO_COMPONENT:src/components/cardapio/CenariosGovernanca.tsx" > src/components/cardapio/CenariosGovernanca.tsx
          git show "$CANDIDATES_SOURCE:src/lib/cardapio/governanca-candidatos.ts" > src/lib/cardapio/governanca-candidatos.ts
          git show "$CANDIDATES_TEST_SOURCE:src/lib/cardapio/governanca-candidatos.test.ts" > src/lib/cardapio/governanca-candidatos.test.ts

          git diff "$READONLY_OVERLAY^" "$READONLY_OVERLAY" -- src/components/cardapio/PlanejadorGovernanca.tsx > /tmp/readonly-overlay.patch
          test -s /tmp/readonly-overlay.patch
          git apply --verbose /tmp/readonly-overlay.patch

          for p in package.json package-lock.json public/pdf.worker.min.mjs; do
            mkdir -p "$(dirname "$p")"
            git show "$PDFJS_SECURITY:$p" > "$p"
          done

          ! grep -q 'TrocaInteligenteGovernanca' src/components/cardapio/PlanejadorGovernanca.tsx
          ! grep -q 'useMostrarBasicos' src/components/cardapio/PlanejadorGovernanca.tsx
          grep -q 'CenariosGovernanca' src/components/cardapio/PlanejadorGovernanca.tsx
          grep -q 'governanca-readonly' src/components/cardapio/PlanejadorGovernanca.tsx
          grep -q 'frequenciaOficial4Semanas' src/components/cardapio/PlanejadorGovernanca.tsx
          grep -q 'Math.max(cont\[chave\] ?? 0, qtd)' src/components/cardapio/PlanejadorGovernanca.tsx
          grep -q 'data-testid="evidencia-readonly-lideres"' src/components/cardapio/PlanejadorGovernanca.tsx
          grep -q '@/lib/cardapio/governanca-candidatos' src/components/cardapio/CenariosGovernanca.tsx

          for p in src/app/page.tsx src/components/BottomNav.tsx src/components/TourOnboarding.tsx src/components/cardapio/AbaCardapio.tsx src/lib/cardapio/login.ts; do
            git diff --quiet "$BASE" -- "$p"
          done
          for p in src/components/cardapio/TrocaInteligenteGovernanca.tsx src/lib/cardapio/governanca-trocas.ts src/lib/cardapio/governanca-trocas.test.ts .github/workflows/tatahouse-trocas-v2-temp.yml .github/workflows/tatahouse-trocas-v2-e2e-temp.yml; do
            test ! -e "$p"
          done

          git add -N .
          git diff --name-only "$BASE" | sort > /tmp/candidate-files.txt
          test "$(wc -l < /tmp/candidate-files.txt)" -eq 31
          ! grep -Fx 'src/app/page.tsx' /tmp/candidate-files.txt
          ! grep -Fx 'src/components/BottomNav.tsx' /tmp/candidate-files.txt
          ! grep -F 'governanca-trocas' /tmp/candidate-files.txt
          ! grep -F '.github/workflows/' /tmp/candidate-files.txt
          echo 'CLEAN_BROWSER_CANDIDATE_31_FILES=PASS'
          echo 'CLEAN_BROWSER_TROCAS_EXCLUDED=PASS'
          echo 'CLEAN_BROWSER_GLOBAL_UX_UNCHANGED=PASS'

      - name: Build and regress clean candidate
        working-directory: /tmp/house
        run: |
          npm ci
          npm test
          npm run typecheck
          npm run lint
          npm run build
          test -f out/planejar.html
          git diff --check
          echo 'CLEAN_BROWSER_PREBUILD_GATES=PASS'

      - name: Install Playwright
        run: |
          mkdir -p /tmp/e2e
          cd /tmp/e2e
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0
          npx playwright install chromium

      - name: Recover proven historical browser harness
        env:
          HARNESS_COMMIT: b21ece6eac5a5bb903036291271ca4bbb473e628
        run: |
          git fetch --quiet origin "$HARNESS_COMMIT"
          git show "$HARNESS_COMMIT:compliance/kpis/tatahouse/__tmp_readonly_exact_origin_e2e.cjs" > /tmp/clean_candidate_exact_origin_e2e.cjs
          test -s /tmp/clean_candidate_exact_origin_e2e.cjs
          grep -q 'READONLY_EXACT_ORIGINS=PASS' /tmp/clean_candidate_exact_origin_e2e.cjs
          grep -q 'READONLY_FREQUENCY_INFLUENCE=PASS' /tmp/clean_candidate_exact_origin_e2e.cjs
          grep -q 'READONLY_ZERO_LIVE_SUPABASE_NETWORK=PASS' /tmp/clean_candidate_exact_origin_e2e.cjs
          echo 'HISTORICAL_HARNESS_RECOVERED=PASS'

      - name: Exact-origin browser proof on clean candidate
        env:
          NODE_PATH: /tmp/e2e/node_modules
        run: |
          node /tmp/clean_candidate_exact_origin_e2e.cjs
          echo 'CLEAN_CANDIDATE_EXACT_ORIGIN_BROWSER=PASS'

      - name: Final boundary check
        run: |
          node compliance/kpis/tatahouse/house_governanca_readiness_v1.test.cjs
          node compliance/kpis/tatahouse/house_governanca_live_readonly_preflight_v1.test.cjs
          git diff --check
          echo 'CLEAN_CANDIDATE_PRODUCTION_STILL_NOT_AUTHORIZED=PASS'
