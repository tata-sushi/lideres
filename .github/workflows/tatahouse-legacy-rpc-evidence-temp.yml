name: TATÁ House legacy RPC evidence temporary

on:
  push:
    branches:
      - feat/tatahouse-governanca-phase1
    paths:
      - .github/workflows/tatahouse-legacy-rpc-evidence-temp.yml

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/tatahouse-governanca-phase1
          fetch-depth: 0

      - name: Permanent readiness regression
        run: node compliance/kpis/tatahouse/house_governanca_readiness_v1.test.cjs

      - name: Assert historical known live unknown boundary
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const m = JSON.parse(fs.readFileSync('compliance/kpis/tatahouse/house_governanca_readiness_v1.json','utf8'));
          const evaluator = require('./compliance/kpis/tatahouse/house_governanca_readiness_v1.js');
          const gate = m.gates.find(g => g.id === 'legacy_rpc_write_semantics');
          if (!gate) throw new Error('legacy RPC gate missing');
          if (gate.status !== 'UNKNOWN') throw new Error('legacy RPC live gate must remain UNKNOWN');
          if (!String(gate.classificacao).includes('KNOWN_HISTORICAL')) throw new Error('historical evidence classification missing');
          if (!String(gate.classificacao).includes('CURRENT_LIVE_UNKNOWN')) throw new Error('live unknown classification missing');
          for (const x of ['#2293','#2324','#2304','#2327','88d20d1f']) {
            if (!String(gate.evidencia).includes(x)) throw new Error('missing evidence '+x);
          }
          const planner = evaluator.avaliarTarget(m, 'planner_write_activation');
          if (planner.ready) throw new Error('planner write must remain blocked');
          const blockers = new Set(planner.blockers.map(g => g.id));
          for (const id of ['legacy_rpc_write_semantics','integration_live_transport','live_permission_data_verification','human_planner_write_authorization']) {
            if (!blockers.has(id)) throw new Error('missing planner blocker '+id);
          }
          console.log('LEGACY_RPC_HISTORICAL_KNOWN=PASS');
          console.log('LEGACY_RPC_CURRENT_LIVE_UNKNOWN=PASS');
          console.log('LEGACY_RPC_NO_IMPLICIT_AUTHORIZATION=PASS');
          console.log('PLANNER_WRITE_STILL_BLOCKED=PASS');
          NODE

      - name: Diff hygiene
        run: |
          git diff --check HEAD~3..HEAD
          echo LEGACY_RPC_DIFF_CHECK=PASS

      - name: Remove temporary workflow only
        if: always()
        run: |
          git config user.name "cesarspichencoff-cmyk"
          git config user.email "cesar.spichencoff@gmail.com"
          for attempt in 1 2 3; do
            git fetch origin feat/tatahouse-governanca-phase1
            git reset --hard origin/feat/tatahouse-governanca-phase1
            if [ ! -f .github/workflows/tatahouse-legacy-rpc-evidence-temp.yml ]; then exit 0; fi
            git rm -f -- .github/workflows/tatahouse-legacy-rpc-evidence-temp.yml
            git commit -m "test(tatahouse): remove temporary legacy RPC evidence harness"
            if git push origin HEAD:feat/tatahouse-governanca-phase1; then exit 0; fi
            sleep 1
          done
          exit 1
