name: TATA House readonly exact-origin E2E temporary
on:
  push:
    branches:
      - feat/tatahouse-governanca-phase1
    paths:
      - '.github/workflows/tatahouse-readonly-e2e-temp.yml'
jobs:
  e2e:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/tatahouse-governanca-phase1
          fetch-depth: 0
      - name: Checkout House feature
        run: |
          git clone --depth 1 --branch feat/house-governanca-phase1 https://github.com/cesarspichencoff-cmyk/tata-house.github.io.git /tmp/house
          echo "HOUSE_HEAD=$(git -C /tmp/house rev-parse HEAD)"
      - name: Build House static export
        working-directory: /tmp/house
        run: |
          npm ci
          npm run build
          test -f out/planejar.html
      - name: Prepare isolated Lideres test surface
        run: |
          mkdir -p /tmp/lideres-serve
          rsync -a --exclude='.git' ./ /tmp/lideres-serve/
          python - <<'PY'
          import json
          from datetime import date, timedelta
          from pathlib import Path
          dados=json.loads(Path('/tmp/house/src/lib/cardapio/dados.json').read_text())
          principais=list(dict.fromkeys(dados['listas']['principais']))[:56]
          rows=[]
          inicio=date(2026,8,10)
          for i,nome in enumerate(principais):
              rows.append({
                  'data': (inicio+timedelta(days=i%28)).isoformat(),
                  'unidade':'Itaim',
                  'status':'finalizado',
                  'resumo':nome,
                  'custo_total':400+i,
                  'desperdicio_total':i%7,
                  'aval_geral':4.4,
                  'n_avaliacoes':3,
                  'pratos':[{'tipo':'principal','item':nome}],
                  'comentarios':[{'comentario':'NUNCA_TRANSPORTAR'}],
                  'dia_id':'interno-secret-'+str(i)
              })
          gate=f"""document.documentElement.dataset.auth='ok';
window.__readonlyMode='success';
window.__readonlyRpcCalls=[];
window.__readonlyWriteCalls=[];
window.__readonlyRows={json.dumps(rows,ensure_ascii=False)};
window.__lideresSupa={{
  schema:function(nome){{
    if(nome!=='tata_plus') throw new Error('schema não allowlisted: '+nome);
    var alvo={{
      rpc:async function(nomeRpc,args){{
        window.__readonlyRpcCalls.push({{nome:nomeRpc,args:args}});
        if(nomeRpc!=='refeicoes_relatorio_detalhado') throw new Error('rpc não allowlisted: '+nomeRpc);
        if(window.__readonlyMode==='fail') return {{data:null,error:{{message:'falha read-only simulada'}}}};
        return {{data:window.__readonlyRows,error:null}};
      }}
    }};
    return new Proxy(alvo,{{get:function(target,prop){{
      if(['insert','update','delete','upsert','from'].includes(String(prop))){{
        window.__readonlyWriteCalls.push(String(prop));
        throw new Error('mutação/acesso direto proibido: '+String(prop));
      }}
      return target[prop];
    }}}});
  }}
}};
"""
          Path('/tmp/lideres-serve/compliance/gate.js').write_text(gate)
          p=Path('/tmp/lideres-serve/compliance/kpis/tatahouse/planejador-v2.html')
          s=p.read_text()
          s=s.replace('<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>','')
          p.write_text(s)
          print('FAKE_PRINCIPAIS='+str(len(principais)))
          PY
      - name: Install Playwright
        run: |
          mkdir -p /tmp/e2e
          cd /tmp/e2e
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0
          npx playwright install chromium
      - name: Create exact-origin HTTPS servers
        run: |
          sudo sh -c "printf '\n127.0.0.2 lideres.tatasushi.tech\n127.0.0.3 tata-house.github.io\n' >> /etc/hosts"
          openssl req -x509 -newkey rsa:2048 -nodes -keyout /tmp/key.pem -out /tmp/cert.pem -days 1 -subj '/CN=localhost' -addext 'subjectAltName=DNS:lideres.tatasushi.tech,DNS:tata-house.github.io' >/dev/null 2>&1
          cat >/tmp/static-server.js <<'JS'
          const https=require('https');
          const fs=require('fs');
          const path=require('path');
          const root=path.resolve(process.argv[2]);
          const host=process.argv[3];
          const mime={'.html':'text/html; charset=utf-8','.js':'text/javascript; charset=utf-8','.mjs':'text/javascript; charset=utf-8','.css':'text/css; charset=utf-8','.json':'application/json','.svg':'image/svg+xml','.png':'image/png','.jpg':'image/jpeg','.jpeg':'image/jpeg','.webp':'image/webp','.woff2':'font/woff2'};
          function safe(reqPath){
            let pn=decodeURIComponent(new URL(reqPath,'https://local').pathname);
            if(pn.endsWith('/')) pn+='index.html';
            let f=path.resolve(root,'.'+pn);
            if(!f.startsWith(root)) return null;
            if(!fs.existsSync(f) && !path.extname(f) && fs.existsSync(f+'.html')) f+='.html';
            if(fs.existsSync(f) && fs.statSync(f).isDirectory()) f=path.join(f,'index.html');
            return f;
          }
          https.createServer({key:fs.readFileSync('/tmp/key.pem'),cert:fs.readFileSync('/tmp/cert.pem')},(req,res)=>{
            const f=safe(req.url);
            if(!f||!fs.existsSync(f)||!fs.statSync(f).isFile()){res.writeHead(404,{'cache-control':'no-store'});return res.end('404');}
            res.writeHead(200,{'content-type':mime[path.extname(f)]||'application/octet-stream','cache-control':'no-store'});
            fs.createReadStream(f).pipe(res);
          }).listen(443,host,()=>console.log('HTTPS_READY '+host+' '+root));
          JS
          sudo "$(command -v node)" /tmp/static-server.js /tmp/lideres-serve 127.0.0.2 >/tmp/lideres-server.log 2>&1 &
          sudo "$(command -v node)" /tmp/static-server.js /tmp/house/out 127.0.0.3 >/tmp/house-server.log 2>&1 &
          for i in $(seq 1 30); do
            curl -ks --resolve lideres.tatasushi.tech:443:127.0.0.2 https://lideres.tatasushi.tech/compliance/kpis/tatahouse/planejador-v2.html >/dev/null && \
            curl -ks --resolve tata-house.github.io:443:127.0.0.3 https://tata-house.github.io/planejar.html >/dev/null && break
            sleep 1
          done
          curl -ks --resolve lideres.tatasushi.tech:443:127.0.0.2 -o /dev/null -w 'LIDERES_HTTP=%{http_code}\n' https://lideres.tatasushi.tech/compliance/kpis/tatahouse/planejador-v2.html
          curl -ks --resolve tata-house.github.io:443:127.0.0.3 -o /dev/null -w 'HOUSE_HTTP=%{http_code}\n' https://tata-house.github.io/planejar.html
      - name: Exact-origin browser proof
        working-directory: /tmp/e2e
        run: |
          cat >readonly-e2e.js <<'JS'
          const { chromium }=require('playwright');
          const assert=require('node:assert/strict');
          (async()=>{
            const browser=await chromium.launch({headless:true,args:['--no-proxy-server']});
            const context=await browser.newContext({ignoreHTTPSErrors:true,viewport:{width:390,height:844}});
            const page=await context.newPage();
            const errors=[];
            const supabaseNet=[];
            page.on('pageerror',e=>errors.push('PAGE:'+e.message));
            page.on('request',r=>{if(r.url().includes('.supabase.co')) supabaseNet.push(r.url());});
            await page.goto('https://lideres.tatasushi.tech/compliance/kpis/tatahouse/planejador-v2.html',{waitUntil:'domcontentloaded'});
            assert.equal(new URL(page.url()).origin,'https://lideres.tatasushi.tech');
            await page.selectOption('#unidade','Itaim');
            await page.fill('#semana','2026-W37');
            await page.click('#abrir');
            const frame=page.frame({url:/tata-house\.github\.io\/planejar\.html/});
            assert.ok(frame,'iframe House não abriu');
            assert.equal(new URL(frame.url()).origin,'https://tata-house.github.io');
            const banner=frame.getByTestId('evidencia-readonly-lideres');
            await banner.waitFor({state:'visible',timeout:20000});
            const bannerText=await banner.innerText();
            assert.match(bannerText,/Histórico oficial em leitura:/);
            assert.match(bannerText,/Nenhum dado foi gravado no Supabase/);
            const calls=await page.evaluate(()=>window.__readonlyRpcCalls);
            const writes=await page.evaluate(()=>window.__readonlyWriteCalls);
            assert.equal(calls.length,1,'deve chamar exatamente uma RPC read-only');
            assert.equal(calls[0].nome,'refeicoes_relatorio_detalhado');
            assert.deepEqual(calls[0].args,{p_unidade:'Itaim',p_data_ini:'2026-07-13',p_data_fim:'2026-09-06'});
            assert.deepEqual(writes,[],'nenhuma primitiva de escrita/acesso direto pode ser tocada');
            const body=await frame.locator('body').innerText();
            assert.equal(body.includes('NUNCA_TRANSPORTAR'),false,'comentário individual vazou para o House');
            assert.equal(body.includes('interno-secret'),false,'ID interno vazou para o House');
            const storageDump=await frame.evaluate(()=>JSON.stringify({local:{...localStorage},session:{...sessionStorage}}));
            assert.equal(storageDump.includes('NUNCA_TRANSPORTAR'),false,'evidência minimizada não pode ser persistida');
            assert.equal(storageDump.includes('interno-secret'),false,'ID interno não pode ser persistido');
            await frame.getByTestId('gerar-cenarios').click();
            await frame.getByTestId('lista-cenarios').waitFor({state:'visible',timeout:10000});
            const repeticoes=await frame.evaluate(()=>Array.from(document.querySelectorAll('p')).filter(p=>p.textContent?.trim()==='Repetição recente').map(p=>p.parentElement?.innerText||''));
            assert.ok(repeticoes.length>0,'métrica de repetição não apareceu');
            const ocorrencias=repeticoes.map(t=>Number((t.match(/(\d+) ocorrência/)||[])[1]||0));
            assert.ok(ocorrencias.some(n=>n>0),'frequência oficial não influenciou nenhuma métrica visível');
            const overflow=await frame.evaluate(()=>document.documentElement.scrollWidth-window.innerWidth);
            assert.ok(overflow<=1,'House overflow horizontal no mobile: '+overflow);
            console.log('READONLY_E2E_EXACT_ORIGINS=PASS');
            console.log('READONLY_E2E_ONE_RPC_ONLY=PASS');
            console.log('READONLY_E2E_NO_WRITES=PASS');
            console.log('READONLY_E2E_MINIMIZATION=PASS');
            console.log('READONLY_E2E_TRANSIENT_STORAGE=PASS');
            console.log('READONLY_E2E_FREQUENCY_INFLUENCE=PASS');
            console.log('READONLY_E2E_MOBILE=PASS');

            await page.evaluate(()=>{window.__readonlyMode='fail';});
            await page.fill('#semana','2026-W38');
            await page.click('#abrir');
            await page.waitForFunction(()=>document.getElementById('status')?.textContent?.includes('Planejador pronto'),null,{timeout:20000});
            const frame2=page.frame({url:/tata-house\.github\.io\/planejar\.html/});
            assert.ok(frame2);
            await frame2.getByTestId('comparador-cenarios').waitFor({state:'visible',timeout:10000});
            assert.equal(await frame2.getByTestId('evidencia-readonly-lideres').count(),0,'falha de leitura não pode criar evidência');
            const calls2=await page.evaluate(()=>window.__readonlyRpcCalls);
            const writes2=await page.evaluate(()=>window.__readonlyWriteCalls);
            assert.equal(calls2.length,2,'segunda abertura deve fazer uma única nova leitura');
            assert.deepEqual(writes2,[]);
            assert.equal(supabaseNet.length,0,'harness não pode tocar rede Supabase live');
            assert.deepEqual(errors,[],'page errors: '+errors.join(' | '));
            console.log('READONLY_E2E_FAIL_CLOSED_LOCAL_FALLBACK=PASS');
            console.log('READONLY_E2E_ZERO_LIVE_SUPABASE_NETWORK=PASS');
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          JS
          node readonly-e2e.js
      - name: Diff hygiene
        run: git diff --check
