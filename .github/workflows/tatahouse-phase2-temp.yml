name: TATA House Governance Phase 2 temporary

on:
  push:
    branches:
      - feat/tatahouse-governanca-phase1

permissions:
  contents: write

jobs:
  prove:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/tatahouse-governanca-phase1
      - name: Patch and validate
        run: |
          python3 .github/scripts/tatahouse_phase2_patch.py
          git diff --check
          node - <<'NODE'
          const fs=require('fs'); const vm=require('vm');
          const code=fs.readFileSync('compliance/kpis/tatahouse/house_governanca_local_bridge_v1.js','utf8');
          const fakeWindow={crypto:{randomUUID:()=> 'corr-test'},addEventListener(){},removeEventListener(){},setTimeout,clearTimeout,open(){return null;}};
          vm.runInNewContext(code,{window:fakeWindow,Date,Math,Promise,Error,Number,Array,Object,String});
          const b=fakeWindow.TataHouseGovernancaLocalBridgeV1;
          if(!b || typeof b.criarSnapshotDoCardapioDia!=='function') throw new Error('adapter not exported');
          const s=b.criarSnapshotDoCardapioDia({data:'2026-09-06',unidade:'Itaim',resumo:' Frango acebolado ',itens:[{tipo:'principal',item:'Outro'},{tipo:'guarnicao',item:' Arroz e Feijão '},{tipo:'guarnicao',item:' Legumes '},{tipo:'salada',item:' Folhas '}]});
          if(s.unidade!=='tata-house'||s.principal!=='Frango acebolado'||s.guarnicao!=='Arroz e Feijão · Legumes'||s.salada!=='Folhas') throw new Error('canonical mapping mismatch: '+JSON.stringify(s));
          const f=b.criarSnapshotDoCardapioDia({data:'2026-09-06',resumo:'',itens:[{tipo:'principal',item:'Peixe'},{tipo:'principal',item:'Omelete'}]});
          if(f.principal!=='Peixe · Omelete') throw new Error('principal fallback mismatch');
          let rejected=false; try{b.criarSnapshotDoCardapioDia({data:'2026-02-31',resumo:'Frango',itens:[]});}catch{rejected=true;}
          if(!rejected) throw new Error('impossible date accepted');
          console.log('PHASE2_ADAPTER=PASS', JSON.stringify(s));
          NODE
      - name: Commit proven Phase 2
        run: |
          rm .github/workflows/tatahouse-phase2-temp.yml .github/scripts/tatahouse_phase2_patch.py
          git config user.name "cesarspichencoff-cmyk"
          git config user.email "cesar.spichencoff@gmail.com"
          git add compliance/kpis/tatahouse/house_governanca_local_bridge_v1.js compliance/kpis/tatahouse/cardapio.html .github/workflows/tatahouse-phase2-temp.yml .github/scripts/tatahouse_phase2_patch.py
          git commit -m "feat(tatahouse): publish approved governance menu to House"
          git push origin HEAD:feat/tatahouse-governanca-phase1
