name: TATA House UX evidence regression temporary

on:
  push:
    branches: [feat/tatahouse-governanca-phase1]
    paths:
      - '.github/workflows/tatahouse-ux-evidence-regression-temp.yml'

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/tatahouse-governanca-phase1
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Permanent regression
        run: |
          node compliance/kpis/tatahouse/house_governanca_clean_candidate_recipe_v1.test.cjs
          node compliance/kpis/tatahouse/house_governanca_house_slice_manifest_v1.test.cjs
          node compliance/kpis/tatahouse/house_governanca_promotion_map_v1.test.cjs
          node compliance/kpis/tatahouse/house_governanca_readiness_v1.test.cjs
          node compliance/kpis/tatahouse/house_governanca_live_readonly_preflight_v1.test.cjs
          grep -q '>Operação</button>' compliance/kpis/tatahouse/central.html
          grep -q '>Planejar semana</a>' compliance/kpis/tatahouse/central.html
          ! grep -q 'href="integracao-local.html"' compliance/kpis/tatahouse/central.html
          test -f compliance/kpis/tatahouse/integracao-local.html
          grep -q 'planner-open .hero{display:none}' compliance/kpis/tatahouse/planejador-v2.html
          git diff --check
          echo 'TATAHOUSE_UX_DURABLE_EVIDENCE=PASS'
          echo 'TATAHOUSE_DIAGNOSTIC_PRESERVED_NOT_PRIMARY=PASS'
          echo 'TATAHOUSE_PRODUCTION_AUTHORITY_UNCHANGED=PASS'
