name: TATA House Central Index Patch

on:
  push:
    branches: [feat/tatahouse-governanca-phase1]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/tatahouse-governanca-phase1
      - name: Patch index
        run: python .github/scripts/tatahouse_patch_central_index.py
      - name: Verify index
        run: |
          grep -q 'data-tatahouse-central="v1"' compliance/kpis/tatahouse/index.html
          grep -q "location.href='central.html'" compliance/kpis/tatahouse/index.html
          test -f compliance/kpis/tatahouse/central.html
          git diff --check -- compliance/kpis/tatahouse/index.html
      - name: Commit bounded product change
        run: |
          rm .github/workflows/tatahouse-central-index-temp.yml
          rm .github/scripts/tatahouse_patch_central_index.py
          git config user.name "cesarspichencoff-cmyk"
          git config user.email "cesar.spichencoff@gmail.com"
          git add compliance/kpis/tatahouse/index.html .github/workflows/tatahouse-central-index-temp.yml .github/scripts/tatahouse_patch_central_index.py
          git commit -m "feat(tatahouse): make Central House primary governance entry"
          git push origin HEAD:feat/tatahouse-governanca-phase1
