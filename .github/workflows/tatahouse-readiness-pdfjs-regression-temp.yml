name: TATÁ House readiness PDF.js regression temporary

on:
  push:
    branches:
      - feat/tatahouse-governanca-phase1
    paths:
      - .github/workflows/tatahouse-readiness-pdfjs-regression-temp.yml

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/tatahouse-governanca-phase1
          fetch-depth: 0

      - name: Readiness permanent regression
        run: node compliance/kpis/tatahouse/house_governanca_readiness_v1.test.cjs

      - name: Backend-ready contract regressions
        run: |
          node compliance/kpis/tatahouse/house_governanca_avaliacoes_ingest_v1.test.cjs
          node compliance/kpis/tatahouse/house_governanca_avaliacoes_receiver_v1.test.cjs

      - name: Assert exact readiness boundary
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const path = 'compliance/kpis/tatahouse/house_governanca_readiness_v1.json';
          const evaluator = require('./compliance/kpis/tatahouse/house_governanca_readiness_v1.js');
          const m = JSON.parse(fs.readFileSync(path, 'utf8'));
          const all = evaluator.avaliarTodos(m);
          const gate = id => m.gates.find(g => g.id === id);
          if (!all.resultados.pre_supabase_functional.ready) throw new Error('pre_supabase_functional must remain ready');
          if (all.resultados.backend_activation.ready) throw new Error('backend live must remain blocked');
          if (all.resultados.production_promotion.ready) throw new Error('production must remain blocked');
          if (all.resultados.planner_write_activation.ready) throw new Error('planner write must remain blocked');
          if (gate('pdfjs_runtime_security')?.status !== 'PASS') throw new Error('PDF.js gate must be PASS');
          if (gate('human_production_authorization')?.status !== 'NOT_AUTHORIZED') throw new Error('production authorization must remain NOT_AUTHORIZED');
          if (gate('human_backend_mutation_authorization')?.status !== 'NOT_AUTHORIZED') throw new Error('backend mutation authorization must remain NOT_AUTHORIZED');
          if (gate('human_planner_write_authorization')?.status !== 'NOT_AUTHORIZED') throw new Error('planner write authorization must remain NOT_AUTHORIZED');
          const prodBlockers = new Set(all.resultados.production_promotion.blockers.map(g => g.id));
          if (prodBlockers.has('pdfjs_runtime_security')) throw new Error('PDF.js cannot remain a production blocker after PASS');
          for (const id of ['integration_live_transport','live_permission_data_verification','legacy_evaluation_schema_live','ux_layer_selection','human_production_authorization']) {
            if (!prodBlockers.has(id)) throw new Error('missing production blocker: ' + id);
          }
          console.log('READINESS_BOUNDARY_EXACT=PASS');
          console.log('PDFJS_GATE_REMOVED_FROM_BLOCKERS=PASS');
          console.log('PRODUCTION_STILL_NOT_AUTHORIZED=PASS');
          NODE

      - name: Diff hygiene
        run: |
          git diff --check HEAD~3..HEAD
          echo READINESS_DIFF_CHECK=PASS

      - name: Remove temporary workflow only
        if: always()
        run: |
          git config user.name "cesarspichencoff-cmyk"
          git config user.email "cesar.spichencoff@gmail.com"
          for attempt in 1 2 3; do
            git fetch origin feat/tatahouse-governanca-phase1
            git reset --hard origin/feat/tatahouse-governanca-phase1
            if [ ! -f .github/workflows/tatahouse-readiness-pdfjs-regression-temp.yml ]; then exit 0; fi
            git rm -f -- .github/workflows/tatahouse-readiness-pdfjs-regression-temp.yml
            git commit -m "test(tatahouse): remove temporary PDF.js readiness regression"
            if git push origin HEAD:feat/tatahouse-governanca-phase1; then exit 0; fi
            sleep 1
          done
          exit 1
