name: TATÁ House strengthened live evidence regression

on:
  push:
    branches:
      - 'feat/tatahouse-governanca-phase1'
    paths:
      - '.github/workflows/tatahouse-live-evidence-strengthened-regression.yml'

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 4
      - name: Validate evidence boundary and readiness
        shell: bash
        run: |
          set -euo pipefail
          node compliance/kpis/tatahouse/house_governanca_live_access_evidence_v1.test.cjs
          node compliance/kpis/tatahouse/house_governanca_readiness_v1.test.cjs
          git diff --check HEAD~3 HEAD
          test ! -e .github/workflows/tatahouse-live-rpc-readonly-proof.yml
          echo 'LIVE_EVIDENCE_STRENGTHENED=PASS'
          echo 'READINESS_FAIL_CLOSED_PRESERVED=PASS'
          echo 'NO_LIVE_RPC_PROOF_HARNESS=PASS'
