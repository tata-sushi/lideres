name: TATA House slice coverage temporary

on:
  push:
    branches:
      - feat/tatahouse-governanca-phase1
    paths:
      - '.github/workflows/tatahouse-house-slice-coverage-temp.yml'

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/tatahouse-governanca-phase1
      - name: Compare House production and feature
        run: |
          git clone --quiet --no-checkout https://github.com/cesarspichencoff-cmyk/tata-house.github.io.git /tmp/house
          cd /tmp/house
          git fetch --quiet origin 6dc04827b195aaca9d4653618e5a40ca64a1a6f4 e7b3b791750ba85b1da2f6f229a3168e69c0a217
          git diff --name-only 6dc04827b195aaca9d4653618e5a40ca64a1a6f4 e7b3b791750ba85b1da2f6f229a3168e69c0a217 > "$GITHUB_WORKSPACE/house-diff.txt"
          test "$(wc -l < "$GITHUB_WORKSPACE/house-diff.txt")" -eq 41
      - name: Validate exact 41 of 41 classification
        env:
          HOUSE_DIFF_FILE: house-diff.txt
        run: node compliance/kpis/tatahouse/house_governanca_house_slice_manifest_v1.test.cjs
      - name: Validate promotion and readiness locks
        run: |
          node compliance/kpis/tatahouse/house_governanca_promotion_map_v1.test.cjs
          node compliance/kpis/tatahouse/house_governanca_live_readonly_preflight_v1.test.cjs
          node compliance/kpis/tatahouse/house_governanca_readiness_v1.test.cjs
          git diff --check
