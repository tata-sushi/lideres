name: TATA House Lideres UX polish temporary

on:
  push:
    branches: [feat/tatahouse-governanca-phase1]
    paths:
      - '.github/workflows/tatahouse-lideres-ux-polish-temp.yml'

permissions:
  contents: write

jobs:
  polish:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/tatahouse-governanca-phase1
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Apply bounded Lideres UX polish
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('compliance/kpis/tatahouse/central.html')
          s=p.read_text()
          def rep(old,new):
              global s
              if s.count(old)!=1:
                  raise SystemExit(f'central expected once, found {s.count(old)}: {old[:90]}')
              s=s.replace(old,new)
          rep('.nav a:hover,.nav button:hover{border-color:#999}.nav .active{background:var(--carbon);border-color:var(--carbon);color:var(--citric)}.nav .spacer{flex:1}', '.nav a:hover,.nav button:hover{border-color:#999}.nav .active{background:var(--carbon);border-color:var(--carbon);color:var(--citric)}.nav .secondary{background:#f7f7f7;color:#666}.nav .spacer{flex:1}')
          rep('@media(max-width:620px){.brand-sub,.status span:last-child{display:none}.topbar{height:54px;padding:0 10px}.nav{padding:7px 8px}.nav a,.nav button{padding:0 10px;font-size:10px}}', '@media(max-width:620px){.brand-sub{display:none}.topbar{height:54px;padding:0 10px}.status{font-size:8px;max-width:132px;overflow:hidden}.status span:last-child{display:block;overflow:hidden;text-overflow:ellipsis}.nav{padding:7px 8px;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));overflow:visible}.nav a,.nav button{padding:0 6px;font-size:10px;min-width:0}.nav .spacer,.nav .secondary{display:none}}')
          rep('<div class="brand-sub">Governança × produto oficial</div>','<div class="brand-sub">Operação · cardápio · planejamento</div>')
          rep('<span id="central-status">House único · memória preservada</span>','<span id="central-status">Produto oficial conectado</span>')
          rep('    <button class="active" type="button" id="btn-house">Operação House</button>\n    <a href="cardapio.html">Cardápio</a>\n    <a href="planejador-v2.html">Planejamento inteligente</a>\n    <a href="integracao-local.html">Integração</a>\n    <a href="prontidao.html" data-readiness-entry="v1">Prontidão</a>\n    <span class="spacer"></span>\n    <a href="index.html">Governança TATÁ House</a>', '    <button class="active" type="button" id="btn-house">Operação</button>\n    <a href="cardapio.html">Cardápio</a>\n    <a href="planejador-v2.html">Planejar semana</a>\n    <span class="spacer"></span>\n    <a class="secondary" href="prontidao.html" data-readiness-entry="v1">Prontidão</a>\n    <a class="secondary" href="index.html">Governança</a>')
          rep('<strong>Abrindo o TATÁ House oficial</strong><span>O produto continua rodando na própria origem.</span>','<strong>Carregando o TATÁ House</strong><span>Você continua no produto oficial.</span>')
          p.write_text(s)

          p=Path('compliance/kpis/tatahouse/planejador-v2.html')
          s=p.read_text()
          def rep2(old,new):
              global s
              if s.count(old)!=1:
                  raise SystemExit(f'planner expected once, found {s.count(old)}: {old[:90]}')
              s=s.replace(old,new)
          rep2('<title>Planejador VÉRTICE — TATÁ House</title>','<title>Planejar semana — TATÁ House</title>')
          rep2('@media(max-width:760px){.shell{padding:10px}.setup{grid-template-columns:1fr}.workspace iframe{height:78vh;min-height:640px}.days{grid-template-columns:repeat(7,155px)}}', '@media(max-width:760px){.shell{padding:10px}.setup{grid-template-columns:1fr}.workspace iframe{height:78vh;min-height:640px}.days{grid-template-columns:repeat(7,155px)}.planner-open .hero{display:none}.planner-open .setup{margin-top:0}.planner-open .workspace{margin-top:8px}}')
          rep2('<div class="eyebrow">TATÁ House × Governança · Planejador VÉRTICE 2.0</div>','<div class="eyebrow">TATÁ House · Planejamento assistido</div>')
          rep2('<h1>O sistema recomenda. A gestão decide.</h1>','<h1>Planeje a semana com dados. A gestão decide.</h1>')
          rep2('<p>Planeje a semana usando o motor real do House — histórico, aceitação, rotação, preços e custo — e devolva uma proposta para revisão. Nada é aprovado ou publicado automaticamente.</p>','<p>Use histórico, aceitação, repetição e custo do House para comparar opções e montar uma proposta. Nada é publicado automaticamente.</p>')
          rep2('<button id="abrir" class="btn btn-primary" type="button">Abrir planejador</button>','<button id="abrir" class="btn btn-primary" type="button">Planejar semana</button>')
          rep2('<div id="status" class="status" style="grid-column:1/-1">Selecione a unidade e a semana.</div>','<div id="status" class="status" style="grid-column:1/-1">Escolha a unidade e a semana para começar.</div>')
          rep2('<div class="eyebrow">Rascunho recebido</div>','<div class="eyebrow">Proposta pronta para revisão</div>')
          rep2('<span class="badge">Ainda não aprovado</span>','<span class="badge">Rascunho</span>')
          rep2('>Revisar na elaboração oficial</a>','>Levar para elaboração oficial</a>')
          rep2('<div class="note"><strong>Regra:</strong> esta proposta fica registrada apenas neste navegador até a fase de persistência central. Ela não altera o cardápio oficial nem o Supabase.</div>','<div class="note"><strong>Antes de continuar:</strong> esta proposta ainda não é o cardápio oficial. Revise os dias e só então leve para a elaboração.</div>')
          rep2("          'house-pronto':'House conectado. Enviando contexto da semana…',\n          'contexto-enviado':'Contexto enviado ao motor do House…',\n          'contexto-confirmado':'Planejador pronto. Monte a semana e revise os dados.',\n          'contexto-rejeitado':'O House rejeitou o contexto. Reabra o planejador.',\n          'rascunho-recebido':'Rascunho recebido e conferido pela Governança.',\n          'rascunho-rejeitado':'Rascunho rejeitado: contrato ou contexto divergente.'", "          'house-pronto':'Planejador carregado. Preparando a semana…',\n          'contexto-enviado':'Preparando os dados da semana…',\n          'contexto-confirmado':'Planejador pronto. Monte e compare a semana.',\n          'contexto-rejeitado':'Não foi possível validar esta semana. Tente novamente.',\n          'rascunho-recebido':'Proposta recebida. Revise antes de levar ao cardápio oficial.',\n          'rascunho-rejeitado':'A proposta precisa ser revisada antes de continuar.'")
          rep2("        document.getElementById('receipt-meta').textContent='Proposal ID '+registro.proposalId+' · recebido '+new Date(registro.recebidoEm).toLocaleString('pt-BR');", "        document.getElementById('receipt-meta').textContent='Recebido '+new Date(registro.recebidoEm).toLocaleString('pt-BR');")
          rep2("      document.getElementById('abrir').addEventListener('click',function(){\n        try{", "      document.getElementById('abrir').addEventListener('click',function(){\n        document.body.classList.add('planner-open');\n        try{")
          rep2("          status.textContent='Abrindo motor inteligente do TATÁ House…';", "          status.textContent='Abrindo o Planejador TATÁ House…';")
          rep2("        }catch(e){status.textContent=e&&e.message?e.message:'Não foi possível abrir o planejador.';}", "        }catch(e){document.body.classList.remove('planner-open');status.textContent=e&&e.message?e.message:'Não foi possível abrir o Planejador.';}")
          p.write_text(s)
          PY
          git diff --check
          test "$(git diff --name-only | wc -l)" -eq 2
          git diff --name-only | grep -Fx 'compliance/kpis/tatahouse/central.html'
          git diff --name-only | grep -Fx 'compliance/kpis/tatahouse/planejador-v2.html'
      - name: Contract regression
        run: |
          node compliance/kpis/tatahouse/house_governanca_readiness_v1.test.cjs
          node compliance/kpis/tatahouse/house_governanca_clean_candidate_recipe_v1.test.cjs
          node compliance/kpis/tatahouse/house_governanca_promotion_map_v1.test.cjs
          git diff --check
      - name: Commit bounded Lideres files
        run: |
          git config user.name 'VÉRTICE CI'
          git config user.email 'actions@users.noreply.github.com'
          git add compliance/kpis/tatahouse/central.html compliance/kpis/tatahouse/planejador-v2.html
          git commit -m 'ux(tatahouse): simplify operational navigation'
          git pull --rebase origin feat/tatahouse-governanca-phase1
          git push origin HEAD:feat/tatahouse-governanca-phase1
