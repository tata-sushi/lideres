name: TATA House visual audit temporary

on:
  push:
    branches: [feat/tatahouse-governanca-phase1]
    paths:
      - '.github/workflows/tatahouse-visual-audit-temp.yml'

jobs:
  visual:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/tatahouse-governanca-phase1
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Reconstruct clean candidate with UX overlay
        env:
          BASE: 6dc04827b195aaca9d4653618e5a40ca64a1a6f4
          FEATURE: e7b3b791750ba85b1da2f6f229a3168e69c0a217
          PLANNER_SCENARIOS: 05f17fd0cae2438389dfb03973644131c7a2820e
          READONLY_OVERLAY: e6980d8c69f35252bd113d2a96f6594cf278bc48
          SCENARIO_COMPONENT: 36bbd9346bea7ac3a29a09329b5907213684b5ac
          CANDIDATES_SOURCE: 15ee28bbeabef3c5c1220db79396168929984f0f
          CANDIDATES_TEST_SOURCE: 447df60c9dbe8b156b9f2bd993cd92aac484e3a0
          UX_OVERLAY: 23a31f7217ac1e150a9c9cc194acaa907141f72f
          PDFJS_SECURITY: a1302762b9c8ac82e77556f05020b044605ce843
        run: |
          git clone --quiet https://github.com/cesarspichencoff-cmyk/tata-house.github.io.git /tmp/house
          cd /tmp/house
          git fetch --quiet origin "$BASE" "$FEATURE" "$PLANNER_SCENARIOS" "$READONLY_OVERLAY" "$SCENARIO_COMPONENT" "$CANDIDATES_SOURCE" "$CANDIDATES_TEST_SOURCE" "$UX_OVERLAY" "$PDFJS_SECURITY"
          git checkout --quiet --detach "$BASE"
          MANIFEST="$GITHUB_WORKSPACE/compliance/kpis/tatahouse/house_governanca_house_slice_manifest_v1.json"
          jq -r '.classificacoes[] | select(.id=="WHOLE_FILE_INTEGRATION") | .arquivos[]' "$MANIFEST" | while IFS= read -r p; do mkdir -p "$(dirname "$p")"; git show "$FEATURE:$p" > "$p"; done
          mkdir -p src/components/cardapio src/lib/cardapio
          git show "$PLANNER_SCENARIOS:src/components/cardapio/PlanejadorGovernanca.tsx" > src/components/cardapio/PlanejadorGovernanca.tsx
          git show "$SCENARIO_COMPONENT:src/components/cardapio/CenariosGovernanca.tsx" > src/components/cardapio/CenariosGovernanca.tsx
          git show "$CANDIDATES_SOURCE:src/lib/cardapio/governanca-candidatos.ts" > src/lib/cardapio/governanca-candidatos.ts
          git show "$CANDIDATES_TEST_SOURCE:src/lib/cardapio/governanca-candidatos.test.ts" > src/lib/cardapio/governanca-candidatos.test.ts
          git diff "$READONLY_OVERLAY^" "$READONLY_OVERLAY" -- src/components/cardapio/PlanejadorGovernanca.tsx > /tmp/readonly-overlay.patch
          git apply /tmp/readonly-overlay.patch
          git diff "$UX_OVERLAY^" "$UX_OVERLAY" -- src/components/cardapio/PlanejadorGovernanca.tsx src/components/cardapio/CenariosGovernanca.tsx > /tmp/ux-overlay.patch
          test -s /tmp/ux-overlay.patch
          git apply /tmp/ux-overlay.patch
          for p in package.json package-lock.json public/pdf.worker.min.mjs; do mkdir -p "$(dirname "$p")"; git show "$PDFJS_SECURITY:$p" > "$p"; done
          git add -N .
          test "$(git diff --name-only "$BASE" | wc -l)" -eq 31
          ! grep -q 'TrocaInteligenteGovernanca' src/components/cardapio/PlanejadorGovernanca.tsx
          grep -q 'Histórico oficial carregado' src/components/cardapio/PlanejadorGovernanca.tsx
          grep -q 'alertasUteis' src/components/cardapio/PlanejadorGovernanca.tsx
          grep -q 'Nada é publicado sem sua revisão e aprovação' src/components/cardapio/CenariosGovernanca.tsx
          npm ci
          npm test
          npm run typecheck
          npm run lint
          npm run build
          git diff --check
          echo 'VISUAL_POLISHED_CANDIDATE_31_FILES=PASS'
          echo 'VISUAL_POLISHED_UX_OVERLAY=PASS'
      - name: Install Playwright
        run: |
          mkdir -p /tmp/e2e && cd /tmp/e2e
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0
          npx playwright install chromium
      - name: Capture visual audit
        env:
          NODE_PATH: /tmp/e2e/node_modules
        run: node compliance/kpis/tatahouse/__tmp_visual_audit.cjs
      - uses: actions/upload-artifact@v4
        with:
          name: tatahouse-visual-audit-polished
          path: /tmp/visual-audit
          if-no-files-found: error
