name: TATA House Governance Phase 3 receipt temporary

on:
  push:
    branches:
      - feat/tatahouse-governanca-phase1

permissions:
  contents: write

jobs:
  prove:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/tatahouse-governanca-phase1
      - name: Patch and validate local receipt
        run: |
          python3 .github/scripts/tatahouse_phase3_receipt_patch.py
          git diff --check
      - name: Commit proven Phase 3 receipt
        run: |
          rm .github/workflows/tatahouse-phase3-receipt-temp.yml .github/scripts/tatahouse_phase3_receipt_patch.py
          git config user.name "cesarspichencoff-cmyk"
          git config user.email "cesar.spichencoff@gmail.com"
          git add compliance/kpis/tatahouse/cardapio.html .github/workflows/tatahouse-phase3-receipt-temp.yml .github/scripts/tatahouse_phase3_receipt_patch.py
          git commit -m "feat(tatahouse): keep local House publication receipts"
          git push origin HEAD:feat/tatahouse-governanca-phase1
