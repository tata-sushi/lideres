name: TATA House proposal to elaboration safety gate

on:
  push:
    branches: [feat/tatahouse-governanca-phase1]

permissions:
  contents: write

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/tatahouse-governanca-phase1
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Apply fail-closed handoff patch
        run: python3 .github/scripts/house_phase5_elaboracao_patch.py
      - name: Syntax and no-write boundary
        run: |
          node --check compliance/kpis/tatahouse/house_governanca_elaboracao_v1.js
          node --check compliance/kpis/tatahouse/house_governanca_planejador_v1.js
          ! grep -q "\.rpc(" compliance/kpis/tatahouse/house_governanca_elaboracao_v1.js
          grep -q "executar: false" compliance/kpis/tatahouse/house_governanca_elaboracao_v1.js
          grep -q "aguardando_aprovacao" compliance/kpis/tatahouse/house_governanca_elaboracao_v1.js
          grep -q "Persistência central protegida" compliance/kpis/tatahouse/house_governanca_elaboracao_v1.js
          grep -q "Revisar na elaboração oficial" compliance/kpis/tatahouse/planejador-v2.html
          grep -q "houseProposal=" compliance/kpis/tatahouse/planejador-v2.html
          grep -q "house_governanca_elaboracao_v1.js" compliance/kpis/tatahouse/cardapio.html
          grep -q "tata:governanca:semana" compliance/kpis/tatahouse/cardapio.html
      - name: Deterministic proposal mapping and conflicts
        run: |
          node <<'NODE'
          const assert = require('assert');
          const record = {
            versao: 1,
            recebidoEm: '2026-09-06T04:03:20.000Z',
            proposalId: 'prop-v5',
            correlationId: 'corr-v5',
            semanaId: '2026-S37',
            unidadeFonte: 'Itaim',
            unidadeAlvo: 'tata-house',
            dias: [
              ['2026-09-07',70,'Frango assado','Arroz e Feijão','Legumes','Folhas','Fruta'],
              ['2026-09-08',71,'Picadinho bovino','Arroz e Feijão','Batata','','Fruta'],
              ['2026-09-09',72,'Peixe assado','Arroz e Feijão','Legumes','Folhas',''],
              ['2026-09-10',73,'Carne de panela','Arroz e Feijão','','Folhas','Fruta'],
              ['2026-09-11',74,'Frango xadrez','Arroz e Feijão','Legumes','','Fruta'],
              ['2026-09-12',75,'Lombo suíno','Arroz e Feijão','Batata','Folhas',''],
              ['2026-09-13',76,'Frango ao molho','Arroz e Feijão','Legumes','Folhas','Fruta']
            ].map((x,i)=>({indice:i,data:x[0],pessoas:x[1],principal:x[2],guarnicaoFixa:x[3],guarnicao:x[4],salada:x[5],sobremesa:x[6]})),
            diagnostico: { podeEnviar:true, bloqueios:[], alertas:[] }
          };
          global.TataHouseGovernancaPlanejadorV1 = { lerRegistros: () => [record] };
          const api = require('./compliance/kpis/tatahouse/house_governanca_elaboracao_v1.js');
          assert.equal(api.proposalIdDaUrl('https://lideres.tatasushi.tech/cardapio.html?houseProposal=prop-v5'), 'prop-v5');
          assert.equal(api.unidadeInicial('https://lideres.tatasushi.tech/cardapio.html?houseProposal=prop-v5'), 'Itaim');
          assert.equal(api.offsetInicial('https://lideres.tatasushi.tech/cardapio.html?houseProposal=prop-v5', undefined, new Date(2026,8,6,12)), 1);
          const carga = api.criarCargaCandidata(record);
          assert.equal(carga.executar, false);
          assert.equal(carga.statusAlvo, 'aguardando_aprovacao');
          assert.equal(carga.dias.length, 7);
          assert.equal(carga.dias[0].rpc.p_status, 'aguardando_aprovacao');
          assert.equal(carga.dias[0].rpc.p_unidade, 'Itaim');
          assert.equal(carga.dias[0].rpc.p_resumo, 'Frango assado');
          assert.equal(carga.dias[0].rpc.p_almoco, null);
          assert.equal(carga.dias[0].rpc.p_jantar, null);
          assert.equal(carga.dias[0].rpc.p_marmitas, null);
          assert.deepEqual(carga.dias[0].rpc.p_itens.map(x=>x.tipo), ['principal','guarnicao','guarnicao','salada','sobremesa']);
          const c = api.avaliarConflitos(record, [
            {data:'2026-09-08',unidade:'Itaim',dia_id:'dia-2',status:'aguardando_aprovacao',resumo:'Oficial existente'},
            {data:'2026-09-09',unidade:'Pinheiros',dia_id:'dia-x',status:'aguardando_aprovacao',resumo:'Outra unidade'}
          ]);
          assert.equal(c.total, 7);
          assert.equal(c.conflitos.length, 1);
          assert.equal(c.conflitos[0].data, '2026-09-08');
          assert.equal(c.livres.length, 6);
          console.log('HOUSE_PHASE5_MAPPING=PASS');
          console.log('HOUSE_PHASE5_CONFLICT_GUARD=PASS');
          console.log('HOUSE_PHASE5_NO_DB_WRITE=PASS');
          NODE
      - name: Diff check
        run: git diff --check
      - name: Commit Phase 5 review handoff
        run: |
          git config user.name "cesarspichencoff-cmyk"
          git config user.email "cesar.spichencoff@gmail.com"
          git add compliance/kpis/tatahouse/cardapio.html compliance/kpis/tatahouse/planejador-v2.html compliance/kpis/tatahouse/house_governanca_elaboracao_v1.js
          git commit -m "feat(tatahouse): review intelligent proposal in official elaboration"
      - name: Remove temporary gate
        run: |
          rm .github/workflows/house-phase5-elaboracao-temp.yml .github/scripts/house_phase5_elaboracao_patch.py
          git add .github/workflows/house-phase5-elaboracao-temp.yml .github/scripts/house_phase5_elaboracao_patch.py
          git commit -m "test(tatahouse): remove temporary Phase 5 elaboration gate"
          git push origin HEAD:feat/tatahouse-governanca-phase1
