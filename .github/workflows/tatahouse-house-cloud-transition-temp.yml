name: TATÁ House Cloud transition regression

on:
  push:
    branches:
      - 'feat/tatahouse-governanca-phase1'
    paths:
      - '.github/workflows/tatahouse-house-cloud-transition-temp.yml'

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Validate transition and readiness
        shell: bash
        run: |
          set -euo pipefail
          node compliance/kpis/tatahouse/house_governanca_house_cloud_transition_v1.test.cjs
          node compliance/kpis/tatahouse/house_governanca_clean_candidate_recipe_v1.test.cjs
          node compliance/kpis/tatahouse/house_governanca_readiness_v1.test.cjs
          node compliance/kpis/tatahouse/house_governanca_live_access_evidence_v1.test.cjs
          git diff --check
          echo 'HOUSE_CLOUD_TRANSITION_REGRESSION=PASS'
          echo 'SUPABASE_MUTATIONS=0'
