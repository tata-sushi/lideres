name: TATA House Governance central shell E2E temporary

on:
  push:
    branches:
      - feat/tatahouse-governanca-phase1

permissions:
  contents: write

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/tatahouse-governanca-phase1
          fetch-depth: 0
      - uses: actions/checkout@v4
        with:
          repository: cesarspichencoff-cmyk/tata-house.github.io
          ref: feat/house-governanca-phase1
          path: house
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Validate central product boundary
        run: |
          grep -q 'src="https://tata-house.github.io/"' compliance/kpis/tatahouse/central.html
          grep -q 'Central TATÁ House' compliance/kpis/tatahouse/central.html
          node --check compliance/kpis/tatahouse/house_governanca_local_bridge_v1.js
          grep -q 'central.html' compliance/kpis/tatahouse/house_governanca_local_bridge_v1.js
          git diff --check 1f5b627164b9ad9544c4230270cbcae5f2abf55f..HEAD -- compliance/kpis/tatahouse/central.html compliance/kpis/tatahouse/house_governanca_local_bridge_v1.js
      - name: Build House feature
        working-directory: house
        run: |
          npm ci
          npm run typecheck
          npm run build
      - name: Install Chromium
        run: |
          mkdir -p /tmp/central-e2e
          cd /tmp/central-e2e
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 >/dev/null
          npx playwright install --with-deps chromium
      - name: Start exact-origin HTTPS harness
        run: |
          cat > /tmp/central-cert.cnf <<'EOF'
          [req]
          distinguished_name=req_dn
          x509_extensions=v3_req
          prompt=no
          [req_dn]
          CN=tata-house-governanca-central
          [v3_req]
          subjectAltName=@alt_names
          [alt_names]
          DNS.1=tata-house.github.io
          DNS.2=lideres.tatasushi.tech
          EOF
          openssl req -x509 -nodes -newkey rsa:2048 -days 1 -keyout /tmp/central-key.pem -out /tmp/central-cert.pem -config /tmp/central-cert.cnf >/dev/null 2>&1
          sudo -E node .github/scripts/tatahouse_central_e2e.cjs server >/tmp/central-server.log 2>&1 &
          for i in $(seq 1 20); do
            if curl --noproxy '*' --resolve lideres.tatasushi.tech:443:127.0.0.1 -ksSf https://lideres.tatasushi.tech/compliance/kpis/tatahouse/central.html >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/central-server.log
          exit 1
      - name: Prove central shell
        run: |
          set +e
          node .github/scripts/tatahouse_central_e2e.cjs test > central-e2e.log 2>&1
          code=$?
          cat central-e2e.log
          exit $code
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tatahouse-central-e2e-diagnostics
          path: |
            central-e2e.log
            /tmp/central-server.log
      - name: Remove temporary central harness
        if: success()
        run: |
          rm .github/workflows/tatahouse-central-e2e-temp.yml .github/scripts/tatahouse_central_e2e.cjs
          git config user.name "cesarspichencoff-cmyk"
          git config user.email "cesar.spichencoff@gmail.com"
          git add .github/workflows/tatahouse-central-e2e-temp.yml .github/scripts/tatahouse_central_e2e.cjs
          git commit -m "test(tatahouse): remove temporary central E2E harness"
          git push origin HEAD:feat/tatahouse-governanca-phase1
