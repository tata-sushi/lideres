name: TATÁ House legacy evaluation evidence regression

on:
  push:
    branches:
      - 'feat/tatahouse-governanca-phase1'
    paths:
      - '.github/workflows/tatahouse-legacy-evaluation-evidence-regression.yml'

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 6
      - name: Validate historical evaluation evidence and fail-closed readiness
        shell: bash
        run: |
          set -euo pipefail
          node compliance/kpis/tatahouse/house_governanca_legacy_evaluation_schema_evidence_v1.test.cjs
          node compliance/kpis/tatahouse/house_governanca_live_access_evidence_v1.test.cjs
          node compliance/kpis/tatahouse/house_governanca_avaliacoes_ingest_v1.test.cjs
          node compliance/kpis/tatahouse/house_governanca_readiness_v1.test.cjs
          git diff --check HEAD~5 HEAD
          echo 'LEGACY_EVALUATION_EVIDENCE_REGRESSION=PASS'
          echo 'LEGACY_EVALUATION_LIVE_STAYS_UNKNOWN=PASS'
          echo 'BACKEND_CONTRACT_STAYS_FAIL_CLOSED=PASS'
          echo 'SUPABASE_MUTATIONS=0'
