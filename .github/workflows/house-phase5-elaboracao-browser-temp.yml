name: TATA House proposal review browser proof v2
on:
  push:
    branches: [feat/tatahouse-governanca-phase1]
    paths: [.github/workflows/house-phase5-elaboracao-browser-temp.yml]
permissions:
  contents: write
jobs:
  browser-proof:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/tatahouse-governanca-phase1
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install Chromium
        run: |
          mkdir -p /tmp/house-phase5-browser
          cd /tmp/house-phase5-browser
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 >/dev/null
          npx playwright install --with-deps chromium >/dev/null
      - name: Start static server
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/house-phase5-server.log 2>&1 &
          for i in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:4173/compliance/kpis/tatahouse/cardapio.html >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/house-phase5-server.log
          exit 1
      - name: Prove review, week targeting, conflicts and no writes
        run: |
          cat > /tmp/house-phase5-browser/proof.cjs <<'NODE'
          const { chromium } = require('/tmp/house-phase5-browser/node_modules/playwright');
          const assert = (cond, msg) => { if (!cond) throw new Error(msg); };
          const record = {
            versao:1, recebidoEm:'2026-09-06T04:03:20.000Z', proposalId:'prop-browser-v5', correlationId:'corr-browser-v5', semanaId:'2026-S37', unidadeFonte:'Itaim', unidadeAlvo:'tata-house',
            dias:[
              ['2026-09-07',70,'Frango assado','Arroz e Feijão','Legumes','Folhas','Fruta'],
              ['2026-09-08',71,'Picadinho bovino','Arroz e Feijão','Batata','','Fruta'],
              ['2026-09-09',72,'Peixe assado','Arroz e Feijão','Legumes','Folhas',''],
              ['2026-09-10',73,'Carne de panela','Arroz e Feijão','','Folhas','Fruta'],
              ['2026-09-11',74,'Frango xadrez','Arroz e Feijão','Legumes','','Fruta'],
              ['2026-09-12',75,'Lombo suíno','Arroz e Feijão','Batata','Folhas',''],
              ['2026-09-13',76,'Frango ao molho','Arroz e Feijão','Legumes','Folhas','Fruta']
            ].map((x,i)=>({indice:i,data:x[0],pessoas:x[1],principal:x[2],guarnicaoFixa:x[3],guarnicao:x[4],salada:x[5],sobremesa:x[6]})),
            diagnostico:{podeEnviar:true,bloqueios:[],alertas:[]}
          };
          const gateStub = `(function(){
            document.documentElement.setAttribute('data-auth','ok');
            window.__RPC_CALLS=[];
            window.__lideresSession={displayName:'E2E',perfil:'admin',paginas:[]}; window.__lideresPerfil='admin';
            window.__lideresSupa={schema:function(){return {rpc:function(name,args){
              window.__RPC_CALLS.push({name:name,args:args||{}}); var data=[];
              if(name==='cozinhas_lista') data=[{chave:'Itaim',nome:'TATÁ House - Itaim'},{chave:'Pinheiros',nome:'TATÁ House - Pinheiros'}];
              if(name==='refeicoes_semana' && localStorage.getItem('__e2e_conflict')==='1' && args && args.p_unidade==='Itaim') data=[{dia_id:'dia-existing',data:'2026-09-08',status:'aguardando_aprovacao',resumo:'Oficial existente',itens:[]}];
              return Promise.resolve({data:data,error:null});
            }}}};
          })();`;
          async function setup(browser, conflict, viewport={width:1440,height:1000}) {
            const context=await browser.newContext({viewport});
            await context.addInitScript(({record,conflict})=>{
              localStorage.setItem('tata.governanca.planejamentos.v1',JSON.stringify([record]));
              if(conflict) localStorage.setItem('__e2e_conflict','1'); else localStorage.removeItem('__e2e_conflict');
            },{record,conflict});
            const page=await context.newPage();
            await page.route('**/compliance/gate.js', route=>route.fulfill({status:200,contentType:'application/javascript',body:gateStub}));
            await page.route('https://cdn.jsdelivr.net/**', route=>route.fulfill({status:200,contentType:'application/javascript',body:''}));
            await page.goto('http://127.0.0.1:4173/compliance/kpis/tatahouse/cardapio.html?houseProposal=prop-browser-v5',{waitUntil:'domcontentloaded'});
            await page.getByText('Proposta pronta para revisão',{exact:true}).waitFor({state:'visible',timeout:15000});
            assert(await page.locator('#tab-cardapio').evaluate(el=>el.classList.contains('active')),'official elaboration tab is not active');
            return {context,page};
          }
          (async()=>{
            const browser=await chromium.launch({headless:true});
            try{
              {
                const {context,page}=await setup(browser,false);
                await page.getByText('7 dias livres na elaboração oficial.',{exact:false}).waitFor({timeout:15000});
                assert(await page.locator('#ef-unidade').inputValue()==='Itaim','unit was not targeted to Itaim');
                const calls=await page.evaluate(()=>window.__RPC_CALLS);
                const semana=calls.find(x=>x.name==='refeicoes_semana');
                assert(semana,'refeicoes_semana was not called');
                assert(semana.args.p_inicio==='2026-09-07','wrong week start: '+JSON.stringify(semana));
                assert(semana.args.p_unidade==='Itaim','wrong official unit: '+JSON.stringify(semana));
                assert(!calls.some(x=>x.name==='refeicoes_dia_salvar'),'write RPC was called: '+JSON.stringify(calls));
                assert(await page.getByRole('button',{name:'Persistência central protegida'}).isDisabled(),'persistence boundary is not disabled');
                console.log('HOUSE_PHASE5_BROWSER_REVIEW=PASS');
                console.log('HOUSE_PHASE5_TARGET_WEEK_UNIT=PASS',JSON.stringify(semana.args));
                console.log('HOUSE_PHASE5_BROWSER_NO_WRITE=PASS');
                await context.close();
              }
              {
                const {context,page}=await setup(browser,true);
                await page.getByText('1 conflito(s).',{exact:false}).waitFor({timeout:15000});
                await page.getByText('Já existe: Oficial existente',{exact:true}).waitFor();
                const calls=await page.evaluate(()=>window.__RPC_CALLS);
                assert(!calls.some(x=>x.name==='refeicoes_dia_salvar'),'conflict path wrote data: '+JSON.stringify(calls));
                console.log('HOUSE_PHASE5_CONFLICT_BROWSER=PASS');
                await context.close();
              }
              {
                const {context,page}=await setup(browser,false,{width:390,height:844});
                await page.getByText('7 dias livres na elaboração oficial.',{exact:false}).waitFor({timeout:15000});
                const geom=await page.evaluate(()=>({scrollWidth:document.documentElement.scrollWidth,clientWidth:document.documentElement.clientWidth}));
                assert(geom.scrollWidth<=geom.clientWidth+2,'mobile horizontal overflow: '+JSON.stringify(geom));
                console.log('HOUSE_PHASE5_MOBILE_NO_OVERFLOW=PASS',JSON.stringify(geom));
                await context.close();
              }
              console.log('HOUSE_PHASE5_OFFICIAL_REVIEW=PASS');
            } finally { await browser.close(); }
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
          node /tmp/house-phase5-browser/proof.cjs
      - name: Diff check
        run: git diff --check
      - name: Remove temporary browser proof
        if: always()
        run: |
          git config user.name "cesarspichencoff-cmyk"
          git config user.email "cesar.spichencoff@gmail.com"
          rm -f .github/workflows/house-phase5-elaboracao-browser-temp.yml
          git add .github/workflows/house-phase5-elaboracao-browser-temp.yml
          git commit -m "test(tatahouse): remove temporary Phase 5 browser proof v2" || exit 0
          git push origin HEAD:feat/tatahouse-governanca-phase1
