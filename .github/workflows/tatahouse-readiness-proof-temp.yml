name: TATA House readiness dashboard proof temporary

on:
  push:
    branches: [feat/tatahouse-governanca-phase1]
    paths:
      - '.github/workflows/tatahouse-readiness-proof-temp.yml'

permissions:
  contents: write

jobs:
  readiness:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/tatahouse-governanca-phase1
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Permanent readiness regression
        run: node compliance/kpis/tatahouse/house_governanca_readiness_v1.test.cjs

      - name: Install Chromium
        run: |
          mkdir -p /tmp/readiness-proof && cd /tmp/readiness-proof
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 >/dev/null
          npx playwright install --with-deps chromium >/dev/null

      - name: Prepare exact-origin dashboard harness
        run: |
          cat > /tmp/readiness-cert.cnf <<'EOF'
          [req]
          distinguished_name=req_dn
          x509_extensions=v3_req
          prompt=no
          [req_dn]
          CN=tatahouse-readiness-proof
          [v3_req]
          subjectAltName=@alt_names
          [alt_names]
          DNS.1=lideres.tatasushi.tech
          DNS.2=tata-house.github.io
          EOF
          openssl req -x509 -nodes -newkey rsa:2048 -days 1 -keyout /tmp/readiness-key.pem -out /tmp/readiness-cert.pem -config /tmp/readiness-cert.cnf >/dev/null 2>&1

          cat > /tmp/readiness-proof.cjs <<'NODE'
          const https=require('https');
          const fs=require('fs');
          const path=require('path');
          const mode=process.argv[2];
          const root=process.env.GITHUB_WORKSPACE;
          const gateStub="(function(){document.documentElement.dataset.auth='ok';window.__lideresSession={displayName:'E2E Readiness',perfil:'gestao'};})();";

          function send(res,status,body,type='text/plain; charset=utf-8'){
            res.writeHead(status,{'content-type':type,'cache-control':'no-store'});
            res.end(body);
          }
          function mime(file){
            if(file.endsWith('.html'))return'text/html; charset=utf-8';
            if(file.endsWith('.js')||file.endsWith('.cjs'))return'application/javascript; charset=utf-8';
            if(file.endsWith('.json'))return'application/json; charset=utf-8';
            if(file.endsWith('.css'))return'text/css; charset=utf-8';
            return'application/octet-stream';
          }
          function serve(res,base,pathname){
            let rel=decodeURIComponent(pathname);
            while(rel.startsWith('/'))rel=rel.slice(1);
            if(!rel)rel='index.html';
            const baseResolved=path.resolve(base);
            const file=path.resolve(base,rel);
            if(!file.startsWith(baseResolved+path.sep)&&file!==baseResolved)return send(res,403,'forbidden');
            try{
              if(!fs.statSync(file).isFile())return send(res,404,'not found');
              res.writeHead(200,{'content-type':mime(file),'cache-control':'no-store'});
              fs.createReadStream(file).pipe(res);
            }catch{return send(res,404,'not found');}
          }
          function server(){
            https.createServer({key:fs.readFileSync('/tmp/readiness-key.pem'),cert:fs.readFileSync('/tmp/readiness-cert.pem')},(req,res)=>{
              const host=(req.headers.host||'').split(':')[0];
              const pathname=new URL(req.url,'https://'+host).pathname;
              if(host==='lideres.tatasushi.tech'){
                if(pathname==='/compliance/gate.js')return send(res,200,gateStub,'application/javascript; charset=utf-8');
                return serve(res,root,pathname);
              }
              if(host==='tata-house.github.io'){
                return send(res,200,'<!doctype html><title>TATÁ House proof stub</title><main>House official origin stub</main>','text/html; charset=utf-8');
              }
              return send(res,421,'unknown host');
            }).listen(443,'0.0.0.0',()=>console.log('READINESS_SERVER=READY'));
          }

          async function test(){
            const {chromium}=require('/tmp/readiness-proof/node_modules/playwright');
            const browser=await chromium.launch({headless:true,args:['--host-resolver-rules=MAP lideres.tatasushi.tech 127.0.0.1, MAP tata-house.github.io 127.0.0.1','--no-proxy-server']});
            const context=await browser.newContext({ignoreHTTPSErrors:true,viewport:{width:390,height:844},timezoneId:'America/Sao_Paulo'});
            const writes=[];
            context.on('request',r=>{if(!['GET','HEAD','OPTIONS'].includes(r.method()))writes.push({method:r.method(),url:r.url()});});

            const page=await context.newPage();
            await page.goto('https://lideres.tatasushi.tech/compliance/kpis/tatahouse/prontidao.html',{waitUntil:'domcontentloaded'});
            await page.waitForFunction(()=>document.getElementById('global-signal')?.textContent==='PRÉ-SUPABASE PRONTO',null,{timeout:10000});
            if(await page.locator('#fatal').isVisible())throw new Error('fatal inesperado no manifesto válido');
            const badges=await page.locator('.target .badge').allTextContents();
            if(JSON.stringify(badges)!==JSON.stringify(['PRONTO','BLOQUEADO','BLOQUEADO']))throw new Error('targets inesperados '+JSON.stringify(badges));
            if(await page.evaluate(()=>document.documentElement.scrollWidth>document.documentElement.clientWidth))throw new Error('overflow mobile no painel');
            console.log('READINESS_UI_TARGETS=PASS');
            console.log('READINESS_UI_MOBILE=PASS');

            const central=await context.newPage();
            await central.goto('https://lideres.tatasushi.tech/compliance/kpis/tatahouse/central.html',{waitUntil:'domcontentloaded'});
            const readinessLink=central.locator('a[data-readiness-entry="v1"]');
            if(await readinessLink.count()!==1)throw new Error('entrada Prontidão ausente/duplicada');
            if((await readinessLink.getAttribute('href'))!=='prontidao.html')throw new Error('href de Prontidão inválido');
            if((await central.locator('#house-frame').getAttribute('src'))!=='https://tata-house.github.io/')throw new Error('House oficial deixou de ser origem única');
            console.log('READINESS_CENTRAL_WIRING=PASS');

            const closed=await context.newPage();
            await closed.route('**/house_governanca_readiness_v1.json',route=>route.fulfill({status:200,contentType:'application/json',body:'{"contrato":"inválido","versao":1}'}));
            await closed.goto('https://lideres.tatasushi.tech/compliance/kpis/tatahouse/prontidao.html',{waitUntil:'domcontentloaded'});
            await closed.waitForFunction(()=>document.getElementById('global-signal')?.textContent==='FAIL-CLOSED',null,{timeout:10000});
            if(!(await closed.locator('#fatal').isVisible()))throw new Error('manifesto inválido não exibiu bloqueio fatal');
            console.log('READINESS_UI_FAIL_CLOSED=PASS');

            if(writes.length)throw new Error('escrita inesperada '+JSON.stringify(writes));
            console.log('READINESS_NO_WRITES=PASS');
            await browser.close();
          }

          if(mode==='server')server();
          else test().catch(err=>{console.error(err);process.exit(1)});
          NODE
          node --check /tmp/readiness-proof.cjs

      - name: Start exact-origin HTTPS harness
        run: |
          sudo -E node /tmp/readiness-proof.cjs server >/tmp/readiness-server.log 2>&1 &
          for i in $(seq 1 20); do
            if curl --noproxy '*' --resolve lideres.tatasushi.tech:443:127.0.0.1 -ksSf https://lideres.tatasushi.tech/compliance/kpis/tatahouse/prontidao.html >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/readiness-server.log
          exit 1

      - name: Prove readiness dashboard
        run: node /tmp/readiness-proof.cjs test

      - name: Diff hygiene
        run: git diff --check

      - name: Remove temporary workflow only
        if: always()
        run: |
          git config user.name "cesarspichencoff-cmyk"
          git config user.email "cesar.spichencoff@gmail.com"
          for attempt in 1 2 3; do
            git fetch origin feat/tatahouse-governanca-phase1
            git reset --hard origin/feat/tatahouse-governanca-phase1
            if [ ! -f .github/workflows/tatahouse-readiness-proof-temp.yml ]; then exit 0; fi
            git rm -f -- .github/workflows/tatahouse-readiness-proof-temp.yml
            git commit -m "test(tatahouse): remove temporary readiness proof"
            if git push origin HEAD:feat/tatahouse-governanca-phase1; then exit 0; fi
            sleep 1
          done
          exit 1
