name: TATA House readonly exact-origin v2 temporary

on:
  push:
    branches:
      - feat/tatahouse-governanca-phase1
    paths:
      - '.github/workflows/tatahouse-readonly-exact-origin-v2-temp.yml'

jobs:
  e2e:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/tatahouse-governanca-phase1

      - name: Checkout House feature
        run: git clone --depth 1 --branch feat/house-governanca-phase1 https://github.com/cesarspichencoff-cmyk/tata-house.github.io.git /tmp/house

      - name: Build House static export
        working-directory: /tmp/house
        run: |
          npm ci
          npm run build
          test -f out/planejar.html

      - name: Install Playwright
        run: |
          mkdir -p /tmp/e2e
          cd /tmp/e2e
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0
          npx playwright install chromium

      - name: Exact-origin readonly proof
        env:
          NODE_PATH: /tmp/e2e/node_modules
        run: node compliance/kpis/tatahouse/__tmp_readonly_exact_origin_e2e.cjs

      - name: Diff hygiene
        run: git diff --check
