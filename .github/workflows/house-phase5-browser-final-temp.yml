name: TATA House final proposal review proof
on:
  push:
    branches: [feat/tatahouse-governanca-phase1]
    paths: [.github/workflows/house-phase5-browser-final-temp.yml]
permissions:
  contents: write
jobs:
  proof:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/tatahouse-governanca-phase1
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install Chromium
        run: |
          mkdir -p /tmp/house-proof && cd /tmp/house-proof
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 >/dev/null
          npx playwright install --with-deps chromium >/dev/null
      - name: Start server
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/house-server.log 2>&1 &
          for i in $(seq 1 20); do curl -fsS http://127.0.0.1:4173/compliance/kpis/tatahouse/cardapio.html >/dev/null && exit 0; sleep 1; done
          cat /tmp/house-server.log; exit 1
      - name: Browser proof
        run: |
          cat > /tmp/house-proof/proof.cjs <<'NODE'
          const { chromium } = require('/tmp/house-proof/node_modules/playwright');
          const assert=(v,m)=>{if(!v)throw new Error(m)};
          const record={versao:1,recebidoEm:'2026-09-06T04:03:20.000Z',proposalId:'prop-final-v5',correlationId:'corr-final-v5',semanaId:'2026-S37',unidadeFonte:'Itaim',unidadeAlvo:'tata-house',dias:[
            ['2026-09-07',70,'Frango assado','Arroz e Feijão','Legumes','Folhas','Fruta'],['2026-09-08',71,'Picadinho bovino','Arroz e Feijão','Batata','','Fruta'],['2026-09-09',72,'Peixe assado','Arroz e Feijão','Legumes','Folhas',''],['2026-09-10',73,'Carne de panela','Arroz e Feijão','','Folhas','Fruta'],['2026-09-11',74,'Frango xadrez','Arroz e Feijão','Legumes','','Fruta'],['2026-09-12',75,'Lombo suíno','Arroz e Feijão','Batata','Folhas',''],['2026-09-13',76,'Frango ao molho','Arroz e Feijão','Legumes','Folhas','Fruta']].map((x,i)=>({indice:i,data:x[0],pessoas:x[1],principal:x[2],guarnicaoFixa:x[3],guarnicao:x[4],salada:x[5],sobremesa:x[6]})),diagnostico:{podeEnviar:true,bloqueios:[],alertas:[]}};
          const gate=`(function(){document.documentElement.setAttribute('data-auth','ok');window.__RPC_CALLS=[];window.__lideresSession={displayName:'E2E',perfil:'admin',paginas:[]};window.__lideresPerfil='admin';window.__lideresSupa={schema:function(){return{rpc:function(name,args){window.__RPC_CALLS.push({name:name,args:args||{}});var data=[];if(name==='cozinhas_lista')data=[{chave:'Itaim',nome:'TATÁ House - Itaim'},{chave:'Pinheiros',nome:'TATÁ House - Pinheiros'}];if(name==='refeicoes_elab_primeira_data')data=[];if(name==='refeicoes_semana'&&localStorage.getItem('__conflict')==='1'&&args&&args.p_unidade==='Itaim')data=[{dia_id:'existing',data:'2026-09-08',status:'aguardando_aprovacao',resumo:'Oficial existente',itens:[]}];return Promise.resolve({data:data,error:null})}}}}})();`;
          async function setup(browser,conflict,viewport={width:1440,height:1000}){const context=await browser.newContext({viewport});await context.addInitScript(({record,conflict})=>{localStorage.setItem('tata.governanca.planejamentos.v1',JSON.stringify([record]));conflict?localStorage.setItem('__conflict','1'):localStorage.removeItem('__conflict')},{record,conflict});const page=await context.newPage();await page.route('**/compliance/gate.js',r=>r.fulfill({status:200,contentType:'application/javascript',body:gate}));await page.route('https://cdn.jsdelivr.net/**',r=>r.fulfill({status:200,contentType:'application/javascript',body:''}));await page.goto('http://127.0.0.1:4173/compliance/kpis/tatahouse/cardapio.html?houseProposal=prop-final-v5',{waitUntil:'domcontentloaded'});await page.getByText('Proposta pronta para revisão',{exact:true}).waitFor({state:'visible',timeout:15000});assert(await page.locator('#tab-cardapio').evaluate(el=>el.classList.contains('active')),'Elaboração não abriu');return{context,page}}
          (async()=>{const browser=await chromium.launch({headless:true});try{
            {const {context,page}=await setup(browser,false);await page.getByText('7 dias livres na elaboração oficial.',{exact:false}).waitFor({timeout:15000});assert(await page.locator('#ef-unidade').inputValue()==='Itaim','unidade incorreta');const calls=await page.evaluate(()=>window.__RPC_CALLS);const semanas=calls.filter(x=>x.name==='refeicoes_semana');assert(semanas.length>=1,'sem chamada semana');assert(semanas.every(x=>x.args.p_inicio==='2026-09-07'&&x.args.p_unidade==='Itaim'),'alvo incorreto '+JSON.stringify(semanas));assert(!calls.some(x=>x.name==='refeicoes_elab_primeira_data'),'fluxo antigo sobrescreveu proposta');assert(!calls.some(x=>x.name==='refeicoes_dia_salvar'),'houve escrita');assert(await page.getByRole('button',{name:'Persistência central protegida'}).isDisabled(),'boundary habilitada');console.log('HOUSE_PHASE5_TARGET_AND_NO_WRITE=PASS');await context.close()}
            {const {context,page}=await setup(browser,true);await page.getByText('1 conflito(s).',{exact:false}).waitFor({timeout:15000});await page.getByText('Já existe: Oficial existente',{exact:true}).waitFor();const calls=await page.evaluate(()=>window.__RPC_CALLS);assert(!calls.some(x=>x.name==='refeicoes_dia_salvar'),'conflito escreveu');console.log('HOUSE_PHASE5_CONFLICT=PASS');await context.close()}
            {const {context,page}=await setup(browser,false,{width:390,height:844});await page.getByText('7 dias livres na elaboração oficial.',{exact:false}).waitFor({timeout:15000});const g=await page.evaluate(()=>({scrollWidth:document.documentElement.scrollWidth,clientWidth:document.documentElement.clientWidth}));assert(g.scrollWidth<=g.clientWidth+2,'overflow '+JSON.stringify(g));console.log('HOUSE_PHASE5_MOBILE=PASS',JSON.stringify(g));await context.close()}
            console.log('HOUSE_PHASE5_OFFICIAL_REVIEW=PASS');
          }finally{await browser.close()}})().catch(e=>{console.error(e);process.exit(1)});
          NODE
          node /tmp/house-proof/proof.cjs
      - name: Diff check
        run: git diff --check
      - name: Cleanup
        if: always()
        run: |
          git config user.name "cesarspichencoff-cmyk"
          git config user.email "cesar.spichencoff@gmail.com"
          rm -f .github/workflows/house-phase5-browser-final-temp.yml
          git add .github/workflows/house-phase5-browser-final-temp.yml
          git commit -m "test(tatahouse): remove final Phase 5 browser proof" || exit 0
          git push origin HEAD:feat/tatahouse-governanca-phase1
