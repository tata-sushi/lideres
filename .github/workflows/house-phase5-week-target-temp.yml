name: TATA House proposal week targeting patch
on:
  push:
    branches: [feat/tatahouse-governanca-phase1]
    paths: [.github/workflows/house-phase5-week-target-temp.yml]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/tatahouse-governanca-phase1
          fetch-depth: 0
      - name: Apply fail-closed patch
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('compliance/kpis/tatahouse/cardapio.html')
          s=p.read_text()
          a="""  var _houseElab = window.TataHouseGovernancaElaboracaoV1 || null;\n  var currentWeekOffset = _houseElab ? _houseElab.offsetInicial() : 0, _monday = null, _semana = [], _editIdx = -1, _catalogo = [], _repertorio = [], _uniElab = (_houseElab && _houseElab.unidadeInicial()) || '__todas__', _uniProc = '__todas__', _cozinhas = [];"""
          b="""  var _houseElab = window.TataHouseGovernancaElaboracaoV1 || null;\n  var _houseProposalAtiva = !!(_houseElab && _houseElab.proposalIdDaUrl && _houseElab.proposalIdDaUrl());\n  var currentWeekOffset = _houseElab ? _houseElab.offsetInicial() : 0, _monday = null, _semana = [], _editIdx = -1, _catalogo = [], _repertorio = [], _uniElab = (_houseElab && _houseElab.unidadeInicial()) || '__todas__', _uniProc = '__todas__', _cozinhas = [];"""
          if s.count(a)!=1: raise SystemExit('init anchor mismatch')
          s=s.replace(a,b,1)
          a2="""        supa.schema('tata_plus').rpc('refeicoes_elab_primeira_data',{ p_unidade:_uniElab }).then(function(r){\n          var dt=(r&&!r.error&&r.data)?r.data:null;\n          currentWeekOffset = dt ? Math.round((mondayOf(new Date(dt+'T12:00:00'))-mondayOf(new Date()))/604800000) : 0;\n          carregarSemana();\n        }, function(){ carregarSemana(); });"""
          b2="""        supa.schema('tata_plus').rpc('refeicoes_elab_primeira_data',{ p_unidade:_uniElab }).then(function(r){\n          var dt=(r&&!r.error&&typeof r.data==='string'&&/^\\d{4}-\\d{2}-\\d{2}$/.test(r.data))?r.data:null;\n          currentWeekOffset = dt ? Math.round((mondayOf(new Date(dt+'T12:00:00'))-mondayOf(new Date()))/604800000) : 0;\n          if(!Number.isFinite(currentWeekOffset)) currentWeekOffset=0;\n          carregarSemana();\n        }, function(){ carregarSemana(); });"""
          if s.count(a2)!=1: raise SystemExit('first-date anchor mismatch')
          s=s.replace(a2,b2,1)
          a3="""    carregarCozinhas(function(){ irParaPrimeiraDataElab(); });"""
          b3="""    carregarCozinhas(function(){\n      if(_houseProposalAtiva) carregarSemana();\n      else irParaPrimeiraDataElab();\n    });"""
          if s.count(a3)!=1: raise SystemExit('load anchor mismatch')
          s=s.replace(a3,b3,1)
          p.write_text(s)
          PY
      - name: Verify patch boundary
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s=Path('compliance/kpis/tatahouse/cardapio.html').read_text()
          assert "_houseProposalAtiva" in s
          assert "if(_houseProposalAtiva) carregarSemana();" in s
          assert "typeof r.data==='string'" in s
          assert "if(!Number.isFinite(currentWeekOffset)) currentWeekOffset=0;" in s
          print('HOUSE_PHASE5_WEEK_TARGET_PATCH=PASS')
          PY
          git diff --check
      - name: Commit functional patch
        run: |
          git config user.name "cesarspichencoff-cmyk"
          git config user.email "cesar.spichencoff@gmail.com"
          git add compliance/kpis/tatahouse/cardapio.html
          git commit -m "fix(tatahouse): preserve proposal week in official elaboration"
          git push origin HEAD:feat/tatahouse-governanca-phase1
      - name: Remove temporary patch workflow
        if: always()
        run: |
          git fetch origin feat/tatahouse-governanca-phase1
          git reset --hard origin/feat/tatahouse-governanca-phase1
          git config user.name "cesarspichencoff-cmyk"
          git config user.email "cesar.spichencoff@gmail.com"
          rm -f .github/workflows/house-phase5-week-target-temp.yml
          git add .github/workflows/house-phase5-week-target-temp.yml
          git commit -m "test(tatahouse): remove temporary week targeting patch" || exit 0
          git push origin HEAD:feat/tatahouse-governanca-phase1
