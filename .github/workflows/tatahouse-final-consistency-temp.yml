name: TATA House final consistency temporary

on:
  push:
    branches:
      - feat/tatahouse-governanca-phase1
    paths:
      - '.github/workflows/tatahouse-final-consistency-temp.yml'

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/tatahouse-governanca-phase1
      - name: Live readonly preflight
        run: node compliance/kpis/tatahouse/house_governanca_live_readonly_preflight_v1.test.cjs
      - name: Promotion map
        run: node compliance/kpis/tatahouse/house_governanca_promotion_map_v1.test.cjs
      - name: Readiness
        run: node compliance/kpis/tatahouse/house_governanca_readiness_v1.test.cjs
      - name: Diff hygiene
        run: git diff --check
