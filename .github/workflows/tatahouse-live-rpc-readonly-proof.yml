name: TATÁ House live RPC read-only proof

on:
  push:
    branches:
      - 'feat/tatahouse-governanca-phase1'
    paths:
      - '.github/workflows/tatahouse-live-rpc-readonly-proof.yml'

permissions:
  contents: read

jobs:
  live-readonly:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Probe only known read-only RPCs
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');

          const gate = fs.readFileSync('compliance/gate.js', 'utf8');
          const url = gate.match(/var SUPA_URL = '([^']+)'/)?.[1];
          const publishable = 'sb_publishable_X3pKD_F1QLAyxbxFU32HqQ_pRp9p6JQ';
          if (!url) throw new Error('Supabase URL not found in gate.js');

          const baseHeaders = {
            apikey: publishable,
            'Accept-Profile': 'tata_plus',
            'Content-Profile': 'tata_plus',
            'Content-Type': 'application/json',
          };

          const probes = [
            ['cozinhas_lista', {}],
            ['catalogo_produtos', {}],
            ['refeicoes_itens_repertorio', {}],
            ['refeicoes_semana', { p_inicio: '2026-08-31', p_unidade: 'Itaim' }],
            ['refeicoes_relatorio', { p_unidade: 'Itaim' }],
            ['refeicoes_processamento', { p_unidade: 'Itaim' }],
            ['refeicoes_relatorio_detalhado', {
              p_unidade: 'Itaim',
              p_data_ini: '2026-08-24',
              p_data_fim: '2026-09-06',
            }],
          ];

          async function probe(name, payload) {
            const res = await fetch(`${url}/rest/v1/rpc/${name}`, {
              method: 'POST',
              headers: baseHeaders,
              body: JSON.stringify(payload),
            });
            const text = await res.text();
            let parsed = null;
            try { parsed = JSON.parse(text); } catch {}
            const kind = Array.isArray(parsed) ? 'array' : (parsed === null ? 'null' : typeof parsed);
            const rows = Array.isArray(parsed) ? parsed.length : null;
            console.log(`LIVE_RPC_${name.toUpperCase()}_HTTP=${res.status}`);
            console.log(`LIVE_RPC_${name.toUpperCase()}_KIND=${kind}`);
            if (rows !== null) console.log(`LIVE_RPC_${name.toUpperCase()}_ROWS=${rows}`);
            if (!res.ok) {
              const safeCode = parsed && typeof parsed === 'object' ? (parsed.code || '') : '';
              const safeMessage = parsed && typeof parsed === 'object' ? (parsed.message || '') : '';
              console.log(`LIVE_RPC_${name.toUpperCase()}_ERROR_CODE=${String(safeCode).slice(0,80)}`);
              console.log(`LIVE_RPC_${name.toUpperCase()}_ERROR_MESSAGE=${String(safeMessage).slice(0,140).replace(/\s+/g,' ')}`);
            }
            return { name, status: res.status, ok: res.ok, parsed };
          }

          async function main() {
            const results = [];
            for (const [name, payload] of probes) results.push(await probe(name, payload));

            const target = results.find((r) => r.name === 'refeicoes_relatorio_detalhado');
            if (!target) throw new Error('target read-only RPC was not probed');
            if (!target.ok) throw new Error(`refeicoes_relatorio_detalhado live HTTP ${target.status}`);
            if (!Array.isArray(target.parsed)) throw new Error('refeicoes_relatorio_detalhado live contract is not array');

            console.log('LIVE_TARGET_RPC=PASS');
            console.log('LIVE_KNOWN_READONLY_PROBES_COMPLETE=PASS');
            console.log('LIVE_USER_BEARER_TOKEN_USED=NO');
            console.log('LIVE_OPENAPI_INTROSPECTION_USED=NO');
            console.log('LIVE_MUTATION_RPC_CALLS=0');
          }

          main().catch((err) => {
            console.error(`PROOF_FAILURE=${err.message}`);
            process.exit(1);
          });
          NODE
