name: TATA House readiness overflow diagnostic temporary

on:
  push:
    branches: [feat/tatahouse-governanca-phase1]
    paths:
      - '.github/workflows/tatahouse-readiness-overflow-diagnostic-temp.yml'

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/tatahouse-governanca-phase1
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install Chromium
        run: |
          mkdir -p /tmp/readiness-overflow && cd /tmp/readiness-overflow
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 >/dev/null
          npx playwright install --with-deps chromium >/dev/null
      - name: Start static server
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/readiness-http.log 2>&1 &
          for i in $(seq 1 20); do curl -fsS http://127.0.0.1:8765/compliance/kpis/tatahouse/prontidao.html >/dev/null && exit 0; sleep 1; done
          cat /tmp/readiness-http.log
          exit 1
      - name: Locate overflowing elements
        run: |
          cat > /tmp/readiness-overflow/diagnose.cjs <<'NODE'
          const {chromium}=require('playwright');
          (async()=>{
            const browser=await chromium.launch({headless:true});
            const page=await browser.newPage({viewport:{width:390,height:844}});
            await page.route('**/compliance/gate.js',r=>r.fulfill({status:200,contentType:'application/javascript',body:"document.documentElement.dataset.auth='ok';"}));
            await page.goto('http://127.0.0.1:8765/compliance/kpis/tatahouse/prontidao.html',{waitUntil:'domcontentloaded'});
            await page.waitForFunction(()=>document.getElementById('global-signal')?.textContent==='PRÉ-SUPABASE PRONTO');
            const result=await page.evaluate(()=>{
              const vw=document.documentElement.clientWidth;
              const docScroll=document.documentElement.scrollWidth;
              const offenders=[...document.querySelectorAll('*')].map((el,i)=>{
                const r=el.getBoundingClientRect();
                const cs=getComputedStyle(el);
                return {i,tag:el.tagName.toLowerCase(),id:el.id||'',cls:typeof el.className==='string'?el.className:'',text:(el.textContent||'').trim().replace(/\s+/g,' ').slice(0,120),left:+r.left.toFixed(1),right:+r.right.toFixed(1),width:+r.width.toFixed(1),scrollWidth:el.scrollWidth,clientWidth:el.clientWidth,whiteSpace:cs.whiteSpace,overflowX:cs.overflowX};
              }).filter(x=>x.right>vw+0.5||x.left<-0.5||x.scrollWidth>x.clientWidth+1);
              return {vw,docScroll,offenders};
            });
            console.log('READINESS_OVERFLOW_DIAGNOSTIC='+JSON.stringify(result));
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
          cd /tmp/readiness-overflow && node diagnose.cjs
      - name: Remove temporary diagnostic only
        if: always()
        run: |
          git config user.name "cesarspichencoff-cmyk"
          git config user.email "cesar.spichencoff@gmail.com"
          git fetch origin feat/tatahouse-governanca-phase1
          git reset --hard origin/feat/tatahouse-governanca-phase1
          if [ ! -f .github/workflows/tatahouse-readiness-overflow-diagnostic-temp.yml ]; then exit 0; fi
          git rm -f -- .github/workflows/tatahouse-readiness-overflow-diagnostic-temp.yml
          git commit -m "test(tatahouse): remove temporary readiness overflow diagnostic"
          git push origin HEAD:feat/tatahouse-governanca-phase1
